[package]
name = "navo-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3.27.0"
navo-automotive = { path = "../crates/navo-automotive" }
navo-fs = { path = "../crates/navo-fs" }
navo-index = { path = "../crates/navo-index" }
navo-syntax = { path = "../crates/navo-syntax" }

[[bin]]
name = "pipe_frame"
path = "fuzz_targets/pipe_frame.rs"
test = false
doc = false

[[bin]]
name = "automotive"
path = "fuzz_targets/automotive.rs"
test = false
doc = false

[[bin]]
name = "npp_language"
path = "fuzz_targets/npp_language.rs"
test = false
doc = false

[[bin]]
name = "archive_listing"
path = "fuzz_targets/archive_listing.rs"
test = false
doc = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
excessive_nesting = "deny"
expect_used = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"
