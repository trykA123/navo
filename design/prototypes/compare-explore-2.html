<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Navo Compare Round 2</title>
<!-- Design round prototype: four new Compare directions plus the P42 V4 reference behind one picker. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Theme tokens. Names follow crates/navo-ui/src/tokens (palette Open Sea, surfaces, diff, git, syntax, shadows, motion). */
:root {
  color-scheme: light;
  --rail: oklch(95.5% 0.012 225);
  --background: oklch(98.5% 0.008 225);
  --surface: oklch(99.8% 0 225);
  --zebra: oklch(97% 0.010 225);
  --line: oklch(89% 0.014 225);
  --text: oklch(22% 0.014 225);
  --muted: oklch(48.8% 0.017 225);
  --faint: oklch(64.8% 0.017 225);
  --hover: oklch(94.25% 0.027 218);
  --selection: oklch(90% 0.046 218);
  --on-selection: var(--text);
  --accent: oklch(52% 0.092 218);
  --accent-text: oklch(48.8% 0.086 218);
  --mark: oklch(48.8% 0.144 22);
  --folder: oklch(49.6% 0.102 80);
  --kind-code: oklch(49.6% 0.12 262);
  --kind-image: oklch(49.6% 0.12 340);
  --kind-archive: oklch(49.6% 0.12 45);
  --kind-doc: oklch(49.6% 0.12 235);
  --kind-sheet: oklch(49.6% 0.12 165);
  --ok: oklch(48% 0.108 160);
  --warn: oklch(49.6% 0.102 80);
  --ink: oklch(20% 0.02 250);
  /* surfaces */
  --card: var(--surface);
  --card-edge: var(--line);
  --card-ring: oklch(61.3% 0.075 225);
  --current: var(--selection);
  --field: var(--rail);
  --keycap-face: var(--surface);
  --keycap-edge: var(--line);
  --keycap-label: var(--text);
  --keycap-lit: var(--accent);
  --keycap-lit-label: var(--background);
  --layer-tint: var(--hover);
  --pill: var(--surface);
  --pill-ring: var(--accent);
  --pill-label: var(--accent-text);
  --progress-track: var(--line);
  --progress-fill: var(--accent);
  --sheet: var(--surface);
  --scrim: oklch(20% 0.02 250 / 0.4);
  /* diff */
  --diff-delete-text: oklch(50% 0.17 27); --diff-delete-mark: oklch(62% 0.17 27); --diff-delete-fill: oklch(88% 0.07 27); --diff-delete-wash: oklch(96.5% 0.02 27);
  --diff-add-text: oklch(46% 0.12 150); --diff-add-mark: oklch(60% 0.14 150); --diff-add-fill: oklch(87% 0.08 150); --diff-add-wash: oklch(96.5% 0.025 150);
  --diff-change-text: oklch(48% 0.11 70); --diff-change-mark: oklch(60% 0.13 70); --diff-change-fill: oklch(88% 0.07 70); --diff-change-wash: oklch(97% 0.025 80);
  --diff-moved-text: oklch(48% 0.10 210); --diff-moved-mark: oklch(60% 0.10 210); --diff-moved-fill: oklch(88% 0.06 210); --diff-moved-wash: oklch(96.5% 0.02 210);
  --diff-conflict-text: oklch(50% 0.17 27); --diff-conflict-mark: oklch(50% 0.17 27); --diff-conflict-fill: oklch(88% 0.07 27); --diff-conflict-wash: oklch(96.5% 0.02 27);
  --diff-auto-merged-text: oklch(50% 0.15 262); --diff-auto-merged-mark: oklch(50% 0.15 262); --diff-auto-merged-fill: oklch(88% 0.06 262); --diff-auto-merged-wash: oklch(96.5% 0.02 262);
  --diff-gap-hatch: oklch(91% 0.006 260);
  /* git */
  --git-conflict: oklch(56% 0.2 25); --git-modified: oklch(56% 0.138 55); --git-sync: oklch(56% 0.128 240); --git-quiet: oklch(56.8% 0.017 225);
  /* syntax (Oxidised Iron) */
  --syntax-keyword: oklch(50% 0.125 40); --syntax-type: oklch(41% 0.08 82); --syntax-function: oklch(48% 0.075 210); --syntax-number: oklch(49% 0.1 330); --syntax-string: oklch(48% 0.1 145); --syntax-comment: oklch(54% 0.015 60); --syntax-attribute: oklch(46% 0.07 62);
  /* shadows */
  --shadow-card: 0 0 0 1px var(--card-edge);
  --shadow-menu: 0 18px 44px -12px oklch(21% 0.012 260 / 0.28), 0 2px 6px oklch(21% 0.012 260 / 0.06), 0 0 0 1px var(--card-edge);
  --shadow-sheet: 0 28px 60px -20px oklch(20% 0.02 250 / 0.42), 0 0 0 1px var(--card-edge);
  --shadow-chip: 0 2px 6px oklch(21% 0.012 260 / 0.08), 0 8px 20px -10px oklch(21% 0.012 260 / 0.2);
  --shadow-focus: 0 0 0 2px var(--pill-ring);
  /* motion, type, space, radii (design_b) */
  --motion-fade: 80ms;
  --font-ui: "Inter", "Segoe UI Variable", "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --fs-12: 0.75rem; --fs-13: 0.8125rem; --fs-14: 0.875rem; --fs-16: 1rem; --fs-20: 1.25rem;
  --s-xxs: 2px; --s-xs: 4px; --s-sm: 6px; --s-md: 8px; --s-lg: 10px; --s-xl: 12px; --s-xxl: 16px; --s-3xl: 24px;
  --r-xs: 3px; --r-sm: 4px; --r-md: 6px; --r-lg: 7px; --r-card: 8px; --r-sheet: 12px; --r-pill: 15px; --r-full: 999px;
  --row-h: 24px; --code-h: 20px; --bar-h: 46px; --status-h: 30px;
  --z-sticky: 5; --z-pop: 20; --z-sheet: 30; --z-toast: 40; --z-shell: 50;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --rail: oklch(19% 0.014 225);
  --background: oklch(22.5% 0.014 225);
  --surface: oklch(26.5% 0.014 225);
  --zebra: oklch(20.75% 0.014 225);
  --line: oklch(33% 0.014 225);
  --text: oklch(93.8% 0.014 225);
  --muted: oklch(72% 0.017 225);
  --faint: oklch(54.8% 0.017 225);
  --hover: oklch(27.75% 0.036 218);
  --selection: oklch(33% 0.058 218);
  --accent: oklch(76% 0.11 218);
  --accent-text: oklch(76% 0.11 218);
  --mark: oklch(76% 0.166 22);
  --folder: oklch(82% 0.13 80);
  --kind-code: oklch(76% 0.12 262);
  --kind-image: oklch(76% 0.12 340);
  --kind-archive: oklch(76% 0.12 45);
  --kind-doc: oklch(76% 0.12 235);
  --kind-sheet: oklch(76% 0.12 165);
  --ok: oklch(85% 0.13 160);
  --warn: oklch(82% 0.13 80);
  --ink: oklch(0% 0 0);
  --card-ring: oklch(65.3% 0.091 225);
  --scrim: oklch(0% 0 0 / 0.4);
  --diff-delete-text: oklch(76% 0.13 27); --diff-delete-mark: oklch(66% 0.16 27); --diff-delete-fill: oklch(36% 0.09 27); --diff-delete-wash: oklch(21% 0.03 27);
  --diff-add-text: oklch(78% 0.13 150); --diff-add-mark: oklch(68% 0.14 150); --diff-add-fill: oklch(36% 0.08 150); --diff-add-wash: oklch(21% 0.03 150);
  --diff-change-text: oklch(82% 0.12 78); --diff-change-mark: oklch(74% 0.13 78); --diff-change-fill: oklch(36% 0.08 78); --diff-change-wash: oklch(21.5% 0.025 78);
  --diff-moved-text: oklch(78% 0.09 210); --diff-moved-mark: oklch(68% 0.10 210); --diff-moved-fill: oklch(36% 0.06 210); --diff-moved-wash: oklch(21% 0.025 210);
  --diff-conflict-text: oklch(76% 0.13 27); --diff-conflict-mark: oklch(76% 0.13 27); --diff-conflict-fill: oklch(36% 0.09 27); --diff-conflict-wash: oklch(21% 0.03 27);
  --diff-auto-merged-text: oklch(72% 0.13 262); --diff-auto-merged-mark: oklch(72% 0.13 262); --diff-auto-merged-fill: oklch(36% 0.08 262); --diff-auto-merged-wash: oklch(21% 0.03 262);
  --diff-gap-hatch: oklch(23% 0.01 260);
  --git-conflict: oklch(72% 0.15 25); --git-modified: oklch(72% 0.15 55); --git-sync: oklch(72% 0.15 240); --git-quiet: oklch(63.4% 0.017 225);
  --syntax-keyword: oklch(75% 0.095 40); --syntax-type: oklch(85% 0.075 82); --syntax-function: oklch(80% 0.065 210); --syntax-number: oklch(77% 0.075 330); --syntax-string: oklch(80% 0.08 145); --syntax-comment: oklch(64% 0.014 60); --syntax-attribute: oklch(80% 0.06 62);
  --shadow-menu: 0 22px 48px -12px oklch(0% 0 0 / 0.7), 0 0 0 1px oklch(93% 0.006 260 / 0.04), 0 0 0 1px var(--card-edge);
  --shadow-sheet: 0 28px 60px -20px oklch(0% 0 0 / 0.85), 0 0 0 1px var(--card-edge);
  --shadow-chip: 0 2px 6px oklch(0% 0 0 / 0.35), 0 10px 24px -10px oklch(0% 0 0 / 0.6);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--rail); color: var(--text); font-family: var(--font-ui); font-size: var(--fs-13); line-height: 1.35; -webkit-font-smoothing: antialiased; overflow: hidden; font-feature-settings: "cv11", "ss01"; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pill-ring); outline-offset: 2px; }
kbd { display: inline-flex; align-items: center; height: 18px; font-family: var(--font-ui); font-size: var(--fs-12); font-weight: 500; padding-inline: var(--s-xs); border-radius: var(--r-sm); background: var(--keycap-face); box-shadow: inset 0 0 0 1px var(--keycap-edge), 0 1px 0 var(--keycap-edge); color: var(--keycap-label); white-space: nowrap; line-height: 1; }
svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
svg.i.sm { width: 13px; height: 13px; vertical-align: -2px; }
.mono { font-family: var(--font-mono); }
.num { font-variant-numeric: tabular-nums; }
.mu { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.grow { flex: 1; }
.fade { animation: fade var(--motion-fade) ease-out both; }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } }

/* shell: picker bar */
.page { height: 100dvh; display: grid; grid-template-rows: auto 1fr; }
.pk { display: flex; align-items: center; gap: var(--s-md); padding: var(--s-sm) var(--s-xl); min-height: 48px; border-bottom: 1px solid var(--line); background: var(--rail); position: relative; z-index: var(--z-shell); }
.pk-brand { font-weight: 700; font-size: var(--fs-14); white-space: nowrap; display: inline-flex; align-items: center; gap: var(--s-md); }
.pk-brand b { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: var(--r-md); background: var(--text); color: var(--background); font-family: var(--font-mono); font-size: var(--fs-12); }
.pk-tabs { display: inline-flex; gap: var(--s-xxs); padding: var(--s-xxs); border-radius: var(--r-card); background: var(--background); box-shadow: inset 0 0 0 1px var(--line); overflow-x: auto; scrollbar-width: none; min-width: 0; }
.pk-tabs button { display: inline-flex; align-items: center; gap: var(--s-sm); height: 30px; padding-inline: var(--s-lg); border: 0; border-radius: var(--r-md); background: none; color: var(--muted); cursor: pointer; white-space: nowrap; }
.pk-tabs button:hover { color: var(--text); background: var(--hover); }
.pk-tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-chip); }
.pk-tabs .lt { font-family: var(--font-mono); font-size: var(--fs-12); font-weight: 600; color: var(--accent-text); }
.pk-tabs .nm { font-weight: 600; }
.pk-tabs .tg { font-size: var(--fs-12); color: var(--muted); }
.pk[data-pick] .pk-tabs { box-shadow: inset 0 0 0 2px var(--accent); }
.pk-hint { color: var(--muted); font-size: var(--fs-12); white-space: nowrap; display: inline-flex; gap: var(--s-xs); align-items: center; }
.pk-btn { display: inline-flex; align-items: center; gap: var(--s-sm); height: 30px; padding-inline: var(--s-md); border: 0; border-radius: var(--r-md); background: none; color: var(--muted); cursor: pointer; white-space: nowrap; }
.pk-btn:hover { background: var(--hover); color: var(--text); }
.pk-btn[aria-pressed="true"] { color: var(--text); background: var(--selection); }
.stage-wrap { min-height: 0; padding: var(--s-xl); position: relative; }
#stage { height: 100%; outline: none; }
#ref { width: 100%; height: 100%; border: 0; border-radius: var(--r-sheet); box-shadow: var(--shadow-card); background: var(--background); }

/* app window */
.win { container: win / inline-size; position: relative; height: 100%; display: flex; flex-direction: column; background: var(--background); border-radius: var(--r-sheet); box-shadow: var(--shadow-card); overflow: hidden; }
.wbar { display: flex; align-items: center; gap: var(--s-md); min-height: var(--bar-h); padding: var(--s-sm) var(--s-xl); border-bottom: 1px solid var(--line); flex: none; flex-wrap: wrap; }
.wbody { position: relative; flex: 1; min-height: 0; display: flex; }
.wst { display: flex; align-items: center; gap: var(--s-xl); min-height: var(--status-h); padding: var(--s-xs) var(--s-xl); border-top: 1px solid var(--line); color: var(--muted); font-size: var(--fs-12); flex: none; overflow: hidden; background: var(--background); }
.wst .keys { display: flex; gap: var(--s-xl); white-space: nowrap; overflow: hidden; }
.wst .keys span { display: inline-flex; gap: var(--s-xs); align-items: center; }
.wst .msg { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scr { overflow: auto; min-width: 0; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

/* controls */
.btn { display: inline-flex; align-items: center; gap: var(--s-sm); height: 28px; padding-inline: var(--s-lg); border: 0; border-radius: var(--r-md); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--text); cursor: pointer; white-space: nowrap; font-weight: 500; }
.btn:hover { background: var(--hover); }
.btn.pri { background: var(--accent); box-shadow: none; color: var(--keycap-lit-label); font-weight: 600; }
.btn.pri:hover { background: color-mix(in oklch, var(--accent) 88%, var(--text)); }
.btn.pri kbd { background: transparent; color: var(--keycap-lit-label); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--keycap-lit-label) 45%, transparent); }
.btn.ghost { background: none; box-shadow: none; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--hover); }
.btn[disabled] { opacity: 0.55; cursor: not-allowed; }
.btn.sm { height: 24px; padding-inline: var(--s-md); font-size: var(--fs-12); }
.ib { display: inline-grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: var(--r-md); background: none; color: var(--muted); cursor: pointer; flex: none; }
.ib:hover { background: var(--hover); color: var(--text); }
.seg { display: inline-flex; gap: var(--s-xxs); padding: var(--s-xxs); border-radius: var(--r-card); background: var(--rail); box-shadow: inset 0 0 0 1px var(--line); flex: none; }
.seg button { display: inline-flex; align-items: center; gap: var(--s-xs); height: 24px; padding-inline: var(--s-md); border: 0; border-radius: var(--r-md); background: none; color: var(--muted); cursor: pointer; white-space: nowrap; font-size: var(--fs-12); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow-card); }
.seg .ct { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 500; }
.side { display: inline-flex; align-items: center; gap: var(--s-sm); min-width: 0; height: 28px; padding-inline: var(--s-md); border-radius: var(--r-md); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; }
.side .t { font-weight: 600; }
.side .p { color: var(--muted); font-family: var(--font-mono); font-size: var(--fs-12); overflow: hidden; text-overflow: ellipsis; }
.side .ic-dir, .ic-dir { color: var(--folder); }
.pill { display: inline-flex; align-items: center; gap: var(--s-xs); height: 22px; padding-inline: var(--s-md); border-radius: var(--r-full); background: var(--pill); box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); font-size: var(--fs-12); white-space: nowrap; }
.pill.on { box-shadow: inset 0 0 0 1px var(--pill-ring); color: var(--pill-label); }
button.pill { border: 0; cursor: pointer; }
button.pill:hover { color: var(--text); }
.prog { position: relative; width: 120px; height: 4px; border-radius: var(--r-full); background: var(--progress-track); overflow: hidden; flex: none; }
.prog i { position: absolute; inset: 0; background: var(--progress-fill); transform-origin: left; transform: scaleX(var(--p, 0)); }

/* status glyphs: each state has a glyph and a word, never colour alone */
.sg { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: var(--r-sm); font-family: var(--font-mono); font-size: var(--fs-12); font-weight: 700; flex: none; line-height: 1; }
.sg.chg { color: var(--diff-change-text); background: var(--diff-change-wash); box-shadow: inset 0 0 0 1px var(--diff-change-fill); }
.sg.lo { color: var(--diff-delete-text); background: var(--diff-delete-wash); box-shadow: inset 0 0 0 1px var(--diff-delete-fill); }
.sg.ro { color: var(--diff-add-text); background: var(--diff-add-wash); box-shadow: inset 0 0 0 1px var(--diff-add-fill); }
.sg.mov { color: var(--diff-moved-text); background: var(--diff-moved-wash); box-shadow: inset 0 0 0 1px var(--diff-moved-fill); }
.sg.rule { color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.sg.same { color: var(--faint); }
.sg.chk { color: var(--accent-text); box-shadow: inset 0 0 0 1px var(--line); }
.sg.conf { color: var(--diff-conflict-text); background: var(--diff-conflict-wash); box-shadow: inset 0 0 0 1px var(--diff-conflict-mark); }
.sg.auto { color: var(--diff-auto-merged-text); background: var(--diff-auto-merged-wash); box-shadow: inset 0 0 0 1px var(--diff-auto-merged-fill); }
.sg.done { color: var(--ok); box-shadow: inset 0 0 0 1px var(--line); }
.dl { font-family: var(--font-mono); font-size: var(--fs-12); white-space: nowrap; font-variant-numeric: tabular-nums; }
.dl .p { color: var(--diff-add-text); }
.dl .m { color: var(--diff-delete-text); }

/* list rows */
.lst { display: flex; flex-direction: column; padding: var(--s-xs); }
.rw { display: flex; align-items: center; gap: var(--s-md); min-height: 30px; padding-inline: var(--s-md); border-radius: var(--r-md); cursor: default; position: relative; min-width: 0; }
.rw:hover { background: var(--hover); }
.rw[aria-selected="true"] { background: var(--selection); color: var(--on-selection); }
.rw[aria-selected="true"]::before { content: ""; position: absolute; inset-inline-start: 0; inset-block: 6px; width: 2px; border-radius: 2px; background: var(--accent); }
.rw .nm { display: flex; align-items: baseline; gap: var(--s-sm); min-width: 0; flex: 1; }
.rw .nm .n { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rw .nm .d { color: var(--muted); font-size: var(--fs-12); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; direction: rtl; text-align: start; }
.grp { display: flex; align-items: center; gap: var(--s-md); padding: var(--s-xl) var(--s-md) var(--s-xs); color: var(--muted); font-size: var(--fs-12); font-weight: 600; letter-spacing: 0.02em; }
.grp .ct { font-variant-numeric: tabular-nums; font-weight: 500; }
button.grp { border: 0; background: none; width: 100%; text-align: start; cursor: pointer; }
button.grp:hover { color: var(--text); }

/* decision chips */
.dc { display: inline-flex; align-items: center; gap: var(--s-xs); height: 22px; padding-inline: var(--s-sm) var(--s-md); border-radius: var(--r-full); font-size: var(--fs-12); font-weight: 500; white-space: nowrap; flex: none; box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); background: var(--surface); }
.dc.set { color: var(--pill-label); box-shadow: inset 0 0 0 1px var(--pill-ring); }
.dc.sugg { box-shadow: inset 0 0 0 1px var(--line); border: 0; background: none; color: var(--muted); font-style: normal; }
.dc.sugg::before { content: ""; width: 6px; height: 6px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--faint); }
.dc.skip { color: var(--muted); }
.dc.auto { color: var(--diff-auto-merged-text); box-shadow: inset 0 0 0 1px var(--diff-auto-merged-fill); background: var(--diff-auto-merged-wash); }
.dc.conf { color: var(--diff-conflict-text); box-shadow: inset 0 0 0 1px var(--diff-conflict-mark); background: var(--diff-conflict-wash); }
.dc.ok { color: var(--ok); }

/* code and diff rows */
.code { font-family: var(--font-mono); font-size: var(--fs-12); line-height: var(--code-h); min-width: 0; width: 100%; }
.dr { display: grid; min-height: var(--code-h); position: relative; }
.dr.split { grid-template-columns: 48px minmax(0, 1fr) 48px minmax(0, 1fr); }
.dr.uni { grid-template-columns: 44px 44px 18px minmax(0, 1fr); }
.dr.one { grid-template-columns: 48px minmax(0, 1fr); }
.ln { color: var(--faint); text-align: end; padding-inline-end: var(--s-md); user-select: none; font-variant-numeric: tabular-nums; }

/** Fake byte size label for a same file, stable per name. */
function fakeSize(name) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return name.endsWith('.svg') ? `${(h % 9) + 1}.${h % 10} KB` : `${(h % 40) + 1}.${(h >>> 3) % 10} KB`; }

  undo() { const f = this.s.undo.pop(); if (f) { f(); this.s.jump = true; toast('Undone'); } else toast('Nothing to undo'); },
  key(e) {
    const s = this.s, k = e.key, ctrl = e.ctrlKey || e.metaKey, alt = e.altKey;
    if (ctrl && !alt && k === 'Enter') { this.write(); return true; }
    if (ctrl && !alt && (k === 'z' || k === 'Z')) { this.undo(); return true; }
    if (alt && !ctrl && (k === 'ArrowDown' || k === 'ArrowUp')) { this.nextNeed(k === 'ArrowDown' ? 1 : -1); return true; }
    if (alt && !ctrl && ['0', '1', '2', '3'].includes(k)) { if (s.written) { toast('Already written. Ctrl+Z first to change it.'); return true; } this.pick({ 0: '', 1: 'L', 2: 'R', 3: 'LR' }[k]); return true; }
    if (alt && !ctrl && (e.code === 'KeyB')) { s.base = !s.base; s.conf = s.base ? s.conf : s.conf; toast(s.base ? 'Base v0.4.0: outcomes follow who changed what' : 'No base: every outcome is a guess by date'); return true; }
    if (ctrl || alt) return false;
    if (k === ' ') { s.sources = !s.sources; return true; }
    if (k === 'Enter') { s.focus = 'file'; if (APP.narrow) s.view = 'item'; return true; }
    if (k === 'Escape') { if (s.sources) { s.sources = false; return true; } if (s.focus === 'file' || s.view === 'item') { s.focus = 'list'; s.view = 'list'; return true; } return false; }
    if (s.focus === 'file') { const el = document.getElementById('d-f'); if (el && (k === 'ArrowDown' || k === 'ArrowUp')) { el.scrollBy(0, k === 'ArrowDown' ? 60 : -60); return false; } }
    if (k === 'ArrowDown' || k === 'ArrowUp') { this.move(k === 'ArrowDown' ? 1 : -1); return true; }
    if (k === 'Home' || k === 'End') { this.move(k === 'Home' ? -999 : 999); return true; }
    return false;
  },
  click(a) {
    const s = this.s, v = a.dataset.v;
    switch (a.dataset.act) {
      case 'd-sel': s.sel = a.dataset.p; s.sources = false; s.focus = 'list'; if (APP.narrow) s.view = 'item'; return true;
      case 'd-ov': if (s.written) { toast('Already written. Ctrl+Z first to change it.'); return true; } this.pick(v); return true;
      case 'd-conf': if (v === '') { const prev = s.conf; s.conf = null; s.undo.push(() => { s.conf = prev; }); return true; } this.pick(v); return true;
      case 'd-sources': s.sources = !s.sources; return true;
      case 'd-base': s.base = !s.base; return true;
      case 'd-target': s.target = v; return true;
      case 'd-write': this.write(); return true;
      case 'd-undo': this.undo(); return true;
      case 'd-unch': s.unchOpen = !s.unchOpen; return true;
      case 'd-back': s.view = 'list'; s.focus = 'list'; return true;
      case 'imgmode': s.imgMode = v; return true;
      case 'unfold': s.open.add(v); return true;
      default: return false;
    }
  },
  input(ev) { if (ev.target.dataset.act === 'onion') { this.s.onion = +ev.target.value; const t = document.querySelector('.onion svg + svg'); if (t) t.style.opacity = this.s.onion; } },
  tick() { const s = this.s; if (s.chk < 1) { s.chk = Math.min(1, +(s.chk + 0.05).toFixed(2)); return true; } if (s.logP < 1 && this.cur() && this.cur().e.kind === 'log') { s.logP = Math.min(1, +(s.logP + 0.07).toFixed(2)); return true; } return false; },
};
/** Label for the sources toggle: shows or hides the three-column view. */
const s0 = (on) => (on ? 'Hide sources' : 'Sources');

/* Shell: picker bar, key router, About panel, keys overlay, render loop and the lazy reference frame. */
const REF = {
  id: 'R', name: 'Reference', tag: 'P42 V4', ref: true,
  about: {
    idea: 'The P42 Direction 4 prototype, “Calm full window”, embedded unchanged apart from its own picker. It is the baseline the four new directions are measured against.',
    problem: 'Folder compare in the panes, file diff full window on the F3 host, merge as a separate mode.',
    beats: ['Close to the plan as decided (D10 placement, D58 drawers).'],
    tradeoffs: ['Its colours are the old prototype literals, not the token variables used by A to D.'],
    engine: ['As in plan P42.'],
  },
  keys: [['Reference', [['T', 'Its own theme key (the picker theme also works)'], ['F D M L', 'Its scenarios: folders, file diff, merge, large']]]],
  init() {}, render() { return ''; }, key() { return false; }, click() { return false; }, tick() { return false; },
};
const DIRS = [A, B, typeof C !== 'undefined' ? C : null, typeof D !== 'undefined' ? D : null, REF].filter(Boolean);
const APP = { cur: 0, about: false, keys: false, pick: false, narrow: false };
const root = document.documentElement, stage = document.getElementById('stage');
DIRS.forEach((d) => d.init());

/** Draws the picker bar from DIRS and the shell state. */
function renderPicker() {
  const pk = document.getElementById('pk');
  pk.toggleAttribute('data-pick', APP.pick);
  pk.innerHTML = `<span class="pk-brand"><b>N</b><span>Compare · round 2</span></span>
    <div class="pk-tabs" role="tablist" aria-label="Directions">${DIRS.map((d, i) => `<button role="tab" aria-selected="${i === APP.cur}" data-act="pick" data-v="${i}" title="\` then ${i + 1}"><span class="lt">${d.ref ? 'Ref' : d.id}</span><span class="nm">${d.ref ? '' : d.name}</span><span class="tg">${d.tag}</span></button>`).join('')}</div>
    <span class="grow"></span>
    <span class="pk-hint">${APP.pick ? `Pick: ${kb('1')}–${kb(String(DIRS.length))} direction · ${kb('T')} theme · ${kb('A')} about · ${kb('Esc')}` : `${kb('`')} then ${kb('1')}–${kb(String(DIRS.length))}`}</span>
    <button class="pk-btn" data-act="about" aria-pressed="${APP.about}" title="About this direction (\` then A)">${ic('info', 'sm')}<span class="bl">About</span></button>
    <button class="pk-btn" data-act="keys" aria-pressed="${APP.keys}" title="Keys (?)">${ic('kb', 'sm')}<span class="bl">Keys</span> ${kb('?')}</button>
    <button class="pk-btn" data-act="theme" title="Theme (\` then T)" aria-label="Switch theme">${ic(root.dataset.theme === 'dark' ? 'sun' : 'moon', 'sm')}<span class="bl">${root.dataset.theme === 'dark' ? 'Light' : 'Dark'}</span></button>`;
}

/** Draws the About panel and the keys overlay for the active direction. */
function renderLayers() {
  const d = DIRS[APP.cur], a = d.about;
  document.getElementById('about-host').innerHTML = APP.about ? `<aside class="about fade" aria-label="About ${esc(d.name)}"><div style="display:flex;align-items:center;gap:8px"><h2>${d.ref ? 'Reference' : `${d.id} · ${esc(d.name)}`} <span class="pill">${esc(d.tag)}</span></h2><span class="grow"></span><button class="ib" data-act="about" aria-label="Close">${ic('x', 'sm')}</button></div>
    <h3>Central idea</h3><p>${esc(a.idea)}</p><h3>Problem it solves</h3><p>${esc(a.problem)}</p>
    <h3>How it beats Beyond Compare</h3><ul>${a.beats.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
    <h3>Trade-offs and risks</h3><ul>${a.tradeoffs.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
    <h3>Engine work</h3><ul>${a.engine.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></aside>` : '';
  const groups = [...d.keys, ['Picker', [['`', 'Then 1–' + DIRS.length + ' direction, T theme, A about'], ['?', 'This list'], ['Esc', 'Close the top layer']]]];
  document.getElementById('keys-host').innerHTML = APP.keys ? `<div class="keys-ov fade" data-act="keys-bg"><div class="keys-card" role="dialog" aria-label="Keys"><h2>${esc(d.name)} keys</h2><dl>${groups.map(([g, list]) => `<h3>${esc(g)}</h3>${list.map(([k, t]) => `<dt>${k.split(' / ').map((x) => kb(x)).join('<span class="mu">/</span>')}</dt><dd>${esc(t)}</dd>`).join('')}`).join('')}</dl></div></div>` : '';
}

let lastDir = -1;
/** Re-renders the active direction, keeping scroll positions and input focus; scrolls the current item into view on request. */
function render() {
  const d = DIRS[APP.cur];
  renderPicker(); renderLayers();
  const ref = document.getElementById('ref');
  if (d.ref) { stage.hidden = true; showRef(); lastDir = APP.cur; return; }
  ref.hidden = true; stage.hidden = false;
  const keep = {}; stage.querySelectorAll('.scr[id]').forEach((el) => { keep[el.id] = [el.scrollTop, el.scrollLeft]; });
  const act = document.activeElement, focusId = act && act.id && stage.contains(act) ? act.id : null, selS = focusId && act.selectionStart;
  stage.innerHTML = d.render();
  if (lastDir !== APP.cur) { stage.firstElementChild.classList.add('fade'); lastDir = APP.cur; }
  else for (const [id, [t, l]] of Object.entries(keep)) { const el = document.getElementById(id); if (el) { el.scrollTop = t; el.scrollLeft = l; } }
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); if (selS != null && el.setSelectionRange) el.setSelectionRange(selS, selS); } }
  if (d.after) d.after();
  if (d.s && d.s.jump) {
    d.s.jump = false;
    const c = stage.querySelector('[data-cur]');
    if (c) c.scrollIntoView({ block: d.id === 'B' ? 'center' : 'nearest', inline: 'nearest' });
  }
}

/* reference: the P42 prototype, decoded from base64 and loaded into a same-origin frame on first use */
let refReady = false;
/** Shows the reference frame, creating it the first time; syncs the theme. */
function showRef() {
  const ref = document.getElementById('ref'); ref.hidden = false;
  if (!refReady) {
    refReady = true;
    const bytes = Uint8Array.from(atob(document.getElementById('ref-src').textContent.trim()), (c) => c.charCodeAt(0));
    ref.addEventListener('load', () => {
      const w = ref.contentWindow; syncRefTheme();
      w.addEventListener('keydown', (e) => { if (e.key === '`' || e.key === '?' || (APP.pick && /^[1-9taTA]$/.test(e.key)) || (APP.pick && e.key === 'Escape')) { e.stopImmediatePropagation(); e.preventDefault(); onKey(e); } }, true);
    });
    ref.srcdoc = new TextDecoder().decode(bytes);
  } else syncRefTheme();
}
/** Pushes the picker theme into the reference frame through the hook the build adds to it. */
function syncRefTheme() { try { const w = document.getElementById('ref').contentWindow; if (w && w.__setTheme) w.__setTheme(root.dataset.theme); } catch (_) { /* frame not ready yet */ } }

/** Switches to direction i (0-based) and remembers it in the address. */
function pick(i) { if (i < 0 || i >= DIRS.length) return; APP.cur = i; APP.pick = false; saveHash(); render(); }
function toggleTheme() { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; saveHash(); syncRefTheme(); render(); }
function saveHash() { history.replaceState(null, '', `#${DIRS[APP.cur].ref ? 'R' : DIRS[APP.cur].id}-${root.dataset.theme}`); }

/** Routes one key: picker mode first, then the shell layers, then the active direction. */
function onKey(e) {
  const t = e.target, typing = t && (t.tagName === 'INPUT' && t.type !== 'checkbox' && t.type !== 'range' || t.tagName === 'TEXTAREA');
  if (APP.pick) {
    e.preventDefault();
    if (/^[1-9]$/.test(e.key)) pick(+e.key - 1);
    else if (e.key === 't' || e.key === 'T') { APP.pick = false; toggleTheme(); }
    else if (e.key === 'a' || e.key === 'A') { APP.pick = false; APP.about = !APP.about; render(); }
    else { APP.pick = false; renderPicker(); }
    return;
  }
  if (!typing && e.key === '`') { e.preventDefault(); APP.pick = true; renderPicker(); return; }
  if (!typing && e.key === '?') { e.preventDefault(); APP.keys = !APP.keys; renderLayers(); return; }
  if (e.key === 'Escape' && APP.keys) { APP.keys = false; renderLayers(); return; }
  if (APP.keys) return;
  const d = DIRS[APP.cur];
  if (d.ref) return;
  if (d.key(e, typing)) { e.preventDefault(); render(); return; }
  if (e.key === 'Escape' && APP.about) { APP.about = false; renderLayers(); }
}
document.addEventListener('keydown', onKey);

document.addEventListener('click', (ev) => {
  const a = ev.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, d = DIRS[APP.cur];
  if (act === 'pick') return pick(+a.dataset.v);
  if (act === 'theme') return toggleTheme();
  if (act === 'about') { APP.about = !APP.about; return renderLayers(), renderPicker(); }
  if (act === 'keys') { APP.keys = !APP.keys; return renderLayers(), renderPicker(); }
  if (act === 'keys-bg') { if (ev.target === a) { APP.keys = false; renderLayers(); renderPicker(); } return; }
  if (act === 'toast-undo') { document.getElementById('toast').innerHTML = ''; d.undo(); return render(); }
  if (act === 'onion') return;
  if (d.click(a, ev)) render();
});
document.addEventListener('dblclick', (ev) => { const a = ev.target.closest('[data-act]'), d = DIRS[APP.cur]; if (a && d.dbl && d.dbl(a, ev)) render(); });
document.addEventListener('input', (ev) => { const d = DIRS[APP.cur]; if (d.input && d.input(ev)) render(); });
setInterval(() => { const d = DIRS[APP.cur]; if (!d.ref && !APP.keys && d.tick && d.tick()) render(); }, 500);

/** Recomputes the narrow flag from the stage width (the container query uses the same 760 px line). */
function measure() { const n = stage.parentElement.clientWidth < 760; if (n !== APP.narrow) { APP.narrow = n; return true; } return false; }
new ResizeObserver(() => { if (measure()) render(); }).observe(document.querySelector('.stage-wrap'));

(() => {
  const m = /^#([A-Z])-(light|dark)$/.exec(location.hash);
  if (m) { root.dataset.theme = m[2]; const i = DIRS.findIndex((d) => (d.ref ? 'R' : d.id) === m[1]); if (i >= 0) APP.cur = i; }
  else if (matchMedia('(prefers-color-scheme: dark)').matches) root.dataset.theme = 'dark';
  measure(); render();
})();

</script>
</body>
</html>
