<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navo Setup wizard: four directions</title>
<!-- W9 prototype. Pick a direction with keys 1-4. Colours come only from Navo theme tokens (Open sea, light and dark). Motion is an 80 ms fade. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Theme tokens. Names follow crates/navo-ui/src/tokens (Open sea palette, surfaces, diff, marks). */
:root {
  color-scheme: light;
  --rail: oklch(95.5% 0.012 225);
  --background: oklch(98.5% 0.008 225);
  --surface: oklch(99.8% 0 225);
  --zebra: oklch(97% 0.010 225);
  --line: oklch(89% 0.014 225);
  --text: oklch(22% 0.014 225);
  --muted: oklch(48.8% 0.017 225);
  --faint: oklch(64.8% 0.017 225);
  --hover: oklch(94.25% 0.027 218);
  --selection: oklch(90% 0.046 218);
  --on-selection: var(--text);
  --accent: oklch(52% 0.092 218);
  --accent-text: oklch(48.8% 0.086 218);
  --mark: oklch(48.8% 0.144 22);
  --folder: oklch(49.6% 0.102 80);
  --kind-code: oklch(49.6% 0.12 262);
  --kind-image: oklch(49.6% 0.12 340);
  --kind-archive: oklch(49.6% 0.12 45);
  --kind-doc: oklch(49.6% 0.12 235);
  --kind-sheet: oklch(49.6% 0.12 165);
  --ok: oklch(48% 0.108 160);
  --warn: oklch(49.6% 0.102 80);
  --ink: oklch(20% 0.02 250);
  /* surfaces */
  --card: var(--surface);
  --card-edge: var(--line);
  --card-ring: oklch(61.3% 0.075 225);
  --current: var(--selection);
  --field: var(--rail);
  --keycap-face: var(--surface);
  --keycap-edge: var(--line);
  --keycap-label: var(--text);
  --keycap-lit: var(--accent);
  --keycap-lit-label: var(--background);
  --layer-tint: var(--hover);
  --pill: var(--surface);
  --pill-ring: var(--accent);
  --pill-label: var(--accent-text);
  --progress-track: var(--line);
  --progress-fill: var(--accent);
  --sheet: var(--surface);
  --scrim: oklch(20% 0.02 250 / 0.4);
  /* diff */
  --diff-delete-text: oklch(50% 0.17 27); --diff-delete-mark: oklch(62% 0.17 27); --diff-delete-fill: oklch(88% 0.07 27); --diff-delete-wash: oklch(96.5% 0.02 27);
  --diff-add-text: oklch(46% 0.12 150); --diff-add-mark: oklch(60% 0.14 150); --diff-add-fill: oklch(87% 0.08 150); --diff-add-wash: oklch(96.5% 0.025 150);
  --diff-change-text: oklch(48% 0.11 70); --diff-change-mark: oklch(60% 0.13 70); --diff-change-fill: oklch(88% 0.07 70); --diff-change-wash: oklch(97% 0.025 80);
  --diff-moved-text: oklch(48% 0.10 210); --diff-moved-mark: oklch(60% 0.10 210); --diff-moved-fill: oklch(88% 0.06 210); --diff-moved-wash: oklch(96.5% 0.02 210);
  --diff-conflict-text: oklch(50% 0.17 27); --diff-conflict-mark: oklch(50% 0.17 27); --diff-conflict-fill: oklch(88% 0.07 27); --diff-conflict-wash: oklch(96.5% 0.02 27);
  --diff-auto-merged-text: oklch(50% 0.15 262); --diff-auto-merged-mark: oklch(50% 0.15 262); --diff-auto-merged-fill: oklch(88% 0.06 262); --diff-auto-merged-wash: oklch(96.5% 0.02 262);
  --diff-gap-hatch: oklch(91% 0.006 260);
  /* git */
  --git-conflict: oklch(56% 0.2 25); --git-modified: oklch(56% 0.138 55); --git-sync: oklch(56% 0.128 240); --git-quiet: oklch(56.8% 0.017 225);
  /* syntax (Oxidised Iron) */
  --syntax-keyword: oklch(50% 0.125 40); --syntax-type: oklch(41% 0.08 82); --syntax-function: oklch(48% 0.075 210); --syntax-number: oklch(49% 0.1 330); --syntax-string: oklch(48% 0.1 145); --syntax-comment: oklch(54% 0.015 60); --syntax-attribute: oklch(46% 0.07 62);
  /* shadows */
  --shadow-card: 0 0 0 1px var(--card-edge);
  --shadow-menu: 0 18px 44px -12px oklch(21% 0.012 260 / 0.28), 0 2px 6px oklch(21% 0.012 260 / 0.06), 0 0 0 1px var(--card-edge);
  --shadow-sheet: 0 28px 60px -20px oklch(20% 0.02 250 / 0.42), 0 0 0 1px var(--card-edge);
  --shadow-chip: 0 2px 6px oklch(21% 0.012 260 / 0.08), 0 8px 20px -10px oklch(21% 0.012 260 / 0.2);
  --shadow-focus: 0 0 0 2px var(--pill-ring);
  /* motion, type, space, radii (design_b) */
  --motion-fade: 80ms;
  --font-ui: "Inter", "Segoe UI Variable", "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --fs-12: 0.75rem; --fs-13: 0.8125rem; --fs-14: 0.875rem; --fs-16: 1rem; --fs-20: 1.25rem;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --rail: oklch(19% 0.014 225);
  --background: oklch(22.5% 0.014 225);
  --surface: oklch(26.5% 0.014 225);
  --zebra: oklch(20.75% 0.014 225);
  --line: oklch(33% 0.014 225);
  --text: oklch(93.8% 0.014 225);
  --muted: oklch(72% 0.017 225);
  --faint: oklch(54.8% 0.017 225);
  --hover: oklch(27.75% 0.036 218);
  --selection: oklch(33% 0.058 218);
  --accent: oklch(76% 0.11 218);
  --accent-text: oklch(76% 0.11 218);
  --mark: oklch(76% 0.166 22);
  --folder: oklch(82% 0.13 80);
  --kind-code: oklch(76% 0.12 262);
  --kind-image: oklch(76% 0.12 340);
  --kind-archive: oklch(76% 0.12 45);
  --kind-doc: oklch(76% 0.12 235);
  --kind-sheet: oklch(76% 0.12 165);
  --ok: oklch(85% 0.13 160);
  --warn: oklch(82% 0.13 80);
  --ink: oklch(0% 0 0);
  --card-ring: oklch(65.3% 0.091 225);
  --scrim: oklch(0% 0 0 / 0.4);
  --diff-delete-text: oklch(76% 0.13 27); --diff-delete-mark: oklch(66% 0.16 27); --diff-delete-fill: oklch(36% 0.09 27); --diff-delete-wash: oklch(21% 0.03 27);
  --diff-add-text: oklch(78% 0.13 150); --diff-add-mark: oklch(68% 0.14 150); --diff-add-fill: oklch(36% 0.08 150); --diff-add-wash: oklch(21% 0.03 150);
  --diff-change-text: oklch(82% 0.12 78); --diff-change-mark: oklch(74% 0.13 78); --diff-change-fill: oklch(36% 0.08 78); --diff-change-wash: oklch(21.5% 0.025 78);
  --diff-moved-text: oklch(78% 0.09 210); --diff-moved-mark: oklch(68% 0.10 210); --diff-moved-fill: oklch(36% 0.06 210); --diff-moved-wash: oklch(21% 0.025 210);
  --diff-conflict-text: oklch(76% 0.13 27); --diff-conflict-mark: oklch(76% 0.13 27); --diff-conflict-fill: oklch(36% 0.09 27); --diff-conflict-wash: oklch(21% 0.03 27);
  --diff-auto-merged-text: oklch(72% 0.13 262); --diff-auto-merged-mark: oklch(72% 0.13 262); --diff-auto-merged-fill: oklch(36% 0.08 262); --diff-auto-merged-wash: oklch(21% 0.03 262);
  --diff-gap-hatch: oklch(23% 0.01 260);
  --git-conflict: oklch(72% 0.15 25); --git-modified: oklch(72% 0.15 55); --git-sync: oklch(72% 0.15 240); --git-quiet: oklch(63.4% 0.017 225);
  --syntax-keyword: oklch(75% 0.095 40); --syntax-type: oklch(85% 0.075 82); --syntax-function: oklch(80% 0.065 210); --syntax-number: oklch(77% 0.075 330); --syntax-string: oklch(80% 0.08 145); --syntax-comment: oklch(64% 0.014 60); --syntax-attribute: oklch(80% 0.06 62);
  --shadow-menu: 0 22px 48px -12px oklch(0% 0 0 / 0.7), 0 0 0 1px oklch(93% 0.006 260 / 0.04), 0 0 0 1px var(--card-edge);
  --shadow-sheet: 0 28px 60px -20px oklch(0% 0 0 / 0.85), 0 0 0 1px var(--card-edge);
  --shadow-chip: 0 2px 6px oklch(0% 0 0 / 0.35), 0 10px 24px -10px oklch(0% 0 0 / 0.6);
}
:root{--font-brand:"Space Grotesk","Inter",sans-serif}

/* Everything below uses only the tokens above. No colour literals. */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--rail);color:var(--text);font:var(--fs-13)/1.45 var(--font-ui);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
u{text-decoration:none}
.alt u{text-decoration:underline;text-underline-offset:2px}

/* Picker (prototype chrome, not part of the wizard) */
.picker{background:var(--background);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.picker h1{font:600 14px var(--font-brand);margin:0;letter-spacing:-.01em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--rail);gap:2px}
.seg button{border:0;background:none;border-radius:6px;height:26px;padding:0 10px;cursor:pointer;color:var(--muted);font-weight:500;font-size:12.5px;transition:opacity var(--motion-fade)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-card)}
.seg button:focus-visible,.picker select:focus-visible{outline:2px solid var(--card-ring);outline-offset:1px}
.picker select{height:30px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);padding:0 8px;font:inherit;max-width:100%}
.why{flex-basis:100%;margin:0;color:var(--muted);font-size:12.5px}
.why b{color:var(--text);font-weight:600}
.stage{flex:1;padding:24px 16px 40px;display:flex;justify-content:center;align-items:flex-start}
#fit{position:relative}
.win{position:absolute;left:0;top:0;width:640px;height:480px;transform-origin:0 0;background:var(--background);border-radius:8px;box-shadow:var(--shadow-sheet);overflow:hidden;display:flex;flex-direction:column}
.titlebar{height:32px;flex:none;display:flex;align-items:center;justify-content:space-between;background:var(--rail);border-bottom:1px solid var(--line);padding-left:10px;font-size:12px;color:var(--muted)}
.titlebar .t{display:flex;align-items:center;gap:8px}
.titlebar .x{width:46px;height:32px;display:grid;place-items:center;color:var(--muted)}
.client{height:448px;position:relative;overflow:hidden;opacity:1;transition:opacity var(--motion-fade) linear}
.client.out{opacity:0}
.toast{position:absolute;inset:0;background:var(--scrim);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity var(--motion-fade) linear;z-index:5}
.toast.on{opacity:1;pointer-events:auto}
.toast div{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-menu);padding:16px 20px;max-width:340px;text-align:left}
.toast b{display:block;margin-bottom:4px;font:600 15px var(--font-brand)}
.toast span{color:var(--muted)}

/* Shared parts */
.ic{flex:none;display:block}
.brand-mark{flex:none;display:block}
.btn{height:30px;padding:0 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;transition:background var(--motion-fade) linear}
.btn:hover:not(:disabled){background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn.primary:hover:not(:disabled){background:var(--accent);opacity:.92}
.btn:disabled{color:var(--muted);background:transparent;border-color:var(--line);cursor:default;opacity:.62}
.btn.primary:disabled{background:var(--zebra);color:var(--muted);border-color:var(--line)}
.btn:focus{outline:2px solid var(--card-ring);outline-offset:2px}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover:not(:disabled){background:var(--hover)}
.btn.small{height:26px;padding:0 10px;font-size:12.5px}
kbd{font:500 10.5px/1 var(--font-mono);color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 5px;background:var(--surface);display:inline-block}
.btn.primary kbd{color:var(--surface);background:none;border-color:var(--surface);opacity:.8}
.link{color:var(--accent-text);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;background:none;border:0;padding:0;font:inherit}
.link:focus{outline:2px solid var(--card-ring);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--font-mono);font-size:12px}
.p{margin:0 0 12px;color:var(--text);font-size:13.5px;line-height:1.5;max-width:46ch}
.p code,.note code,.margin code,.lead code{font:12px var(--font-mono);background:var(--rail);border:1px solid var(--line);border-radius:4px;padding:0 4px;overflow-wrap:anywhere}
.title{font:600 22px/1.2 var(--font-brand);letter-spacing:-.015em;margin:0 0 8px}
.lead{margin:0 0 14px;font-size:13.5px;line-height:1.5;color:var(--text);max-width:48ch}
.muted{color:var(--muted)}

.tone-info{--t-bg:var(--selection);--t-fg:var(--accent-text)}
.tone-ok{--t-bg:var(--diff-add-wash);--t-fg:var(--diff-add-text)}
.tone-warn{--t-bg:var(--diff-change-wash);--t-fg:var(--diff-change-text)}
.tone-err{--t-bg:var(--diff-delete-wash);--t-fg:var(--diff-delete-text)}
.tile{width:40px;height:40px;border-radius:11px;background:var(--t-bg);color:var(--t-fg);display:grid;place-items:center;flex:none}

.note{display:flex;gap:9px;align-items:flex-start;padding:8px 11px;border-radius:8px;background:var(--zebra);border:1px solid var(--line);font-size:12.5px;line-height:18px;color:var(--text);margin:0 0 10px;max-width:50ch}
.note .ic{margin-top:1px;color:var(--muted)}
.note.tone-warn,.note.tone-err,.note.tone-ok{background:var(--t-bg);border-color:transparent;color:var(--t-fg)}
.note.tone-warn .ic,.note.tone-err .ic,.note.tone-ok .ic{color:var(--t-fg)}
.note strong{font-weight:600}

.facts{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.facts li{display:flex;align-items:center;gap:11px;font-size:13px;color:var(--text)}
.facts .dot{width:26px;height:26px;border-radius:8px;background:var(--rail);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent-text);flex:none}

.fieldrow{display:flex;gap:8px;align-items:center;margin:0 0 8px}
.field{flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:7px;background:var(--surface);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--muted);font:12.5px var(--font-mono)}
.field .path{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.field .path .dim{color:var(--muted)}
.field .path b{color:var(--text);font-weight:600}
.field .path em{font-style:normal;color:var(--diff-delete-text);background:var(--diff-delete-wash);border-radius:3px;padding:0 2px;font-weight:600}
.field.bad{border-color:var(--mark);box-shadow:0 0 0 1px var(--mark)}
.field.locked{background:var(--zebra)}
.meta{display:flex;gap:16px;color:var(--muted);font-size:12px;margin:0 0 12px;font-variant-numeric:tabular-nums}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta b{color:var(--text);font-weight:600}

.chk{display:flex;align-items:center;gap:10px;min-height:28px;cursor:pointer;font-size:13.5px;border-radius:6px;padding:2px 4px 2px 0;width:max-content;max-width:100%}
.chk:focus{outline:2px solid var(--card-ring);outline-offset:2px}
.chk .box{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--muted);display:grid;place-items:center;color:var(--surface);flex:none;transition:background var(--motion-fade) linear}
.chk[aria-checked=true] .box{background:var(--accent);border-color:var(--accent)}
.chk .box .ic{opacity:0;transition:opacity var(--motion-fade) linear}
.chk[aria-checked=true] .box .ic{opacity:1}
.chk small{color:var(--muted);font-size:12px;margin-left:2px}
.chks{display:flex;flex-direction:column;gap:4px}

.lic{height:150px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 12px;font:11px/1.55 var(--font-mono);color:var(--muted);white-space:pre-wrap;margin:0 0 10px;max-width:62ch}
.lic:focus{outline:2px solid var(--card-ring);outline-offset:2px}
.lic h4{margin:0 0 6px;font:600 11.5px var(--font-mono);color:var(--text)}

.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin:6px 0 10px;max-width:62ch}
.bar i{display:block;height:100%;width:42%;border-radius:2px;background:var(--accent);animation:breathe 2.6s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.45}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.bar i,.pulse{animation:none}}
.pulse{animation:breathe 2.6s ease-in-out infinite alternate}
.elapsed{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.elapsed b{color:var(--text);font:600 13px var(--font-mono)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px;margin:0 0 12px;align-items:baseline}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.steplist{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.steplist li{display:flex;align-items:center;gap:10px;height:30px;font-size:13px;border-radius:6px;padding:0 4px}
.steplist .mk{width:18px;height:18px;display:grid;place-items:center;flex:none;color:var(--ok)}
.steplist .mk i{display:block;width:6px;height:6px;border-radius:50%;background:var(--line)}
.steplist .cur .mk i{width:8px;height:8px;background:var(--accent)}
.steplist .pend{color:var(--muted)}
.steplist time{margin-left:auto;font:11.5px var(--font-mono);color:var(--muted)}

/* ---------- Direction A: step rail ---------- */
.A{display:flex;height:100%}
.A .rail{width:178px;flex:none;background:var(--rail);border-right:1px solid var(--line);padding:20px 16px 16px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font:600 15px/1.1 var(--font-brand);letter-spacing:-.01em;display:block}
.brand small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps li{display:flex;align-items:center;gap:10px;height:30px;padding:0 8px;border-radius:7px;color:var(--muted);font-size:12.5px}
.steps li .mk{width:16px;height:16px;display:grid;place-items:center;flex:none}
.steps li .mk i{display:block;width:6px;height:6px;border-radius:50%;background:var(--line)}
.steps li.done{color:var(--text)} .steps li.done .mk{color:var(--accent-text)}
.steps li.cur{background:var(--selection);color:var(--text);font-weight:600}
.steps li.cur .mk i{width:8px;height:8px;background:var(--accent)}
.steps li.cur.err .mk{color:var(--mark)}
.steps li.skip{text-decoration:line-through;text-decoration-color:var(--faint)}
.steps li.skip .mk{color:var(--muted)}
.A .railfoot{margin-top:auto;color:var(--muted);font-size:11.5px;line-height:1.5;display:flex;flex-direction:column;gap:2px}
.A .main{flex:1;min-width:0;display:flex;flex-direction:column}
.A .body{flex:1;padding:28px 32px 0;overflow:hidden;min-height:0}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 20px;border-top:1px solid var(--line);flex:none}
.foot .hints{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:11.5px}
.foot .hints span{display:inline-flex;gap:6px;align-items:center}
.foot .acts{display:flex;gap:8px;align-items:center}

/* ---------- Direction B: single card ---------- */
.B{display:flex;flex-direction:column;height:100%;background:var(--rail)}
.B header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 10px}
.B header .brand b{font-size:14px}
.B header .count{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center}
.B header .count b{color:var(--text);font-weight:600}
.segs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:0 20px}
.segs i{height:3px;border-radius:2px;background:var(--line)}
.segs i.done,.segs i.cur{background:var(--accent)}
.segs i.cur.err{background:var(--mark)}
.segs i.skip{opacity:.35}

  if (q.get('theme')) st.theme = q.get('theme');

  lastSeq = ['welcome-update', 'folder-locked'].includes(st.page) ? SEQ_UPDATE : SEQ_FRESH;
  sel.onchange = () => { const v = sel.value; if (v === 'welcome-update' || v === 'folder-locked') lastSeq = SEQ_UPDATE; else if (v === 'welcome-fresh' || v === 'folder' || v === 'shortcuts') lastSeq = SEQ_FRESH; go(v); };
  document.querySelectorAll('[data-dir]').forEach((b) => (b.onclick = () => { st.dir = b.dataset.dir; render(false); }));
  document.querySelectorAll('[data-theme-btn]').forEach((b) => (b.onclick = () => { st.theme = b.dataset.themeBtn; applyTheme(); render(false); }));
  $('#win').addEventListener('click', (e) => {
    if ($('#toast').classList.contains('on')) { toast(false); return; }
    const chkEl = e.target.closest('[data-chk]');
    if (chkEl) { st[chkEl.dataset.chk] = !st[chkEl.dataset.chk]; const k = chkEl.dataset.chk; render(false); document.querySelector(`[data-chk=${k}]`)?.focus(); return; }
    const b = e.target.closest('[data-act]'); if (b && !b.disabled) act(b.dataset.act);
  });
  addEventListener('keydown', (e) => {
    const t = e.target, tag = t.tagName;
    if (e.key === 'Alt') { document.body.classList.add('alt'); $('#win').classList.add('alt'); return; }
    if (e.altKey && /^[bB]$/.test(e.key)) { e.preventDefault(); const bb = document.querySelector('[data-act=back]:not(:disabled)'); bb && act('back'); return; }
    if (e.altKey && /^[nN]$/.test(e.key)) { e.preventDefault(); const p = document.querySelector('[data-act=primary]:not(:disabled)'); p && /Next|Install/.test(p.textContent) && act('primary'); return; }
    if ($('#toast').classList.contains('on')) { toast(false); return; }
    if (tag === 'SELECT') return;
    if (!e.ctrlKey && !e.metaKey && !e.altKey && /^[1-4]$/.test(e.key)) { st.dir = 'ABCD'[+e.key - 1]; render(false); return; }
    if (e.key === ' ' && t.dataset && t.dataset.chk) { e.preventDefault(); t.click(); return; }
    if (e.key === 'Enter' && tag !== 'BUTTON' && !(t.dataset && t.dataset.chk)) { const p = document.querySelector('[data-act=primary]:not(:disabled)'); if (p) act('primary'); return; }
    if (e.key === 'Escape') { const m = model(st.page); if (!m.noEsc) toast(true); }
  });
  addEventListener('keyup', (e) => { if (e.key === 'Alt') { document.body.classList.remove('alt'); $('#win').classList.remove('alt'); } });
  addEventListener('resize', fit);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  applyTheme(); fit(); render();
}
build();
</script></body></html>
