/* Reference names mapped onto the Navo tokens above (no colour literals below this line). */
:root {
  --bg: var(--background); --border: var(--line); --text-muted: var(--muted); --text-faint: var(--faint);
  --key-face: var(--keycap-face); --key-edge: var(--keycap-edge);
  --c-bg: var(--background); --c-rail: var(--rail); --c-zebra: var(--zebra); --c-line: var(--line); --c-text: var(--text); --c-muted: var(--muted); --c-faint: var(--faint);
  --c-hover: var(--hover); --c-selection: var(--selection); --c-accent: var(--accent); --c-accent-text: var(--accent-text);
  --c-folder: var(--folder); --c-code: var(--kind-code); --c-card: var(--card); --c-card-edge: var(--card-edge); --c-field: var(--field);
  --c-key-face: var(--keycap-face); --c-key-edge: var(--keycap-edge);
  --c-del: var(--diff-delete-text); --c-del-mark: var(--diff-delete-mark); --c-del-fill: var(--diff-delete-fill); --c-del-wash: var(--diff-delete-wash);

  --c-chg: var(--diff-change-text); --c-chg-mark: var(--diff-change-mark); --c-chg-wash: var(--diff-change-wash);
  --c-mov: var(--diff-moved-text); --c-mov-mark: var(--diff-moved-mark); --c-mov-wash: var(--diff-moved-wash);
  --c-conf: var(--diff-conflict-text); --c-auto: var(--diff-auto-merged-text); --c-auto-wash: var(--diff-auto-merged-wash); --c-hatch: var(--diff-gap-hatch);
  --c-syn-kw: var(--syntax-keyword); --c-syn-ty: var(--syntax-type); --c-syn-fn: var(--syntax-function); --c-syn-str: var(--syntax-string);
  --c-syn-num: var(--syntax-number); --c-syn-com: var(--syntax-comment); --c-syn-mac: var(--syntax-attribute);
  --fs-12: 0.75rem; --fs-13: 0.8125rem; --fs-14: 0.875rem; --fs-16: 1rem; --fs-18: 1.125rem; --fs-24: 1.5rem;
  --s-hair: 2px; --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-6: 24px; --s-8: 32px; --s-12: 48px;

  --fast: var(--motion-fade); --base: var(--motion-fade); --slow: 260ms; --ease-in: cubic-bezier(0.4, 0, 1, 1);

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--rail); color: var(--text); font-family: var(--font-ui); font-size: var(--fs-13); line-height: 1.35; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
kbd { font-family: var(--font-mono); font-size: var(--fs-12); padding-inline: var(--s-1); border-radius: var(--r-sm); background: var(--key-face); box-shadow: inset 0 0 0 1px var(--key-edge); color: var(--text-muted); white-space: nowrap; }
svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 13px; height: 13px; }
.mono { font-family: var(--font-mono); }
.num { font-variant-numeric: tabular-nums; }
.mu { color: var(--text-muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

/* harness */
.hx { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-2) var(--s-3); min-height: 44px; flex-wrap: wrap; }
.hx-title { font-weight: 700; font-size: var(--fs-14); white-space: nowrap; }
.hx-scn { display: inline-flex; gap: var(--s-hair); padding: var(--s-hair); border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg); overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.hx-scn button { border: 0; background: none; min-height: 28px; padding: 0 var(--s-2); border-radius: var(--r-sm); cursor: pointer; color: var(--text-muted); white-space: nowrap; display: inline-flex; align-items: center; gap: var(--s-1); }
.hx-scn button[aria-pressed="true"] { background: var(--selection); color: var(--text); font-weight: 600; }
.hx-desc { color: var(--text-muted); flex: 1 1 280px; min-width: 0; }
.hx-theme { margin-inline-start: auto; }
.page { height: 100dvh; display: grid; grid-template-rows: auto 1fr 12px; }
.stage { min-height: 0; padding: 0 var(--s-3); }

/* app window */
.app { container: app / inline-size; position: relative; height: 100%; display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-card); }
.tb { display: flex; align-items: center; gap: var(--s-3); height: 44px; padding-inline: var(--s-3); border-bottom: 1px solid var(--border); flex: none; }
.logo { display: inline-flex; align-items: center; gap: var(--s-2); font-weight: 700; }
.logo b { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; background: var(--text); color: var(--bg); font-family: var(--font-mono); font-size: var(--fs-12); letter-spacing: -0.04em; }
.search { flex: 0 1 520px; margin-inline: auto; display: flex; align-items: center; gap: var(--s-2); height: 30px; padding-inline: var(--s-3); border: 1px solid var(--border); border-radius: var(--r-full); background: var(--field); color: var(--text-muted); cursor: pointer; }
.search span { flex: 1; text-align: start; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ib { display: inline-grid; place-items: center; min-width: 30px; height: 30px; border: 0; border-radius: var(--r-md); background: none; color: var(--text-muted); cursor: pointer; }
.ib:hover { background: var(--hover); color: var(--text); }
.btn { display: inline-flex; align-items: center; gap: var(--s-1); height: 28px; padding-inline: var(--s-2); border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg); color: var(--text); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn[disabled] { color: var(--text-faint); cursor: not-allowed; background: var(--rail); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
.btn.pri[disabled] { background: var(--rail); border-color: var(--border); color: var(--text-muted); font-weight: 500; }
.btn kbd { margin-inline-start: var(--s-1); }
.seg { display: inline-flex; gap: var(--s-hair); padding: var(--s-hair); border: 1px solid var(--border); border-radius: var(--r-md); background: var(--rail); flex: none; }
.seg button { display: inline-flex; align-items: center; gap: var(--s-1); border: 0; background: none; height: 24px; padding: 0 var(--s-2); border-radius: var(--r-sm); color: var(--text-muted); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px var(--border); }
.seg .ct { font-variant-numeric: tabular-nums; color: var(--text-muted); font-weight: 500; }

.vh { display: flex; align-items: center; gap: var(--s-2); min-height: 40px; padding: var(--s-1) var(--s-3); border-bottom: 1px solid var(--border); flex-wrap: wrap; flex: none; }
.vh-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.vh-meta { color: var(--text-muted); white-space: nowrap; }
.vh .grow { flex: 1; }
.body { position: relative; flex: 1; min-height: 0; display: flex; }
.st { display: flex; align-items: center; gap: var(--s-3); min-height: 26px; padding: var(--s-1) var(--s-3); border-top: 1px solid var(--border); color: var(--text-muted); font-size: var(--fs-12); flex: none; overflow: hidden; }
.st .grow { flex: 1; }
.st .keys { display: flex; gap: var(--s-3); white-space: nowrap; overflow: hidden; }
.st .keys span { display: inline-flex; gap: var(--s-1); align-items: center; }

/* status glyph chips */
.sg { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: var(--r-sm); font-family: var(--font-mono); font-size: var(--fs-12); font-weight: 700; flex: none; }
.sg.diff { color: var(--c-chg); background: var(--c-chg-wash); }
.sg.lo { color: var(--c-del); background: var(--c-del-wash); }
.sg.ro { color: var(--c-add); background: var(--c-add-wash); }
.sg.same { color: var(--text-faint); }
.sg.hash { color: var(--accent-text); }
.sg.ign { color: var(--text-faint); }
.dl { font-family: var(--font-mono); font-size: var(--fs-12); white-space: nowrap; }
.dl .p { color: var(--c-add); }
.dl .m { color: var(--c-del); }

/* text rows */
.scroller { position: relative; flex: 1; min-width: 0; overflow: auto; scrollbar-width: none; overscroll-behavior: contain; }
.scroller::-webkit-scrollbar { display: none; }
.code { font-family: var(--font-mono); font-size: var(--fs-13); line-height: var(--row-h); min-width: max-content; width: 100%; padding-block-end: var(--s-8); }
.r { display: grid; min-height: var(--row-h); position: relative; }
.r.split { grid-template-columns: var(--ln-w) minmax(0, 1fr) var(--mid-w) var(--ln-w) minmax(0, 1fr); }
.r.inline { grid-template-columns: var(--ln-w) var(--ln-w) 16px minmax(0, 1fr); }
.ln { color: var(--text-faint); text-align: end; padding-inline-end: var(--s-2); user-select: none; font-variant-numeric: tabular-nums; font-size: var(--fs-12); }
.gl { text-align: center; user-select: none; font-weight: 700; }
.tx { white-space: pre; padding-inline: var(--s-2) var(--s-4); position: relative; overflow: hidden; }
.tx[contenteditable="true"] { outline: 1px solid var(--accent); background: var(--bg); }
.fill { background: repeating-linear-gradient(135deg, var(--c-hatch) 0 2px, transparent 2px 7px); }
.fill::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; border-inline-start: 1px dashed var(--text-faint); }
.k-del { box-shadow: inset var(--bar-h) 0 0 var(--c-del-mark); }
.k-add { box-shadow: inset var(--bar-h) 0 0 var(--c-add-mark); }
.k-chg { box-shadow: inset var(--bar-h) 0 0 var(--c-chg-mark); }
.k-mov { box-shadow: inset var(--bar-h) 0 0 var(--c-mov-mark); background: var(--c-mov-wash); }
.k-ws { box-shadow: inset var(--bar-h) 0 0 var(--text-faint); }
.k-done { box-shadow: inset var(--bar-h) 0 0 var(--accent); background: var(--c-auto-wash); }
.wash .k-del { background: var(--c-del-wash); }
.wash .k-add { background: var(--c-add-wash); }
.wash .k-chg { background: var(--c-chg-wash); }
.g-del { color: var(--c-del); }
.g-add { color: var(--c-add); }
.g-chg { color: var(--c-chg); }
.g-mov { color: var(--c-mov); }
mark.il-del { background: var(--c-del-fill); color: inherit; border-radius: 2px; }
mark.il-add { background: var(--c-add-fill); color: inherit; border-radius: 2px; }
.r.cur::after { content: ""; position: absolute; inset-inline-start: 0; inset-block: 0; width: 2px; background: var(--accent); animation: fade-in var(--base) var(--ease-out); }
.r.cur-top::before { content: attr(data-label); position: absolute; inset-inline-end: var(--s-3); top: 1px; z-index: 1; font-family: var(--font-ui); font-size: var(--fs-12); line-height: 18px; padding-inline: var(--s-1); border-radius: var(--r-sm); background: var(--accent); color: var(--bg); pointer-events: none; animation: fade-in var(--base) var(--ease-out); }
.mid { display: flex; align-items: center; justify-content: center; gap: 0; }
.cp { display: inline-grid; place-items: center; width: 17px; height: 18px; padding: 0; border: 0; border-radius: var(--r-sm); background: none; color: var(--text-muted); cursor: pointer; }
.cp:hover { background: var(--selection); color: var(--accent-text); }
.fold { display: flex; align-items: center; gap: var(--s-2); height: 24px; padding-inline: var(--s-3); color: var(--text-muted); background: var(--rail); border-block: 1px solid var(--border); font-family: var(--font-ui); font-size: var(--fs-12); cursor: pointer; width: 100%; border-inline: 0; text-align: start; }
.fold:hover { color: var(--text); }
.note { font-family: var(--font-ui); font-size: var(--fs-12); color: var(--c-mov); padding-inline-start: var(--s-2); }
.ws-badge { font-family: var(--font-ui); font-size: var(--fs-12); color: var(--text-muted); border: 1px solid var(--border); border-radius: var(--r-full); padding-inline: var(--s-1); margin-inline-start: var(--s-2); }
.t-kw { color: var(--c-syn-kw); } .t-ty { color: var(--c-syn-ty); } .t-fn { color: var(--c-syn-fn); } .t-str { color: var(--c-syn-str); } .t-num { color: var(--c-syn-num); } .t-com { color: var(--c-syn-com); font-style: italic; } .t-mac { color: var(--c-syn-mac); }
.pend .tx, .pend .ln { color: transparent; }
.pend .tx::after { content: ""; position: absolute; inset-block: 7px; inset-inline-start: var(--s-2); width: var(--w, 60%); border-radius: var(--r-sm); background: var(--c-hatch); }

/* change map */
.map { position: relative; flex: none; background: var(--rail); touch-action: none; cursor: pointer; user-select: none; }

.map-b { position: absolute; border-radius: 1px; pointer-events: none; }
.v .map-b { min-height: 3px; }
.h .map-b { min-width: 3px; }
.map-b.del, .map-b.lo { background: var(--c-del-mark); }
.map-b.add, .map-b.ro { background: var(--c-add-mark); }
.map-b.chg, .map-b.diff { background: var(--c-chg-mark); }
.map-b.mov { background: var(--c-mov-mark); }
.map-b.ws { background: var(--text-faint); }
.map-b.conf { background: var(--c-conf); }

.map-b.cur { outline: 2px solid var(--text); outline-offset: 1px; z-index: 1; }
.map-t { position: absolute; background: var(--text-faint); pointer-events: none; }
.v .map-t { inset-inline-start: 0; width: 3px; height: 1px; }
.h .map-t { top: 0; height: 3px; width: 1px; }
.map-n { position: absolute; font-size: 10px; line-height: 12px; font-weight: 700; color: var(--bg); background: var(--text); border-radius: 3px; padding-inline: 2px; pointer-events: none; z-index: 2; }
.map-vp { position: absolute; inset-inline: 0; top: 0; border: 1px solid var(--text-muted); background: color-mix(in oklch, var(--text) 8%, transparent); border-radius: 2px; pointer-events: none; will-change: transform; }
.h .map-vp { inset-inline: auto; inset-block: 0; left: 0; }
.map-pend { position: absolute; inset-inline: 0; bottom: 0; top: 0; background: repeating-linear-gradient(135deg, var(--c-hatch) 0 3px, transparent 3px 6px); transform-origin: bottom; pointer-events: none; transition: transform var(--slow) var(--ease-out); }
.h .map-pend { transform-origin: right; }
.map-tip { position: absolute; z-index: var(--z-pop); padding: var(--s-1) var(--s-2); border-radius: var(--r-sm); background: var(--text); color: var(--bg); font-size: var(--fs-12); white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity var(--fast) var(--ease-out); }
.map-tip.on { opacity: 1; }
.v .map-tip { inset-inline-end: calc(100% + 6px); }
.spine .map-tip { inset-inline-end: calc(100% + 6px); }
.h .map-tip { top: calc(100% + 4px); }
.map canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: var(--s-1) var(--s-3); font-size: var(--fs-12); color: var(--text-muted); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-inline-end: var(--s-1); }

/* folder rows */
.fl { min-width: 0; font-size: var(--fs-13); }
.fr { display: grid; align-items: center; min-height: var(--list-h); position: relative; cursor: default; }
.fr:hover { background: var(--hover); }
.fr[aria-selected="true"] { background: var(--selection); }
.fr[aria-selected="true"]::after { content: ""; position: absolute; inset-inline-start: 0; inset-block: 3px; width: 3px; border-radius: 2px; background: var(--accent); }
.fr.cur { background: var(--selection); }
.nm { display: flex; align-items: center; gap: var(--s-1); min-width: 0; padding-inline-end: var(--s-2); }
.nm span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nm .tw { display: inline-grid; place-items: center; width: 16px; height: 16px; border: 0; padding: 0; background: none; color: var(--text-muted); cursor: pointer; flex: none; }
.nm .tw[aria-expanded="true"] { transform: rotate(90deg); }

.ic-dir { color: var(--c-folder); }

.fr.st-same .t, .fr.st-ign .t { color: var(--text-muted); }

.fr.st-lo .t { color: var(--c-del); font-weight: 600; }
.fr.st-ro .t { color: var(--c-add); font-weight: 600; }
.fr .meta { color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: end; padding-inline-end: var(--s-2); font-size: var(--fs-12); }
.fr .gone { align-self: stretch; }
.hp { display: inline-flex; align-items: center; gap: var(--s-1); font-size: var(--fs-12); color: var(--accent-text); white-space: nowrap; }
.hp .bar { width: 48px; height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; }
.hp .bar i { display: block; height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(var(--p)); transition: transform var(--slow) var(--ease-out); }
.fr.enter { animation: row-in var(--base) var(--ease-out) both; animation-delay: calc(var(--d, 0) * 12ms); }
.colh { display: grid; align-items: center; height: 26px; color: var(--text-muted); font-size: var(--fs-12); border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: var(--z-sticky); }
.cmpbar { display: flex; align-items: center; gap: var(--s-2) var(--s-3); padding: var(--s-2) var(--s-3); border-bottom: 1px solid var(--border); flex-wrap: wrap; flex: none; }
.side { display: inline-flex; align-items: center; gap: var(--s-1); min-width: 0; height: 28px; padding-inline: var(--s-2); border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg); cursor: pointer; }
.side .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); font-size: var(--fs-12); }
.ro-tag { display: inline-flex; align-items: center; gap: 2px; font-size: var(--fs-12); color: var(--text-muted); white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: var(--s-1); height: 26px; padding-inline: var(--s-2); border: 1px solid var(--border); border-radius: var(--r-full); background: var(--bg); color: var(--text-muted); cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--text); background: var(--selection); }

/* overlays */
.drawer { position: absolute; inset-block: 0; z-index: var(--z-overlay); width: min(var(--drawer-w), 88%); background: var(--card); box-shadow: var(--shadow-menu); display: flex; flex-direction: column; overflow: hidden; }
.drawer.l { inset-inline-start: 0; }
.drawer.r { inset-inline-end: 0; }
.drawer.enter.l { animation: in-l var(--base) var(--ease-out); }
.drawer.enter.r { animation: in-r var(--base) var(--ease-out); }
.dh { display: flex; align-items: center; gap: var(--s-2); height: 40px; padding-inline: var(--s-3); border-bottom: 1px solid var(--border); font-weight: 700; flex: none; }
.dh .grow { flex: 1; }
.db { padding: var(--s-3); overflow: auto; display: flex; flex-direction: column; gap: var(--s-3); }
.db h3 { margin: 0; font-size: var(--fs-12); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
.db label { display: flex; gap: var(--s-2); align-items: center; }
.db textarea { font-family: var(--font-mono); font-size: var(--fs-13); width: 100%; min-height: 88px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--field); color: var(--text); padding: var(--s-2); resize: vertical; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: var(--s-1) var(--s-3); }
.kv dt { color: var(--text-muted); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.dlist { display: flex; flex-direction: column; }
.dlist button { display: flex; align-items: center; gap: var(--s-2); min-height: 30px; border: 0; background: none; text-align: start; padding-inline: var(--s-2); border-radius: var(--r-md); cursor: pointer; }
.dlist button:hover { background: var(--hover); }
.dlist .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu { position: absolute; z-index: var(--z-pop); top: var(--s-1); inset-inline-end: var(--s-3); width: 300px; max-width: calc(100% - 24px); background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow-menu); padding: var(--s-1); transform-origin: top right; }
.menu.enter { animation: pop var(--base) var(--ease-out); }
.menu .mh { display: flex; align-items: center; gap: var(--s-2); padding: var(--s-2); }
.menu button.mi { display: flex; align-items: center; gap: var(--s-2); width: 100%; min-height: 32px; padding-inline: var(--s-2); border: 0; background: none; border-radius: var(--r-md); text-align: start; cursor: pointer; }
.menu button.mi:hover { background: var(--hover); }
.menu .mi .t { flex: 1; }
.menu .ck { width: 15px; color: var(--accent-text); }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: var(--s-1) 0; }
.toast { position: absolute; z-index: var(--z-toast); inset-inline-start: 50%; bottom: var(--s-6); transform: translateX(-50%); display: flex; align-items: center; gap: var(--s-3); max-width: calc(100% - 24px); padding: var(--s-2) var(--s-2) var(--s-2) var(--s-3); background: var(--text); color: var(--bg); border-radius: var(--r-md); box-shadow: var(--shadow-menu); }
.toast.enter { animation: toast-in var(--base) var(--ease-out); }
.toast .btn { background: transparent; color: var(--bg); border-color: color-mix(in oklch, var(--bg) 40%, transparent); }
.toast .btn:hover { background: color-mix(in oklch, var(--bg) 14%, transparent); }
.toast kbd { background: transparent; color: var(--bg); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--bg) 40%, transparent); }
.toast code { font-family: var(--font-mono); font-size: var(--fs-12); }
.prog { position: relative; height: 3px; background: var(--border); overflow: hidden; flex: none; }
.prog i { position: absolute; inset: 0; background: var(--accent); transform-origin: left; transform: scaleX(var(--p)); transition: transform var(--slow) var(--ease-out); }

/* merge */
.cf { margin: var(--s-1) var(--s-2); border: 1px solid var(--c-del-mark); border-radius: var(--r-md); overflow: hidden; font-family: var(--font-ui); background: var(--bg); }

.cf-h { display: flex; align-items: center; gap: var(--s-2); padding: var(--s-1) var(--s-2); background: var(--c-del-wash); flex-wrap: wrap; }
.cf.solved .cf-h { background: var(--rail); }
.cf.ws .cf-h { background: var(--rail); }
.cf-h .t { font-weight: 700; }
.cf-h .grow { flex: 1; }
.cf-opt { display: grid; grid-template-columns: 64px minmax(0, 1fr); border-top: 1px solid var(--border); }
.cf-opt > span { font-size: var(--fs-12); color: var(--text-muted); padding: var(--s-hair) var(--s-2); }
.cf-opt .code { padding: 0; min-width: 0; }
.pick { display: inline-flex; gap: var(--s-1); flex-wrap: wrap; }
.auto-tag { font-family: var(--font-ui); font-size: var(--fs-12); color: var(--c-auto); padding-inline-start: var(--s-2); }
.k-auto { box-shadow: inset var(--bar-h) 0 0 var(--c-auto); background: var(--c-auto-wash); }
.k-conf { box-shadow: inset var(--bar-h) 0 0 var(--c-conf); background: var(--c-del-wash); }
.counter { display: inline-flex; align-items: center; gap: var(--s-1); height: 26px; padding-inline: var(--s-2); border-radius: var(--r-full); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--c-del); background: var(--c-del-wash); white-space: nowrap; }
.counter.ok { color: var(--c-add); background: var(--c-add-wash); }
.pane-h { display: flex; align-items: center; gap: var(--s-2); height: 30px; padding-inline: var(--s-2) var(--s-3); border-bottom: 1px solid var(--border); background: var(--rail); font-size: var(--fs-12); white-space: nowrap; overflow: hidden; flex: none; }
.pane-h .t { font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; }
.col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

/* hex */
.hex { font-family: var(--font-mono); font-size: var(--fs-13); line-height: var(--row-h); padding: var(--s-2) var(--s-3); }
.hexr { display: grid; grid-template-columns: 11ch 1fr; gap: var(--s-3); white-space: pre; }
.hexr .off { color: var(--text-faint); }
.hx-d { background: var(--c-chg-wash); color: var(--c-chg); font-weight: 700; box-shadow: inset 0 -2px 0 var(--c-chg-mark); }
.blocks { display: grid; gap: 2px; }
.blk { border: 0; padding: 0; border-radius: 2px; background: var(--border); cursor: pointer; min-height: 10px; }
.blk.d { background: var(--c-chg-mark); }
.blk.cur { outline: 2px solid var(--text); outline-offset: 1px; }

@keyframes fade-in { from { opacity: 0; } }
@keyframes row-in { from { opacity: 0; } }
@keyframes in-l { from { opacity: 0; } }
@keyframes in-r { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; } }
@keyframes toast-in { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}

@container app (max-width: 720px) {
  .search span, .search kbd { display: none; }
  .search { flex: none; width: 36px; justify-content: center; padding: 0; margin-inline: auto 0; }
  .winctl { display: none; }
  .st .keys span.wide { display: none; }
  .vh { gap: var(--s-1) var(--s-2); }
  .hide-n { display: none !important; }
}
@container app (min-width: 721px) { .show-n { display: none !important; } }
@media (max-width: 720px) {
  .stage { padding: 0; }
  .app { border-radius: 0; border-inline: 0; }
  .hx-desc { display: none; }
  .hx { gap: var(--s-2); padding: var(--s-1) var(--s-2); }
  .hx-title { display: none; }
  .hx { flex-wrap: nowrap; }
  .hx-scn { flex: 1; min-width: 0; }
  .hx-scn kbd { display: none; }
}

/* direction 2 navigator, direction 3 preview */
.navcol { width: var(--nav-w); flex: none; display: flex; flex-direction: column; border-inline-end: 1px solid var(--border); background: var(--rail); overflow: auto; }
.navcol.mini { flex-direction: row; overflow: hidden; width: calc(var(--nav-w) + 96px); }
.navcol.mini .map { height: 100%; }
.navsec { display: flex; flex-direction: column; gap: var(--s-1); padding: var(--s-3); align-items: flex-start; }
.navsec.legend { flex-direction: row; flex-wrap: wrap; margin-top: auto; }
.navcol .dlist { padding-inline: var(--s-1); }
.navcol .dlist button { flex-wrap: wrap; padding-block: var(--s-1); }
.dlist button[aria-current="true"] { background: var(--selection); }
.nt { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.nt .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: var(--s-1); }
.navcol .dlist button .nt { flex-direction: row; justify-content: space-between; gap: var(--s-2); }
.navcol.mini .dlist button .nt { flex-direction: column; }
.fbar { display: flex; width: 100%; height: 6px; border-radius: 3px; overflow: hidden; gap: 1px; background: var(--bg); }
.fbar i { display: block; min-width: 2px; }
.fbar .diff { background: var(--c-chg-mark); } .fbar .lo { background: var(--c-del-mark); } .fbar .ro { background: var(--c-add-mark); } .fbar .same { background: var(--border); } .fbar .hash { background: var(--accent); }
.sg.mov { color: var(--c-mov); background: var(--c-mov-wash); }
.pv { border-block: 1px solid var(--border); background: var(--rail); padding-block: var(--s-2); animation: row-in var(--base) var(--ease-out); }
.pv-in { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg); overflow: auto; max-height: 300px; margin-inline-end: var(--s-3); }
.pv-in .code { padding-block-end: 0; }
.pv-f { padding: var(--s-2) 0 0; }
.map[data-numbers="all"] .map-n { top: 2px; }

.ln[data-act="lsel"] { cursor: pointer; }
.ln[data-act="lsel"]:hover { color: var(--accent-text); }
.ln.lsel, .tx.lsel { background: var(--selection) !important; }
.tx.lsel { box-shadow: inset var(--bar-h) 0 0 var(--accent) !important; }
.ln .cb { display: inline-block; width: 11px; height: 11px; margin-inline-end: 6px; vertical-align: -1px; border: 1.5px solid var(--text-faint); border-radius: 3px; opacity: 0; transition: opacity 80ms; }
.r:hover .ln .cb, .r.hov .ln .cb, .has-sel .ln .cb { opacity: 1; }
.ln.lsel .cb { opacity: 1; border-color: var(--accent); background: var(--accent); position: relative; }
.ln.lsel .cb::after { content: ""; position: absolute; left: 3px; top: 0; width: 3px; height: 6px; border: solid var(--bg); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }
.hbar { display: none; position: absolute; z-index: 3; top: -26px; left: 50%; transform: translateX(-50%); gap: 2px; padding: 2px; border-radius: var(--r-md); background: var(--card); box-shadow: var(--shadow-menu); font-family: var(--font-ui); font-size: var(--fs-12); white-space: nowrap; }
.r.inline .hbar { left: auto; right: var(--s-3); transform: none; }
.r.hov .hbar { display: flex; animation: fade-in 80ms var(--ease-out); }
.hbar button { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border: 0; border-radius: var(--r-sm); background: none; cursor: pointer; }
.hbar button:hover { background: var(--selection); color: var(--accent-text); }
.hbar .sep { width: 1px; background: var(--border); margin-block: 4px; }
.r.hov .tx { outline: 1px solid color-mix(in oklch, var(--accent) 35%, transparent); outline-offset: -1px; }
.cmenu { position: fixed; z-index: 40; min-width: 260px; max-width: calc(100vw - 16px); background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow-menu); padding: var(--s-1); animation: fade-in 80ms var(--ease-out); font-family: var(--font-ui); }
.cmenu button { display: flex; align-items: center; gap: var(--s-2); width: 100%; min-height: 30px; padding-inline: var(--s-2); border: 0; background: none; border-radius: var(--r-md); text-align: start; cursor: pointer; color: var(--text); }
.cmenu button:hover, .cmenu button:focus-visible { background: var(--hover); }
.cmenu button[disabled] { color: var(--text-faint); cursor: default; background: none; }
.cmenu .t { flex: 1; }
.cmenu hr { border: 0; border-top: 1px solid var(--border); margin: var(--s-1) 0; }
.selbar { position: absolute; z-index: var(--z-toast); inset-inline-start: 50%; bottom: 40px; transform: translateX(-50%); display: flex; align-items: center; gap: var(--s-2); flex-wrap: wrap; justify-content: center; max-width: calc(100% - 24px); padding: var(--s-1) var(--s-1) var(--s-1) var(--s-3); background: var(--card); border-radius: var(--r-md); box-shadow: var(--shadow-menu); animation: fade-in 80ms var(--ease-out); }
.selbar b { font-variant-numeric: tabular-nums; }

/* stream (from B) in the Reference's calm look */
.stream { background: var(--rail); padding: var(--s-2) var(--s-3) var(--s-8); }
.card { position: relative; background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-md); margin-block-end: var(--s-2); }
.card.cur-card { border-color: var(--card-ring); }
.card-h { position: sticky; top: calc(-1 * var(--s-2)); z-index: var(--z-sticky); display: flex; align-items: center; gap: var(--s-2); min-height: 36px; padding: var(--s-1) var(--s-2); background: var(--card); border-bottom: 1px solid var(--border); border-radius: var(--r-md) var(--r-md) 0 0; min-width: 0; }
.card.collapsed .card-h { border-bottom: 0; border-radius: var(--r-md); }
.card-h .tw { display: inline-grid; place-items: center; width: 20px; height: 20px; border: 0; padding: 0; background: none; color: var(--text-muted); cursor: pointer; border-radius: var(--r-sm); flex: none; }
.card-h .tw:hover { background: var(--hover); color: var(--text); }
.card-h .tw[aria-expanded="true"] svg { transform: rotate(90deg); }
.card-n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-13); }
.card-n b { font-weight: 600; }
.card-d { color: var(--text-muted); }
.card-h .grow { flex: 1; }

/* Builds the Reference's folder TREE from the round-2 entries, and keeps one block list per changed text file. */
const pathDir = (p) => p.split('/').slice(0, -1).join('/');
const pathBase = (p) => p.split('/').pop();

/** Counts the lines a block list adds and removes; returns "+a −d" (copied blocks count as settled). */
function deltaOf(blocks) {

  for (const b of blocks) { if (b.t === 's' || b.t === 'done') continue; a += (b.r || []).length; d += (b.l || []).length; }
  return `+${a} −${d}`;
}

/** Block lists keyed by path; copy.rs uses the Reference's richer blocks (moved code, whitespace). */
const FILE_BLOCKS = {};

/** Turns one round-2 entry into a Reference tree node (F) with status, sizes and open target. */
function nodeOf(e) {

  const s = { chg: 'diff', lo: 'lo', ro: 'ro', mov: 'diff', rule: 'same', chk: 'hash', same: 'same' }[e.st];
  const extra = {};
  if (e.diff) FILE_BLOCKS[e.path] = e.path === COPY_PATH ? COPY_BLOCKS : DIFFS[e.diff];
  if (e.st === 'mov') extra.moved = { from: e.from, similar: e.similar };
  if (e.st === 'rule') extra.rule = e.rule;
  if (e.st === 'chk') Object.assign(extra, { hash: 0.34, then: 'diff', open: 'large' });
  if (e.kind === 'bin') Object.assign(extra, { bin: true, open: 'hex' });
  if (e.kind === 'img') Object.assign(extra, { bin: true, open: 'image' });
  if (e.path === JOURNAL_PATH) extra.open = 'merge';
  if (e.origin) extra.origin = e.origin;
  if (e.why) extra.why = e.why;
  if (FILE_BLOCKS[e.path] && s !== 'same') extra.delta = deltaOf(FILE_BLOCKS[e.path]);
  return F(pathBase(e.path), s, meta(e.L), meta(e.R), extra);
}

  ].filter(Boolean).join('');
  const count = text ? (left ? `${left} change${left > 1 ? 's' : ''}` : `${ic('check', 'sm')}all copied`) : '';
  const head = `<header class="card-h">
    <button class="tw" data-act="scollapse" data-f="${esc(p)}" aria-expanded="${!collapsed}" aria-label="${collapsed ? 'Expand' : 'Collapse'} ${esc(n.name)}" title="${collapsed ? 'Expand' : 'Collapse'} (→ / ←)">${ic('right', 'sm')}</button>
    ${sg(st)}<span class="card-n" title="${esc(p)}">${dir ? `<span class="card-d">${esc(dir)}/</span>` : ''}<b>${esc(n.name)}</b></span>${tags}

    <button class="ib" data-act="sopen" data-f="${esc(p)}" aria-label="Open ${esc(n.name)} in the full diff" title="Open the full diff (Enter)">${ic('cols', 'sm')}</button>
  </header>`;
  const body = collapsed ? '' : text ? cardDiff(n, fi, hits && hits.size && !nameHit ? hits : null) : cardSummary(n, fi);
  return `<section class="card${viewed ? ' viewed' : ''}${collapsed ? ' collapsed' : ''}${S.curCard === p ? ' cur-card' : ''}" data-card="${esc(p)}" aria-label="${esc(p)}">${head}${body}</section>`;
}

/** The whole Stream scenario: header with scope, search and view; cards; Viewed progress in the status line. */
function streamView() {
  const files = streamFiles();
  if (!S.collInit) { files.forEach((n) => { if (isViewed(n)) S.collapsed.add(n.path); }); S.collInit = true; }
  const cards = files.map((n, fi) => streamCard(n, fi)).join('');
  S._stops = (cards.match(/data-tip=/g) || []).length;
  const viewed = files.filter(isViewed).length, q = ql();
  const scope = S.streamRoot
    ? `<button class="chip" data-act="sscope" title="Show every difference in the compare">${ic('folder', 'sm ic-dir')}<span class="mono">${esc(S.streamRoot)}</span>${ic('x', 'sm')}</button>`
    : `<span class="chip quiet">${ic('folder', 'sm ic-dir')}Whole compare</span>`;

  let qbar = '';
  if (q) {

    qbar = `<div class="qbar" role="status"><span class="num"><b>${nm}</b> matching change${nm === 1 ? '' : 's'} in ${shown.length} file${shown.length === 1 ? '' : 's'}</span><span class="grow"></span>${pend ? `<button class="btn pri" data-act="plan-copy" data-v="L" title="Shows a plan first (Ctrl+Alt+Shift+← or →)">${ic('copy', 'sm')}Copy ${pend} match${pend > 1 ? 'es' : ''}…</button>` : nm ? `<span class="mu">${ic('check', 'sm')} Every match is copied</span>` : ''}<button class="btn" data-act="sclear">Clear ${kb('Esc')}</button></div>`;
  }
  const rules = ruleFiles();
  const foot = rules.length && !q ? `<p class="s-note">${ic('filter', 'sm')}${rules.length} more files differ only by rules (line endings, byte-order mark) and are hidden. Ctrl+I lists them.</p>` : '';
  const empty = `<p class="s-empty">${q ? `No difference contains “${esc(S.q)}”.` : 'No differences under this folder.'}</p>`;
  const progress = `<span class="vcount" role="status" title="Files marked Viewed (V)"><span class="bar"><i style="--p:${files.length ? viewed / files.length : 0}"></i></span><span class="num">Viewed <b>${viewed}</b> of ${files.length}</span></span>`;
  return `<div class="vh"><button class="ib" data-act="back" aria-label="Back to the folders" title="Back to the folders (Esc)">${ic('al', 'sm')}</button>${ic('list', 'sm')}<span class="vh-name">Differences</span>${scope}<span class="vh-meta hide-n num">${files.length} files</span><span class="grow"></span>${find}${navBtns()}${layoutSeg()}${viewBtn()}${saveFileBtn()}</div>
  ${qbar}<div class="body"><div class="scroller stream" id="sc" data-nav>${cards || empty}${foot}</div>${mapEl('sc')}</div>
  <footer class="st">${progress}<span class="hide-n">${S.dirty.L || S.dirty.R ? dirtyMark('L') || dirtyMark('R') : 'Hover a change to copy it'}</span><span class="grow"></span>${keys([['J / K', 'Next / previous change'], ['Shift+J', 'Next file', 1], ['V', 'Viewed', 1], ['/', 'Search', 1], ['Enter', 'Open', 1], ['Ctrl+B', 'Outline', 1]])}</footer>`;
}

/** Marks the current card (ring) without a re-render. */
function setCurCard(p) {
  if (!p) return;
  S.curCard = p;
  document.querySelectorAll('.card').forEach((c) => c.classList.toggle('cur-card', c.dataset.card === p));
  document.querySelectorAll('.dlist.ol button').forEach((b) => b.setAttribute('aria-current', b.dataset.f === p ? 'true' : 'false'));
}
/** The card that holds the current change, else the remembered one. */
function curCardPath() {
  const el = S.cur !== -1 && document.querySelector(`.stream [data-h="${S.cur}"]`);
  return (el && el.closest('.card')?.dataset.card) || S.curCard;
}
/** Scrolls to a card and makes its first change current (collapsed cards just scroll). */
function goCard(p) {
  const sc = document.getElementById('sc'), card = sc && sc.querySelector(`.card[data-card="${CSS.escape(p)}"]`);
  if (!card) return;
  const first = card.querySelector('[data-h]');
  if (first) goHunk(first.dataset.h, true);
  else S.cur = -1;
  // Show the file from its header when its first change fits on screen.
  const top = sc.scrollTop + card.getBoundingClientRect().top - sc.getBoundingClientRect().top - 8;
  const hunkY = first ? first.getBoundingClientRect().top - card.getBoundingClientRect().top : 0;
  if (hunkY < sc.clientHeight * 0.7) sc.scrollTop = top;
  setCurCard(p);
}
/** Shift+J / Shift+K: next or previous file card. */
function stepCard(d) {
  const cards = [...document.querySelectorAll('.stream .card')].map((c) => c.dataset.card);
  if (!cards.length) return;
  const i = cards.indexOf(curCardPath());
  goCard(cards[i < 0 ? 0 : Math.max(0, Math.min(cards.length - 1, i + d))]);
}
/** V: toggles Viewed for the current card; marking collapses it and moves on to the next file. */
function toggleViewed(p) {
  p = p || curCardPath();
  const n = p && byPath(p);
  if (!n) return;
  const key = contentKey(n);
  if (VIEWED.has(key)) { VIEWED.delete(key); S.collapsed.delete(p); }
  else {
    for (const k of [...VIEWED]) if (k.startsWith(p + '@')) VIEWED.delete(k);
    VIEWED.add(key); S.collapsed.add(p);
  }
  saveViewed();
  const marked = VIEWED.has(key);
  render();
  if (marked) { const files = streamFiles(), i = files.findIndex((f) => f.path === p); const next = files.slice(i + 1).find((f) => !isViewed(f)); if (next) goCard(next.path); else setCurCard(p); }
  else goCard(p);
}
/** ← / → or the twisty: collapses or expands one card. */
function collapseCard(p, want) {
  if (!p) return;
  const isC = S.collapsed.has(p), next = want === undefined ? !isC : want;
  if (next === isC) return;
  if (next) S.collapsed.add(p); else S.collapsed.delete(p);
  render(); goCard(p);
}
/** Copies one change of a stream card right away (undo with Ctrl+Z), as the Reference does in the file diff. */
function streamCopy(p, bi, dir) {
  S.filePath = p; S.blocks = S.fb[p];
  copyBlock(bi, dir);
  render();
}
/** Opens the Stream of all differences under the selected folder (or the whole compare), starting at the selected file. */
function openStream() {
  const n = byPath(S.sel);
  S.streamRoot = n && n.dir && statusOf(n) !== 'same' ? n.path : '';
  const start = n && !n.dir ? n.path : null;
  S.from = 'folders';
  setScn('stream');
  const files = streamFiles();
  const target = start && files.some((f) => f.path === start) ? start : files[0]?.path;
  if (target) goCard(target);
  document.getElementById('sc')?.focus({ preventScroll: true });
}
/** Enter on a card: opens that file in its full view and remembers where the stream was. */
function openCard(p) {
  p = p || curCardPath();
  const n = p && byPath(p);
  if (!n) return;
  const sc = document.getElementById('sc');
  S.ret = { card: p, cur: S.cur, top: sc ? sc.scrollTop : 0 };
  const st = statusOf(n);
  if (st === 'lo' || st === 'ro') { toast(`${esc(n.name)} exists only on the ${st === 'lo' ? 'left' : 'right'}. F3 views it.`); render(); return; }
  if (st === 'hash') { toast(`${esc(n.name)} is still being checked. It opens when the hash is done.`); render(); return; }
  if (n.open === 'image') { toast(`${esc(n.name)}: images open side by side in the image viewer (not in this prototype)`); render(); return; }
  const hm = /^f\d+h(\d+)$/.exec(String(S.cur));
  const cardOfCur = curCardPath() === p;
  S.from = 'stream';
  if (n.open === 'merge') return setScn('merge');
  if (n.open === 'hex') { S.largeTab = 'hex'; return setScn('large'); }
  if (n.open === 'large') { S.largeTab = 'text'; return setScn('large'); }
  openFile(p, 'stream', hm && cardOfCur ? +hm[1] : null);
}
/** Opens one text file in the Reference's full-window diff; `from` decides where Esc returns. */
function openFile(p, from, hunk) {
  S.filePath = p; S.blocks = S.fb[p]; S.lsel = null; S.lastSel = null;
  setScn('file');
  S.from = from;
  if (hunk != null) goHunk(hunk, true);
}
/** Esc from the stream card's full view: back to the same card and scroll position. */
function returnToStream() {
  const r = S.ret || {};
  S.from = 'folders';
  setScn('stream');
  const sc = document.getElementById('sc');
  if (sc && r.top != null) sc.scrollTop = r.top;
  if (r.cur != null && r.cur !== -1 && document.querySelector(`.stream [data-h="${r.cur}"]`)) goHunk(r.cur, false);
  setCurCard(r.card);
}
/** Esc chain end and the back arrow: stream → folders (selecting the current file); full view → where it came from. */
function goBack() {
  if (S.scn === 'stream') {
    const p = curCardPath();
    setScn('folders');
    if (p) selectPath(p, true);
    return;
  }
  if (S.from === 'stream') return returnToStream();
  const p = S.scn === 'file' ? S.filePath : S.scn === 'merge' ? JOURNAL_PATH : null;
  setScn('folders');
  if (p) selectPath(p, true);
}
/** Ctrl+Alt+← / →: copies the current stream change at once. */
function streamCopyKey(dir) {
  const el = document.querySelector(`.stream [data-h="${S.cur}"]`), m = /^f\d+h(\d+)$/.exec(String(S.cur));
  if (!el || !m) { toast('Pick a change first: J goes to the next one'); render(); return; }
  const p = el.closest('.card').dataset.card, h = diffModel(blocksOf(p)).hunks[+m[1]];
  if (h && h.kind !== 'done') streamCopy(p, h.bi, dir);
}

/* ---------- plan sheets for bulk writes ---------- */
/** Short one-line preview of a block for the plan list. */
function blockPreview(b) {
  const l = (b.l || [])[0], r = (b.r || [])[0];
  const cut = (s) => (s === undefined ? '' : s.trim().length > 46 ? s.trim().slice(0, 45) + '…' : s.trim());
  return l !== undefined && r !== undefined ? `${cut(l)} → ${cut(r)}` : r !== undefined ? `+ ${cut(r)}` : `− ${cut(l)}`;
}
/** Copy all matches: one plan with every matching change ticked, direction left by default. */
function openCopyPlan(dir) {
  const items = pendingMatches().map(({ path, bi }) => {
    const hk = diffModel(blocksOf(path)).hunks.find((h) => h.bi === bi);
    return { path, bi, on: true, label: `Change ${hk.h + 1} · L${hk.l1} → R${hk.r1}`, prev: blockPreview(blocksOf(path)[bi]) };
  });
  if (!items.length) { toast('Nothing left to copy'); render(); return; }
  S.plan = { kind: 'copy', dir: dir || 'L', items };
  S.enter.add('plan');
  render();
  requestAnimationFrame(() => document.querySelector('.sheet [data-act="plan-go"]')?.focus());
}
/** Sync: every difference under the selected folder (or the whole compare) as one plan; your own new files stay unticked. */
function openSyncPlan() {
  const root = S.scn === 'stream' ? (S.streamRoot ? byPath(S.streamRoot) : null) : (() => { const n = byPath(S.sel); return n && n.dir ? n : null; })();
  const files = allFiles(root ? root.kids : TREE);
  const items = [];
  for (const n of files) {
    const st = statusOf(n);
    if (st === 'diff') items.push({ path: n.path, op: 'copy', on: true });
    else if (st === 'ro' || st === 'lo') items.push({ path: n.path, op: st, on: !(st === 'lo' && n.origin === 'L'), note: n.origin === 'L' && st === 'lo' ? 'your own new file' : n.why || '' });
    else if (st === 'hash') items.push({ path: n.path, op: 'wait', on: false, note: 'still checking; skipped' });
  }
  if (!items.length) { toast('Both sides already match here'); render(); return; }
  S.plan = { kind: 'sync', dir: 'L', items, scope: root ? root.path : '' };
  S.enter.add('plan');
  render();
  requestAnimationFrame(() => document.querySelector('.sheet [data-act="plan-go"]')?.focus());
}
/** What one sync item does for the chosen direction, in words. */
function syncWord(it, dir) {
  if (it.op === 'wait') return 'Skip';
  if (it.op === 'copy') return dir === 'L' ? 'Copy ←' : 'Copy →';
  const onTarget = (it.op === 'lo' && dir === 'L') || (it.op === 'ro' && dir === 'R');
  return onTarget ? 'Delete' : dir === 'L' ? 'Add ←' : 'Add →';
}
/** The plan sheet: what will change, where, and how to undo it; nothing is written before Apply. */
function planHTML() {
  const P = S.plan;
  if (!P) return '';
  const on = P.items.filter((x) => x.on);
  const dirSeg = `<div class="seg" role="group" aria-label="Direction"><button data-act="plan-dir" data-v="L" aria-pressed="${P.dir === 'L'}">${ic('al', 'sm')}To the left · ${esc(R2.L.name)}</button><button data-act="plan-dir" data-v="R" aria-pressed="${P.dir === 'R'}">To the right · ${esc(R2.R.name)}${ic('ar', 'sm')}</button></div>`;
  const tick = (it, i, inner) => `<button class="pl-i${P.kind === 'sync' ? ' sy' : ''}${it.on ? '' : ' off'}" data-act="plan-tog" data-v="${i}" aria-pressed="${it.on}" ${it.op === 'wait' ? 'disabled' : ''}><span class="ck" aria-hidden="true">${it.on ? ic('check', 'sm') : ''}</span>${inner}</button>`;
  let list = '', title, sub, files;
  const target = P.dir === 'L' ? R2.L : R2.R;
  if (P.kind === 'copy') {
    let last = null;
    P.items.forEach((it, i) => {
      if (it.path !== last) { const n = byPath(it.path); list += `<div class="pl-f">${sg(statusOf(n))}<span class="mono">${esc(it.path)}</span></div>`; last = it.path; }
      list += tick(it, i, `<span class="pl-l num">${esc(it.label)}</span><span class="pl-p mono">${esc(it.prev)}</span>`);
    });
    files = new Set(on.map((x) => x.path)).size;
    title = `Copy ${on.length} matching change${on.length === 1 ? '' : 's'}`;
    sub = `Matches for “${esc(S.q.trim())}”. The copied lines go into ${files} file${files === 1 ? '' : 's'} in ${esc(target.name)}; Ctrl+S writes them.`;
  } else {
    P.items.forEach((it, i) => {
      const n = byPath(it.path), w = syncWord(it, P.dir);
      list += tick(it, i, `<span class="pl-op${w === 'Delete' ? ' del' : ''}">${w}</span>${sg(statusOf(n))}<span class="pl-p mono">${esc(it.path)}</span>${it.note ? `<span class="mu pl-n">${esc(it.note)}</span>` : ''}`);
    });
    const dels = on.filter((x) => syncWord(x, P.dir) === 'Delete').length;
    files = on.length;
    title = `Sync ${on.length} file${on.length === 1 ? '' : 's'}`;
    sub = `Makes ${esc(target.name)} match the other side${P.scope ? ` under <span class="mono">${esc(P.scope)}</span>` : ''}.${dels ? ` ${dels} file${dels > 1 ? 's go' : ' goes'} to the Recycle Bin.` : ''}`;
  }
  return `<div class="scrim${S.enter.has('plan') ? ' enter' : ''}" data-act="plan-x"></div><div class="sheet${S.enter.has('plan') ? ' enter' : ''}" role="dialog" aria-modal="true" aria-labelledby="plan-t">
    <div class="sh-h"><h2 id="plan-t">${title}</h2><button class="ib" data-act="plan-x" aria-label="Cancel">${ic('x', 'sm')}</button></div>
    <p class="sh-sub">${sub}</p>${dirSeg}
    <div class="pl">${list}</div>
    <div class="sh-f"><span class="mu">${ic('undo', 'sm')} One Ctrl+Z undoes the whole job</span><span class="grow"></span><button class="btn" data-act="plan-x">Cancel ${kb('Esc')}</button><button class="btn pri" data-act="plan-go" ${on.length ? '' : 'disabled'}>${P.kind === 'copy' ? 'Copy' : 'Sync'} ${on.length} ${kb('Ctrl+Enter')}</button></div>
  </div>`;
}
/** Runs the plan as one job with one undo entry. */
function applyPlan() {
  const P = S.plan;
  if (!P) return;
  const on = P.items.filter((x) => x.on && x.op !== 'wait');
  if (!on.length) return;
  S.plan = null;
  if (P.kind === 'copy') {
    const snaps = {};
    for (const it of on) {
      const bl = S.fb[it.path], b = bl[it.bi];
      snaps[it.path] ??= clone(bl);
      const src = P.dir === 'L' ? (b.r || []) : (b.l || []);
      bl[it.bi] = { t: 'done', l: src.slice(), r: src.slice(), dir: P.dir };
    }
    S.undo.push({ type: 'bulk', snaps, dirty: { ...S.dirty } });
    S.dirty[P.dir] = true;
    const nf = Object.keys(snaps).length;
    toast(`Copied ${on.length} change${on.length > 1 ? 's' : ''} in ${nf} file${nf > 1 ? 's' : ''} to the ${P.dir === 'L' ? 'left' : 'right'} · Ctrl+S saves`, true);
  } else {
    const snaps = [], removed = [];
    for (const it of on) {
      const n = byPath(it.path), w = syncWord(it, P.dir);
      if (!n) continue;
      snaps.push({ n, s: n.s, L: n.L, R: n.R });
      if (w === 'Delete') {
        const kids = n.parentPath ? byPath(n.parentPath).kids : TREE, idx = kids.indexOf(n);
        removed.push({ kids, idx, n }); kids.splice(idx, 1);
      } else { const other = P.dir === 'L' ? 'R' : 'L'; n[P.dir] = n[other]; n.s = 'same'; }
    }
    S.undo.push({ type: 'sync', snaps, removed });
    const dels = removed.length;
    toast(`Synced ${on.length} file${on.length > 1 ? 's' : ''} in ${esc((P.dir === 'L' ? R2.L : R2.R).name)}${dels ? ` · ${dels} in the Recycle Bin` : ''}`, true);
  }
  render();
}
/** Undo for the two bulk jobs; returns true when it handled the entry. */
function undoBulk(u) {
  if (u.type === 'bulk') {
    for (const [p, snap] of Object.entries(u.snaps)) S.fb[p].splice(0, Infinity, ...snap);
    S.dirty = u.dirty;
    toast(`Undid the whole copy (${Object.keys(u.snaps).length} file${Object.keys(u.snaps).length > 1 ? 's' : ''})`);
    return true;
  }
  if (u.type === 'sync') {
    for (const r of u.removed.reverse()) r.kids.splice(r.idx, 0, r.n);
    for (const s of u.snaps) Object.assign(s.n, { s: s.s, L: s.L, R: s.R });
    toast(`Undid the sync (${u.snaps.length} file${u.snaps.length > 1 ? 's' : ''})`);
    return true;
  }
  return false;
}

/* ---------- drawers for the stream ---------- */

  }
  const v = files.filter(isViewed).length;

}
/** Ctrl+I in the stream: details of the current card, plus the rule-hidden files. */
function streamInspector() {
  const n = byPath(curCardPath() || '') || streamFiles()[0];

  const det = n ? `<h3>Current file</h3><dl class="kv"><dt>Path</dt><dd class="mono">${esc(n.path)}</dd><dt>Status</dt><dd>${STATUS_WORD[statusOf(n)]}</dd><dt>Left</dt><dd>${n.L ? `${esc(n.L.size)} · ${esc(n.L.date)}` : '—'}</dd><dt>Right</dt><dd>${n.R ? `${esc(n.R.size)} · ${esc(n.R.date)}` : '—'}</dd><dt>Changes</dt><dd>${isText(n) ? `${openHunks(n)} open · ${fmtDelta(deltaOf(blocksOf(n.path)))}` : 'not text'}</dd><dt>Viewed</dt><dd>${isViewed(n) ? 'yes, for this content' : 'no'}</dd></dl>` : '';
  return `${det}<h3>Hidden by rules</h3>${rules.map((f) => `<div class="kv1"><span class="mono">${esc(f.path)}</span><span class="mu">${esc(f.rule)}</span></div>`).join('') || '<p class="mu">None</p>'}<h3>Viewed marks</h3><p class="mu" style="margin:0">Stored per file content. A file that changes on either side shows as not viewed again.</p>`;
}

/* ---------- About ---------- */
/** The About sheet: what this prototype is, the keys, and what comes later. */

    <table class="ktab">${row('Alt+F', 'Stream of all differences under the selected folder')}${row('Enter', 'Open the file (folders) or the card (stream) in the full diff')}${row('Esc', 'Back: full diff → same stream card → folders')}${row('J K', 'Next / previous change across all files')}${row('Shift+J Shift+K', 'Next / previous file')}${row('V', 'Viewed (kept per content, survives a refresh)')}${row('/', 'Search all differences; narrows the stream')}${row('← →', 'Collapse / expand the current card')}${row('Ctrl+Alt+← Ctrl+Alt+→', 'Copy one change now (undo with Ctrl+Z)')}${row('Ctrl+Alt+Shift+←', 'Copy all matches: shows a plan first')}${row('Alt+S', 'Sync: shows a plan first')}${row('Ctrl+B Ctrl+I Alt+V', 'Outline / Details / View menu')}${row('Ctrl+Z', 'Undo; a bulk job undoes as one')}</table>

/** Typing in the stream search narrows the cards at once; the caret stays in the field. */
stage.addEventListener('input', (e) => {
  if (e.target.id !== 'sq') return;
  S.q = e.target.value; S.cur = -1; S.focusQ = true;
  render();
  const sc = document.getElementById('sc');
  if (sc) sc.scrollTop = 0;
});

/* timers: background hashing and progressive large diff */
let timers = [];
function startTimers() {
  timers.forEach(clearInterval); timers = [];
  if (S.scn === 'folders' || S.scn === 'stream') {
    timers.push(setInterval(() => {
      let flip = false;
      for (const p of Object.keys(S.hashP)) {
        if (S.hashP[p] >= 1) continue;
        S.hashP[p] = Math.min(1, S.hashP[p] + (p.endsWith('.hex') ? 0.06 : 0.03));
        if (S.hashP[p] >= 1) flip = true;
      }
      if (flip) { render(); return; }
      document.querySelectorAll('.fr').forEach((r) => {
        const p = S.hashP[r.dataset.p];
        const hp = r.querySelector('.hp');
        if (p !== undefined && hp) { hp.querySelector('i').style.setProperty('--p', p); hp.lastChild.textContent = Math.round(p * 100) + '%'; }
      });
      document.querySelectorAll('[data-hashp]').forEach((h) => { const p = S.hashP[h.dataset.hashp]; if (p === undefined) return; h.querySelector('i').style.setProperty('--p', p); h.querySelector('.pct').textContent = Math.round(p * 100) + '%'; });
      if (Object.values(S.hashP).every((v) => v >= 1)) timers.forEach(clearInterval);
    }, 600));
  }
  if (S.scn === 'large' && S.largeTab === 'text' && S.prog < 1) {
    timers.push(setInterval(() => {
      S.prog = Math.min(1, +(S.prog + 0.04).toFixed(3));
      const sc = document.getElementById('sc');
      if (!sc || !S.largeRows) return;
      if (S.prog >= 1) { render(); timers.forEach(clearInterval); return; }
      const t = sc.scrollTop; sc.innerHTML = S.largeRows(); sc.scrollTop = t;
      document.querySelectorAll('.map').forEach((m) => { const pe = m.querySelector('.map-pend'); if (pe) pe.style.transform = `scale${m.classList.contains('h') ? 'X' : 'Y'}(${1 - S.prog})`; buildMap(m); });
      document.querySelectorAll('.prog i').forEach((i) => i.style.setProperty('--p', S.prog));
      document.querySelectorAll('[data-progline]').forEach((e) => { e.innerHTML = progressLine(); });
      const fl = document.querySelector('[data-found]');
      if (fl) { const found = [...TRACE_DIFF.keys()].filter((i) => i < TRACE.length * S.prog && TRACE_DIFF.get(i - 1) !== TRACE_DIFF.get(i)); fl.innerHTML = found.map((i) => `<button data-act="goto" data-v="${i}"><span class="sg diff">~</span><span class="nt"><span class="t num">line ${(1204880 + i).toLocaleString('en')}</span></span></button>`).join(''); }
    }, 500));
  }
}

/* actions */
function openRow(p) {
  const n = byPath(p);
  if (!n) return;
  S.from = 'folders';
  if (n.dir) { S.open.has(p) ? S.open.delete(p) : (S.open.add(p), n.kids.forEach((k) => S.enter.add(k.path))); render(); return; }
  const s = statusOf(n);
  if (s === 'lo' || s === 'ro') { toast(`${esc(n.name)} exists only on the ${s === 'lo' ? 'left' : 'right'}. F3 views it.`); render(); return; }
  if (n.open === 'merge') return setScn('merge');
  if (n.open === 'hex') { S.largeTab = 'hex'; return setScn('large'); }
  if (n.open === 'large') { S.largeTab = 'text'; return setScn('large'); }
  if (n.open === 'image') { toast(`${esc(n.name)}: images open side by side in the image viewer (not in this prototype)`); render(); return; }
  if (s === 'same') { toast(`${esc(n.name)} is the same on both sides`); render(); return; }
  if (!S.fb[p]) { toast(`${esc(n.name)} has no text view in this prototype`); render(); return; }
  openFile(p, 'folders');
}
function undo() {
  const u = S.undo.pop();
  if (!u) { toast('Nothing to undo'); render(); return; }
  if (undoBulk(u)) { render(); return; }
  if (u.type === 'copy') { S.fb[u.path][u.bi] = u.prev; S.dirty = u.dirty; toast('Copy undone'); }
  if (u.type === 'blocks') { S.fb[u.path] = u.blocks; if (u.path === S.filePath) S.blocks = u.blocks; S.dirty = u.dirty; toast('Line copy undone'); }
  if (u.type === 'pick') { S.regions[u.ri].pick = u.prev; S.regions[u.ri].edited = u.edited; toast('Choice undone'); }
  if (u.type === 'save') { toast(`Restored the previous version of ${esc(pathBase(S.filePath))}`); }
  if (u.type === 'row') { toast(`Restored ${esc(u.name)} on the left`); }
  render();
}
function pick(ri, v) {
  const r = S.regions[ri];
  if (!r || r.t !== 'conf') return;
  S.undo.push({ type: 'pick', ri, prev: r.pick, edited: r.edited });
  r.pick = v;
  if (v === 'E') r.edited = r.edited || r.left.slice();
  if (v && v !== 'E') { const confs = S.regions.filter((x) => x.t === 'conf'); const next = confs.findIndex((x) => !x.pick); if (next >= 0) S.cur = next; }
  const u = unsolved();
  toast(u ? `${u} unsolved · Alt+↓ goes to the next conflict` : 'All conflicts solved · Ctrl+S saves', true);
  render();
}
function curConflictIndex() {
  const confs = S.regions.map((r, i) => [r, i]).filter(([r]) => r.t === 'conf');
  const c = confs[S.cur] || confs.find(([r]) => !r.pick) || confs[0];
  return c ? c[1] : -1;
}
function save() {
  if (S.scn === 'merge') {
    const u = unsolved();
    if (u) { toast(`Save is locked: ${u} unsolved conflict${u > 1 ? 's' : ''}. Alt+↓ goes to the next one.`); render(); return; }
    toast('Saved journal.rs in navo. The old version is kept until Navo closes', false, `<button class="btn" data-act="noop">${ic('copy', 'sm')}Copy</button>`);
    render(); return;
  }
  if (S.scn === 'file' || S.scn === 'stream') {
    if (!S.dirty.L && !S.dirty.R) { toast('Nothing to save'); render(); return; }
    const which = [S.dirty.L && 'navo', S.dirty.R && 'navo-0.4.1'].filter(Boolean).join(' and ');
    S.dirty = { L: false, R: false };
    S.undo.push({ type: 'save' });
    toast(`Saved ${S.scn === 'stream' ? 'the changed files' : esc(pathBase(S.filePath))} in ${which}. The old version is kept until Navo closes.`, false, `<button class="btn" data-act="undo">${ic('undo', 'sm')}Restore previous version</button>`);
    render();
  }
}
function copyKey(dir) {
  if (S.scn === 'stream') return streamCopyKey(dir);
  if (S.scn === 'file') {
    if (S.lsel) { copySelected(dir, false); render(); return; }
    const { hunks } = diffModel();
    const h = hunks.find((x) => x.h === S.cur) || hunks.find((x) => x.kind !== 'done');
    if (h) { copyBlock(h.bi, dir); render(); }
    return;
  }
  if (S.scn === 'merge') { const ri = curConflictIndex(); if (ri >= 0) pick(ri, dir); return; }
  if (S.scn === 'folders') {
    const n = byPath(S.sel);
    if (!n || n.dir) return;
    if (!n[dir === 'L' ? 'R' : 'L']) { toast(`${esc(n.name)} has no ${dir === 'L' ? 'right' : 'left'} side to copy`); render(); return; }
    S.undo.push({ type: 'row', name: n.name });
    toast(`Copied ${esc(n.name)} to the ${dir === 'L' ? 'left' : 'right'}`, true);
    render();
  }
}

stage.addEventListener('contextmenu', (e) => {

  const row = e.target.closest('.r');

  const el = e.target.closest('[data-side]') || row.querySelector('[data-side]');
  const lnEl = e.target.closest('.ln[data-act="lsel"]') || (el && row.querySelector(`.ln[data-act="lsel"][data-side="${el.dataset.side}"]`));
  const side = (lnEl || el)?.dataset.side || 'L';
  S.cmenu = { x: e.clientX, y: e.clientY, side, bi: lnEl ? +lnEl.dataset.b : el ? +el.dataset.b : undefined, ix: lnEl ? +lnEl.dataset.i : undefined, changed: !!row.dataset.k && row.dataset.k !== 'done' };
  render();
});
stage.addEventListener('click', (e) => {

    case 'plan-tog': { const it = S.plan.items[+v]; if (it && it.op !== 'wait') it.on = !it.on; render(); document.querySelector(`.pl-i[data-v="${v}"]`)?.focus(); break; }
    case 'plan-go': applyPlan(); break;
    case 'plan-x': S.plan = null; render(); break;
    case 'about': S.about = !S.about; if (S.about) S.enter.add('about'); render(); break;
    case 'cm': runCmenu(v); break;
    case 'lsel': toggleLine(+a.dataset.b, +a.dataset.i, a.dataset.side, e.shiftKey); render(); break;
    case 'copy-sel': copySelected(v, false); render(); break;
    case 'remove-sel': copySelected(null, true); render(); break;
    case 'clear-sel': S.lsel = null; S.lastSel = null; render(); break;
    case 'twist': openRow(a.dataset.p); break;
    case 'expand': S.expanded.has(a.dataset.p) ? S.expanded.delete(a.dataset.p) : S.expanded.add(a.dataset.p); render(); break;
    case 'open': openRow(a.dataset.p); break;
    case 'filter': S.filter = v; render(); break;
    case 'scope': S.navFolder = v || null; if (v) { v.split('/').forEach((_, i, arr) => S.open.add(arr.slice(0, i + 1).join('/'))); } render(); break;
    case 'nav-folder': S.drawer = null; S.navFolder = S.dir === 1 ? v : null; selectPath(v, true); break;
    case 'side-n': S.side = v; render(); break;
    case 'side': S.menu = null; toast(v === 'right' ? 'Pick a folder, another repository, or a branch, tag or commit (Ctrl+K "Compare branches")' : 'Pick a folder or another repository'); render(); break;
    case 'swap': toast('Swapped sides'); render(); break;
    case 'exit': toast('Left compare mode. The panes keep their folders.'); render(); break;
    case 'nav': nav(+v); break;
    case 'goto': S.drawer = null; if (S.scn === 'large') { S.cur = +v; render(); goHunk(+v, true); } else { render(); goHunk(+v, true); } break;
    case 'copy': copyBlock(+a.dataset.b, v); render(); break;
    case 'undo': S.toast = null; undo(); break;
    case 'toast-x': S.toast = null; render(); break;
    case 'save': save(); break;
    case 'layout': S.layout = v; S.preset = 'custom'; S.menu = null; render(); break;
    case 'toggle': flip(v); render(); break;
    case 'preset': S.preset = v; if (v === 'simple') Object.assign(S, { intra: false, moved: false, hide: false, layout: 'inline' }); if (v === 'rich') Object.assign(S, { intra: true, moved: true, hide: false, layout: 'split' }); render(); break;
    case 'keep-default': S.menu = null; toast('Saved as the default in navo.toml under [compare.view]'); render(); break;
    case 'menu': S.menu = S.menu ? null : v; if (S.menu) S.enter.add('menu'); render(); break;
    case 'drawer': S.drawer = S.drawer === v ? null : v; if (S.drawer) S.enter.add('drawer'); render(); break;
    case 'pick': pick(+a.dataset.r, v); break;

    case 'edit': pick(+a.dataset.r, 'E'); requestAnimationFrame(() => { const card = document.querySelectorAll('.cf')[confIndex(S.regions[+a.dataset.r])]; card?.querySelectorAll('.code .tx').forEach((t) => { t.contentEditable = 'true'; }); card?.querySelector('.code .tx')?.focus(); }); break;
    case 'solve-ws': S.regions.forEach((r, ri) => { if (r.t === 'conf' && r.ws && !r.pick) { S.undo.push({ type: 'pick', ri, prev: null }); r.pick = 'L'; } }); toast(`Solved the whitespace-only conflict · ${unsolved()} unsolved`, true); render(); break;
    case 'region': stepRegion(+v); break;
    case 'region-go': S.region = +v; render(); break;
    case 'ltab': S.largeTab = v; render(); startTimers(); break;
    case 'theme': root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; harness(); render(); break;
    case 'unfold': S.hide = false; S.preset = 'custom'; render(); break;
    case 'rule': S[v] = a.checked; render(); break;
    case 'toggle-cb': S[v] = a.checked; render(); break;
    default: break;
  }
});

document.addEventListener('keydown', (e) => {
  const k = e.key, alt = e.altKey, ctrl = e.ctrlKey || e.metaKey, shift = e.shiftKey;
  const hit = (fn) => { e.preventDefault(); e.stopImmediatePropagation(); fn(); };
  if (S.plan) {

    if (k === 'Enter' && (ctrl || !e.target.closest('button'))) return hit(applyPlan);
    if (alt && (k === 'ArrowLeft' || k === 'ArrowRight')) return hit(() => { S.plan.dir = k === 'ArrowLeft' ? 'L' : 'R'; render(); document.querySelector('.sheet [data-act="plan-go"]')?.focus(); });
    if (ctrl && (k === 'z' || k === 'Z')) return hit(() => {});
    return;
  }
  if (S.about) { if (k === 'Escape' || k === '?') return hit(() => { S.about = false; render(); }); return; }
  if (e.target.id === 'sq') {
    if (k === 'Escape') return hit(() => { if (S.q) { S.q = ''; S.cur = -1; S.focusQ = true; render(); } else e.target.blur(); });
    if (k === 'Enter' || k === 'ArrowDown') return hit(() => { e.target.blur(); document.getElementById('sc')?.focus({ preventScroll: true }); nav(1); });
    return;
  }
  if (e.target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) { if (e.key === 'Escape') e.target.blur(); return; }
  if (S.scn === 'stream' && ctrl && alt && shift && (k === 'ArrowLeft' || k === 'ArrowRight')) return hit(() => (ql() ? openCopyPlan(k === 'ArrowLeft' ? 'L' : 'R') : (toast('Search first (/): copy all matches works on the search results'), render())));
  if (alt && !ctrl && (k === 'f' || k === 'F') && (S.scn === 'folders' || S.scn === 'stream')) return hit(() => (S.scn === 'stream' ? goBack() : openStream()));
  if (alt && !ctrl && (k === 's' || k === 'S') && (S.scn === 'folders' || S.scn === 'stream')) return hit(openSyncPlan);
  if (alt && !ctrl && (k === 'ArrowDown' || k === 'ArrowUp')) return hit(() => nav(k === 'ArrowDown' ? 1 : -1));
  if (k === 'F7' && S.scn !== 'folders') return hit(() => nav(shift ? -1 : 1));
  if (ctrl && alt && (k === 'ArrowLeft' || k === 'ArrowRight')) return hit(() => copyKey(k === 'ArrowLeft' ? 'L' : 'R'));
  if (ctrl && shift && k === 'Delete' && S.scn === 'file' && S.lsel) return hit(() => { copySelected(null, true); render(); });
  if (shift && !ctrl && !alt && (k === 'ArrowDown' || k === 'ArrowUp') && S.scn === 'file') return hit(() => {
    const side = S.lsel ? S.lsel.side : 'R', rows = selectableRows(side);
    if (!rows.length) return;
    const keysAll = rows.map(selKey), at = S.lastSel ? keysAll.indexOf(S.lastSel.key) : -1;
    const next = rows[at < 0 ? 0 : Math.max(0, Math.min(rows.length - 1, at + (k === 'ArrowDown' ? 1 : -1)))];
    if (!S.lsel || S.lsel.side !== side) S.lsel = { side, keys: new Set() };
    S.lsel.keys.add(selKey(next)); S.lastSel = { side, key: selKey(next) };
    render();
  });
  if (k === 'Escape' && S.cmenu) return hit(() => { S.cmenu = null; render(); });
  if (k === 'Escape' && S.lsel) return hit(() => { S.lsel = null; S.lastSel = null; render(); });
  if (ctrl && !alt && (k === 'z' || k === 'Z')) return hit(undo);
  if (ctrl && !alt && (k === 's' || k === 'S')) return hit(save);
  if (ctrl && !alt && (k === 'b' || k === 'B')) return hit(() => { S.drawer = S.drawer === 'L' ? null : 'L'; S.enter.add('drawer'); render(); });
  if (ctrl && !alt && (k === 'i' || k === 'I')) return hit(() => { S.drawer = S.drawer === 'R' ? null : 'R'; S.enter.add('drawer'); render(); });
  if (alt && !ctrl && (k === 'v' || k === 'V')) return hit(() => { S.menu = S.menu ? null : 'view'; S.enter.add('menu'); render(); });
  if (alt && !ctrl && ['1', '2', '3'].includes(k)) {
    if (S.scn === 'merge') return hit(() => { const ri = curConflictIndex(); if (ri >= 0) pick(ri, { 1: 'L', 2: 'R', 3: 'LR' }[k]); });
    if ((S.scn === 'file' || S.scn === 'stream') && k !== '3') return hit(() => { S.layout = k === '1' ? 'split' : 'inline'; render(); });
  }
  if (alt && !ctrl) { const t = { h: 'hide', i: 'intra', m: 'moved', w: 'ignWs', l: 'lineNo' }[k.toLowerCase()]; if (t) return hit(() => { flip(t); render(); }); }
  if (k === 'Escape') return hit(() => {
    if (S.menu) S.menu = null; else if (S.drawer) S.drawer = null; else if (S.toast) S.toast = null;
    else if (S.scn === 'large' && S.largeTab === 'text' && S.prog < 1) { S.prog = 1; timers.forEach(clearInterval); toast('Stopped. Differences found so far stay listed.'); }
    else if (S.scn === 'stream' && S.q) { S.q = ''; S.cur = -1; }

    if (k === 'J' || k === 'K') return hit(() => stepCard(k === 'J' ? 1 : -1));
    if (k === 'v' || k === 'V') return hit(() => toggleViewed());
    if (k === '/') return hit(() => document.getElementById('sq')?.focus());
    if (k === 'Enter') return hit(() => openCard());
    if (k === 'ArrowLeft' || k === 'ArrowRight') return hit(() => collapseCard(curCardPath(), k === 'ArrowLeft'));
  }
  if (S.scn === 'stream' && k === '/') return hit(() => document.getElementById('sq')?.focus());
  if (k === '?') return hit(() => { S.about = true; S.enter.add('about'); render(); });
  if (/^[1-5]$/.test(k)) return hit(() => setScn(SCN[+k - 1][0]));
  const row = e.target.closest?.('.fr');
  if (row && (k === 'ArrowDown' || k === 'ArrowUp')) {
    return hit(() => { const rows = [...row.parentElement.querySelectorAll('.fr')]; const n = rows[rows.indexOf(row) + (k === 'ArrowDown' ? 1 : -1)]; if (n) { S.sel = n.dataset.p; rows.forEach((r) => { r.setAttribute('aria-selected', r === n); r.tabIndex = r === n ? 0 : -1; }); n.focus(); } });
  }
  if (row && k === 'Enter') return hit(() => openRow(row.dataset.p));
  if (row && k === ' ' && S.dir === 2) return hit(() => { const p = row.dataset.p; S.expanded.has(p) ? S.expanded.delete(p) : S.expanded.add(p); render(); });
  if (row && (k === 'ArrowRight' || k === 'ArrowLeft')) {
    const n = byPath(row.dataset.p);
    if (n && n.dir) return hit(() => { if (k === 'ArrowRight') { S.open.add(n.path); n.kids.forEach((c) => S.enter.add(c.path)); } else S.open.delete(n.path); render(); });
  }
  const sc = SCN.find(([, , key]) => key.toLowerCase() === k.toLowerCase());
  if (sc) return hit(() => setScn(sc[0]));
  if (k === 't' || k === 'T') return hit(() => { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; harness(); render(); });
}, true);

let lastNarrow = null;
addEventListener('resize', () => {
  const n = stage.clientWidth < 721;
  if (n !== lastNarrow) { lastNarrow = n; render(); } else document.querySelectorAll('.map').forEach(buildMap);
});

/* mount: one design, scenarios from the bar above */
S = freshState(3, new URLSearchParams(location.search).get('s') || 'folders');
S.expanded.clear();
requestAnimationFrame(() => { harness(); lastNarrow = stage.clientWidth < 721; render(false); startTimers(); if (S.scn === 'stream') { const f = streamFiles()[0]; if (f) goCard(f.path); } });
</script>
</body>
