<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navo Git at a glance</title>
<style>
:root {
  color-scheme: light;
  /* Navo tokens, OpenSea light (navo-ui tokens/palette/light.rs, Colors mapping in palette/mod.rs) */
  --rail: oklch(95.5% 0.012 225);
  --bg: oklch(98.5% 0.008 225);
  --surface: oklch(99.8% 0 225);
  --line: oklch(89% 0.014 225);
  --line-strong: oklch(64.8% 0.017 225);
  --text: oklch(22% 0.014 225);
  --muted: oklch(48.8% 0.017 225);
  --selection: oklch(90% 0.046 218);
  --accent: oklch(52% 0.092 218);
  --accent-text: oklch(48.8% 0.086 218);
  --mark: oklch(48.8% 0.144 22);
  --folder: oklch(49.6% 0.102 80);
  --ok: oklch(48% 0.108 160);
  --kind-code: oklch(49.6% 0.12 262);
  --kind-auto: oklch(49.6% 0.12 120);
  --kind-archive: oklch(49.6% 0.12 45);
  --kind-doc: oklch(49.6% 0.12 235);
  --on-accent: var(--bg);
  --shadow-menu: 0 18px 44px -12px oklch(21% 0.012 260 / 0.28), 0 2px 6px oklch(21% 0.012 260 / 0.06);
  --shadow-tip: 0 8px 24px oklch(20% 0.02 250 / 0.18);
  /* Git state colours: MarkColors ticks and fills (tokens/marks.rs): red 25, orange 55, blue 240 */
  --st-conflict: oklch(56% 0.2 25);
  --st-mod: oklch(56% 0.138 55);
  --st-sync: oklch(56% 0.128 240);
  --st-conflict-t: oklch(48.8% 0.2 25);
  --st-mod-t: oklch(48.8% 0.138 55);
  --st-sync-t: oklch(48.8% 0.128 240);
  --fill-conflict: oklch(89% 0.056 25);
  --fill-mod: oklch(89% 0.056 55);
  --fill-sync: oklch(89% 0.056 240);
  --on-conflict: oklch(40% 0.15 25);
  --on-mod: oklch(40% 0.1 55);
  --on-sync: oklch(40% 0.12 240);
  --solid-conflict-text: var(--bg);

  --hover: color-mix(in oklch, var(--bg) 50%, var(--selection));
  --zebra: color-mix(in oklch, var(--bg) 50%, var(--rail));
  --card-ring: color-mix(in oklch, var(--accent) 80%, var(--bg));

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s6: 24px; --s8: 32px; --s12: 48px;
  --r-xs: 3px; --r-sm: 4px; --r-md: 6px; --r-card: 8px; --r-menu: 10px; --r-sheet: 12px; --r-full: 999px;
  --row: 24px; --icon: 15px; --ring: 2px; --mk: 20px; --gut: 20px;
  --fs-12: 0.75rem; --fs-13: 0.8125rem; --fs-14: 0.875rem; --fs-16: 1rem; --fs-24: 1.5rem;
  --ui: "Inter", "Inter Variable", system-ui, sans-serif;
  --display: "Space Grotesk", "Inter", "Inter Variable", sans-serif;
  --mono: "JetBrains Mono", "JetBrainsMono Nerd Font Mono", ui-monospace, monospace;
  --fade: 80ms;
  --z-menu: 20; --z-tip: 40;
  --win-h: 600px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --rail: oklch(19% 0.014 225);
  --bg: oklch(22.5% 0.014 225);
  --surface: oklch(26.5% 0.014 225);
  --line: oklch(33% 0.014 225);
  --line-strong: oklch(54.8% 0.017 225);
  --text: oklch(93.8% 0.014 225);
  --muted: oklch(72% 0.017 225);
  --selection: oklch(33% 0.058 218);
  --accent: oklch(76% 0.11 218);
  --accent-text: oklch(76% 0.11 218);
  --mark: oklch(76% 0.166 22);
  --folder: oklch(82% 0.13 80);
  --ok: oklch(85% 0.13 160);
  --kind-code: oklch(76% 0.12 262);
  --kind-auto: oklch(76% 0.12 120);
  --kind-archive: oklch(76% 0.12 45);
  --kind-doc: oklch(76% 0.12 235);
  --shadow-menu: 0 22px 48px -12px oklch(0% 0 0 / 0.7), 0 0 0 1px oklch(93% 0.006 260 / 0.04);
  --shadow-tip: 0 8px 24px oklch(0% 0 0 / 0.5);
  --st-conflict: oklch(72% 0.15 25);
  --st-mod: oklch(72% 0.15 55);
  --st-sync: oklch(72% 0.15 240);
  --st-conflict-t: oklch(72% 0.15 25);
  --st-mod-t: oklch(72% 0.15 55);
  --st-sync-t: oklch(72% 0.15 240);
  --fill-conflict: oklch(38% 0.124 25);
  --fill-mod: oklch(38% 0.094 55);
  --fill-sync: oklch(38% 0.086 240);
  --on-conflict: oklch(90% 0.08 25);
  --on-mod: oklch(90% 0.08 55);
  --on-sync: oklch(90% 0.08 240);
  --solid-conflict-text: var(--bg);
}

* { box-sizing: border-box; }
html { background: var(--rail); }
body { margin: 0; font-family: var(--ui); font-size: var(--fs-14); line-height: 1.5; color: var(--text); background: var(--rail); }
button { font: inherit; color: inherit; }
:focus-visible { outline: var(--ring) solid var(--accent); outline-offset: 2px; }
.mono, kbd { font-family: var(--mono); font-variant-ligatures: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.page { max-width: 1440px; margin-inline: auto; padding: var(--s4) var(--s6) var(--s12); display: grid; gap: var(--s4); }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3) var(--s6); }
.top h1 { font-family: var(--display); font-size: var(--fs-24); line-height: 1.2; margin: 0; font-weight: 600; margin-inline-end: auto; }
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s4); }
.ctl .lb { color: var(--muted); font-size: var(--fs-12); margin-inline-end: var(--s1); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--bg); padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: var(--s1) var(--s3); border-radius: var(--r-sm); cursor: pointer; font-size: var(--fs-13); min-height: 32px; min-width: 32px; display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); }
.seg button:hover { background: var(--hover); }
.seg button[aria-pressed="true"] { background: var(--selection); font-weight: 600; }
.picker button { min-width: 44px; font-weight: 600; }
.hint { color: var(--muted); font-size: var(--fs-12); margin: 0; }

.dir-head { display: grid; gap: var(--s1); }
.dir-head h2 { font-family: var(--display); font-size: var(--fs-24); line-height: 1.2; margin: 0; font-weight: 600; }
.dir-head p { margin: 0; max-width: 100ch; }
.dir-head .m { font-size: var(--fs-16); }
.dir-head .t, .dir-head .c, .dir-head .f { color: var(--muted); font-size: var(--fs-13); }
.dir-head b { color: var(--text); font-weight: 600; }
.keypath { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s2); color: var(--muted); font-size: var(--fs-13); }
.keypath .step { display: inline-flex; align-items: center; gap: var(--s1); padding: 2px var(--s2); border-radius: var(--r-full); border: 1px solid transparent; }
.keypath .step.on { border-color: var(--accent); color: var(--text); background: var(--bg); }
.keypath .arr { color: var(--line-strong); }
kbd { font-size: var(--fs-12); line-height: 1; padding: 3px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: var(--r-sm); background: var(--surface); color: var(--text); white-space: nowrap; }

.ic { width: var(--icon); height: var(--icon); flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: block; }
.ic.s { width: 12px; height: 12px; stroke-width: 2.2; }
.ic.xs { width: 10px; height: 10px; stroke-width: 2.6; }
.ic.l { width: 18px; height: 18px; }

/* ---------- window ---------- */
.win { container: win / inline-size; position: relative; height: var(--win-h); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--rail); border: 1px solid var(--line); border-radius: var(--r-sheet); overflow: hidden; font-size: var(--fs-13); line-height: 1.3; }
.tb { display: flex; align-items: center; gap: var(--s4); padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line); min-width: 0; }
.logo { font-family: var(--display); font-weight: 600; font-size: var(--fs-14); display: inline-flex; gap: var(--s1); align-items: center; }
.logo i { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); display: inline-block; }
.tabs { display: flex; gap: 2px; min-width: 0; overflow: hidden; }
.tab { display: inline-flex; align-items: center; gap: var(--s1); padding: var(--s1) var(--s3); border-radius: var(--r-md); color: var(--muted); white-space: nowrap; }
.tab.on { background: var(--bg); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.panes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1px; background: var(--line); min-height: 0; }
.pane { container: pane / inline-size; display: flex; flex-direction: column; background: var(--bg); min-width: 0; min-height: 0; position: relative; }
.path { display: flex; align-items: center; gap: var(--s2); min-height: 28px; padding-inline: var(--s3); border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
.path .cnt { margin-inline-start: auto; color: var(--muted); font-size: var(--fs-12); }
.path .crumb { color: var(--muted); }
.path .ic { color: var(--muted); width: 14px; height: 14px; }

.list { overflow-y: auto; overflow-x: hidden; flex: 1 1 auto; min-height: 0; outline: none; position: relative; }
.row, .hdr { --cols: var(--mk) var(--gut) minmax(0, 1fr) 72px 140px; }
.win[data-dir="B"] .row, .win[data-dir="B"] .hdr { --cols: var(--mk) var(--gut) minmax(0, 1fr) 236px 72px 140px; }
.pane.nogut { --gut: 0px; }
.win .pane.nogut .row, .win .pane.nogut .hdr { --cols: var(--mk) var(--gut) minmax(0, 1fr) 72px 140px; }
.pane.nogut .c-gitx { display: none; }
.row, .hdr { display: grid; grid-template-columns: var(--cols); align-items: center; padding-inline: var(--s2) var(--s3); }
.row { height: var(--row); position: relative; white-space: nowrap; }
.row > *, .hdr > * { min-width: 0; padding-inline-start: var(--s2); overflow: hidden; text-overflow: ellipsis; }
.row > .c-mk, .row > .c-git, .hdr > .c-mk, .hdr > .c-git { padding: 0; overflow: visible; }
.hdr { min-height: 24px; color: var(--muted); font-size: var(--fs-12); border-bottom: 1px solid var(--line); }
.hdr > :nth-child(n+4), .row > .c-size, .row > .c-date, .row > .c-gitx { text-align: end; }
.row > .c-gitx { text-align: start; }
.hdr > .c-gitx { text-align: start; }
:where(.row:nth-child(even)) { background: var(--zebra); }
.row .c-size, .row .c-date { color: var(--muted); font-variant-numeric: tabular-nums; }
.c-mk { display: flex; justify-content: center; align-items: center; color: var(--mark); }
.c-mk .ic { width: 14px; height: 14px; }
.c-git { display: flex; justify-content: center; align-items: stretch; height: 100%; }
.hdr .c-git { align-items: center; }
.nm { display: inline-flex; align-items: center; gap: var(--s2); min-width: 0; max-width: 100%; }
.nm .t { overflow: hidden; text-overflow: ellipsis; transform: translateY(0.5px); }
.nm .ab { transform: translateY(0.5px); color: var(--muted); font-size: var(--fs-12); font-variant-numeric: tabular-nums; flex: none; margin-inline-start: var(--s1); }
.k-folder { color: var(--folder); } .k-code { color: var(--kind-code); } .k-auto { color: var(--kind-auto); }
.k-archive { color: var(--kind-archive); } .k-doc { color: var(--kind-doc); } .k-plain { color: var(--muted); }
.row.mk .t { color: var(--mark); font-weight: 600; }
.row.cur { background: var(--selection); }
.row.cur::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px; border-radius: var(--r-xs); background: var(--card-ring); }
.pane:not(.active) .row.cur { background: transparent; }
.pane:not(.active) .row.cur::before { display: none; }

/* the gutter button */
.gb { appearance: none; border: 0; background: transparent; padding: 0; margin: 0; width: 100%; min-width: var(--mk); display: grid; place-items: center; border-radius: var(--r-sm); cursor: pointer; transition: opacity var(--fade) linear; position: relative; }
.gb:hover { background: color-mix(in oklch, var(--text) 9%, transparent); }
.gb:focus-visible { outline: var(--ring) solid var(--accent); outline-offset: -1px; border-radius: var(--r-md); }
.gb.stale { opacity: 0.5; }
.gb.none { cursor: default; }
.gb .ic { transition: opacity var(--fade) linear; }
.st-conflict { --sc: var(--st-conflict); --sct: var(--st-conflict-t); --sf: var(--fill-conflict); --so: var(--on-conflict); }
.st-modified { --sc: var(--st-mod); --sct: var(--st-mod-t); --sf: var(--fill-mod); --so: var(--on-mod); }
.st-ahead, .st-behind, .st-diverged { --sc: var(--st-sync); --sct: var(--st-sync-t); --sf: var(--fill-sync); --so: var(--on-sync); }
.st-clean { --sc: var(--ok); --sct: var(--ok); --sf: transparent; --so: var(--ok); }
.st-unknown, .st-checking { --sc: var(--muted); --sct: var(--muted); --sf: transparent; --so: var(--muted); }
.st-checking { --sc: var(--line-strong); }

/* A: glyph */
.g-a .ic { color: var(--sc); }
/* B: chip */
.chip { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; background: var(--sf); color: var(--so); font-weight: 700; font-size: 12px; line-height: 1; font-family: var(--ui); }
.chip.ghost { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--ok); }
.chip.dash { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-strong); color: var(--muted); border-radius: 5px; }
.chip.dash.dashed { box-shadow: none; border: 1.5px dashed var(--line-strong); }
.qdot { width: 4px; height: 4px; border-radius: 50%; background: var(--line-strong); }
.win[data-dir="B"] .row.tint .t { color: var(--sct); }
.win[data-dir="B"] .row.tint.cur .t { color: var(--sct); }
.gx { display: flex; align-items: center; gap: var(--s2); font-size: var(--fs-12); color: var(--muted); min-width: 0; }
.gx .br { max-width: 112px; display: inline-flex; align-items: center; gap: var(--s1); font-family: var(--mono); min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.gx .br .ic { width: 12px; height: 12px; }
.gx .f { font-variant-numeric: tabular-nums; white-space: nowrap; }
.gx .f.hot { color: var(--sct); font-weight: 600; }
/* C: mono glyph + strip */
.g-c .ic { color: var(--text); }
.g-c .st-conflict .ic { color: var(--st-conflict); }
.g-c .st-clean .ic, .g-c .st-unknown .ic { color: var(--muted); }
.g-c .st-checking .ic { color: var(--line-strong); }
.strip { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s2); padding: var(--s1) var(--s3); border-bottom: 1px solid var(--line); background: var(--rail); font-size: var(--fs-12); }
.strip .who { display: inline-flex; align-items: center; gap: var(--s1); color: var(--muted); }
.strip .who .mono { font-size: var(--fs-12); }
.strip .who b { color: var(--text); font-family: var(--ui); font-weight: 600; font-size: var(--fs-13); }
.strip .who .ic { width: 13px; height: 13px; }
.tally { display: inline-flex; align-items: center; gap: var(--s1); padding: 0 var(--s2); min-height: 24px; border: 1px solid var(--line); border-radius: var(--r-full); background: var(--bg); cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tally:hover { background: var(--hover); }
.tally .ic { width: 12px; height: 12px; stroke-width: 2.2; }
.tally.st-conflict { border-color: var(--st-conflict); }
.tally.st-conflict .ic { color: var(--st-conflict); }
.strip .sp { margin-inline-start: auto; color: var(--muted); display: inline-flex; gap: var(--s1); align-items: center; }
.strip .warn { display: inline-flex; align-items: center; gap: var(--s1); color: var(--text); }
.strip .warn .ic { width: 13px; height: 13px; color: var(--muted); }
/* D: count pill */
.win[data-dir="D"] .pane { --gut: 56px; }
.win[data-dir="D"] .pane.nogut { --gut: 0px; }
.win .pane.nogut .row, .win .pane.nogut .hdr { --cols: var(--mk) var(--gut) minmax(0, 1fr) 72px 140px; }
.pane.nogut .c-gitx { display: none; }
.pill { display: inline-flex; align-items: center; gap: 2px; height: 18px; padding-inline: 5px; border-radius: var(--r-full); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; background: color-mix(in oklch, var(--sc) 16%, var(--bg)); color: var(--sct); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--sc) 40%, transparent); white-space: nowrap; }
.pill .ic { width: 10px; height: 10px; stroke-width: 2.6; }
.pill.solid { background: var(--sc); color: var(--solid-conflict-text); box-shadow: none; }
.pill.out { background: transparent; color: var(--ok); box-shadow: inset 0 0 0 1px var(--line-strong); }
.pill.dashed { background: transparent; color: var(--muted); box-shadow: none; border: 1.5px dashed var(--line-strong); }
.pill .sep { width: 3px; }
.dq { color: var(--line-strong); }
.dq .ic { width: 13px; height: 13px; }

/* ---------- status bar, tooltip ---------- */
.foot { display: flex; align-items: center; gap: var(--s3); min-height: 28px; padding-inline: var(--s3); border-top: 1px solid var(--line); background: var(--rail); color: var(--muted); font-size: var(--fs-12); white-space: nowrap; overflow: hidden; }
.foot .msg { overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.foot .sp { margin-inline-start: auto; display: inline-flex; gap: var(--s1); align-items: center; }
.tip { position: fixed; z-index: var(--z-tip); max-width: 320px; padding: var(--s2) var(--s3); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow-tip); font-size: var(--fs-12); line-height: 1.4; opacity: 0; pointer-events: none; transition: opacity var(--fade) linear; }
.tip.on { opacity: 1; }
.tip b { font-weight: 600; }
.tip .l2 { color: var(--muted); display: block; }

/* ---------- menu (shared) ---------- */
.menu { position: absolute; z-index: var(--z-menu); width: 340px; max-width: calc(100% - 16px); display: flex; flex-direction: column; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-menu); box-shadow: var(--shadow-menu); font-size: var(--fs-13); outline: none; }
.menu.fresh { animation: fade var(--fade) linear; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.mi { display: flex; align-items: center; gap: var(--s2); height: 28px; padding-inline: 6px; border-radius: var(--r-md); white-space: nowrap; cursor: pointer; min-width: 0; }
.mi .ic { color: var(--accent); }
.mi .lbl { flex: none; }
.mi .note { margin-inline-start: auto; color: var(--muted); font-size: var(--fs-12); overflow: hidden; text-overflow: ellipsis; min-width: 0; padding-inline-start: var(--s3); }
.mi.lead .lbl { font-weight: 700; }
.mi.sel { background: var(--selection); box-shadow: inset 0 0 0 var(--ring) var(--accent); }
.mi[aria-disabled="true"] { cursor: default; color: var(--muted); }
.mi[aria-disabled="true"] .ic { color: var(--line-strong); }
.mi[aria-disabled="true"] .lbl { opacity: 0.8; }
.mi.sel[aria-disabled="true"] { box-shadow: none; }
.mi .ic.tx { color: var(--muted); }
.mic { width: 20px; display: flex; justify-content: center; flex: none; }
.mfoot { display: flex; align-items: center; gap: var(--s2); min-height: 30px; margin-top: 4px; padding: 4px 6px 2px; border-top: 1px solid var(--line); color: var(--muted); font-size: var(--fs-12); white-space: nowrap; }
.mfoot .via b { color: var(--text); font-weight: 600; }
.mfoot .sp { margin-inline-start: auto; display: inline-flex; align-items: center; gap: var(--s1); }
.mfoot kbd { padding: 2px 4px; }
.mh .gb { width: auto; }
.badge-lg { display: grid; place-items: center; width: 20px; flex: none; }
.state-w { font-weight: 600; color: var(--sct); }
.mono-b { font-family: var(--mono); font-size: var(--fs-12); color: var(--muted); }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* A menu head */
.m-a .mh { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 2px var(--s2); padding: var(--s2) 6px var(--s2); border-bottom: 1px solid var(--line); margin-bottom: 4px; align-items: center; }
.m-a .mh .t1 { display: flex; gap: var(--s2); align-items: baseline; min-width: 0; }
.m-a .mh .t1 b { font-weight: 700; font-size: var(--fs-14); }
.m-a .mh .t2 { grid-column: 2; color: var(--muted); font-size: var(--fs-12); display: flex; flex-wrap: wrap; gap: 0 var(--s2); }
.m-a .mh .t2 .state-w { font-weight: 600; }
/* B menu */
.m-b .mh { display: flex; align-items: center; gap: var(--s2); height: 32px; padding-inline: 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; min-width: 0; }

/* ---------- badges per direction ---------- */

const countFamily = (st) => (st === "ahead" || st === "behind" || st === "diverged" ? "sync" : st);

/* ---------- menu ---------- */

/* ---------- render ---------- */
const DIRS = {

    clean: "<b>Clean subfolders: nothing.</b> A clean repository root shows a check, so the root says “this is a repository” and subfolders only speak up when something is wrong; the gutter stays calm.",
    trade: "Trade-off: the calmest list and the least new UI, but a folder with nothing shown could also mean “not checked”; the unknown glyph covers that.", free: null },
  B: { model: "<b>A letter chip in the gutter plus a Git column.</b> Chip is M, !, an arrow or a check; the name takes the state tint; branch and counts sit in a Git column (inline on narrow windows). The menu shows a fact beside each action.",

    trade: "Trade-off: most information per row and the clearest clean-versus-unchecked reading, at the cost of a busier list and a per-folder change count that the scanner must produce.", free: null },
  C: { model: "<b>Mono glyphs plus a summary strip.</b> Gutter glyphs use text colour; only conflict is red. A strip above the list tallies the listing; each tally jumps to the next such row. The menu leads with one primary button.",
    clean: "<b>Clean subfolders: nothing.</b> The strip counts the clean ones (“9 clean”), so the rows can stay quiet.",
    trade: "Trade-off: calmest colour use and a place for “what needs me?”, but a row costs a strip of vertical space and the glyph alone is less loud than a coloured one.",
    free: "Free direction, because Navo is calm: one colour for the one state that blocks work, and a tally answers “how many repositories need me”, which no single badge can." },
  D: { model: "<b>A count pill in a wider gutter.</b> The pill carries the shape and the number: 2 conflicts, 4 changed, ↑3, ↓5, ↑3↓2. A subfolder shows how many changes sit below it. The menu opens with stat tiles.",
    clean: "<b>Clean subfolders: a faint check.</b> Explicit “checked, clean” on every folder, no pill, so counts stand out.",
    trade: "Trade-off: answers “how much” at a glance and reads well on a phone, but the gutter is 48 px instead of 20 and the scanner must count per folder.",
    free: "Free direction, because the number is the useful part: “4 changed” tells how big a commit is before opening anything, and a count is a second cue beside colour." },
};
const KEYSTEPS = [["↓", "Select a repository row"], ["Alt+G", "Open the Git menu"], ["↑ ↓", "Pick an action"], ["Enter", "Run in the Git tool"], ["Esc", "Close, focus returns to the badge"]];
function renderHead() {
  const d = DIRS[S.dir];
  $("#dir-head").innerHTML = `<h2>Direction ${S.dir}</h2><p class="m">${d.model}</p><p class="c">${d.clean}</p><p class="t">${d.trade}</p>${d.free ? `<p class="f"><b>Why free:</b> ${d.free}</p>` : ""}`;
  const on = S.menu ? 2 : 0;
  $("#keypath").innerHTML = KEYSTEPS.map(([k, t], i) => {
    const kk = k.split(" ").map((x) => `<kbd>${x}</kbd>`).join(" ");
    return `${i ? '<span class="arr" aria-hidden="true">›</span>' : ""}<span class="step${i === on || (S.menu && i === 1) ? " on" : ""}">${kk} ${t}</span>`;
  }).join("");
}
function renderLegend() {
  const mk = (st, sub, label, rule, extra = {}) => {
    const row = { k: "d", n: "x", ...(sub ? { sub: "navo", below: extra.below || { c: 0, m: 0 } } : { repo: extra.repo }) };
    if (!sub) REPOS.__lg = extra.r;
    return { st, sub, label, rule, row, extra };
  };
  const spec = [
    ["conflict", false, "Conflict", "Highest. Conflicts, or a merge or rebase in progress.", { r: { name: "x", branch: "b", conflicted: 2, changed: 1, untracked: 0, ahead: 0, behind: 0 } }],
    ["modified", false, "Modified", "Changed or new files. Subfolders show the worst state below.", { r: { name: "x", branch: "b", conflicted: 0, changed: 4, untracked: 1, ahead: 0, behind: 0 } }],
    ["diverged", false, "Ahead and behind", "2↑ 3↓ with zeros hidden. Own state only when the tree is clean.", { r: { name: "x", branch: "b", conflicted: 0, changed: 0, untracked: 0, ahead: 2, behind: 3 } }],
    ["ahead", false, "Ahead only", "Commits not pushed: 2↑.", { r: { name: "x", branch: "b", conflicted: 0, changed: 0, untracked: 0, ahead: 2, behind: 0 } }],
    ["behind", false, "Behind only", "Commits not pulled since the last fetch: 3↓.", { r: { name: "x", branch: "b", conflicted: 0, changed: 0, untracked: 0, ahead: 0, behind: 3 } }],
    ["clean", false, "Clean repository", "Shown on the root only.", { r: { name: "x", branch: "b", conflicted: 0, changed: 0, untracked: 0, ahead: 0, behind: 0 } }],
    ["clean", true, "Clean subfolder", "Direction-specific: see the text above.", {}],
    ["unknown", false, "Unknown", "Timed out, no Git, not trusted, or the repository is above the caps. The tooltip says why.", { r: { name: "x", unknown: "timed", branch: "?" } }],
    ["checking", false, "Checking", "First scan, nothing known yet. When a known state is re-checked it stays, faint, until the fresh one arrives.", { r: { name: "x", first: true, branch: "?" } }],
  ];
  const html = spec.map(([st, sub, label, rule, extra]) => {
    const key = "__lg" + label.replace(/\W/g, "");
    if (!sub) REPOS[key] = extra.r;
    const row = sub ? { k: "d", n: "x", sub: "navo", below: { c: 0, m: 0 } } : { k: "d", n: "x", repo: key };
    const inner = badgeInner(S.dir, row);
    const empty = !inner;
    return `<div class="it"><span class="sw"><span class="gb ${"st-" + st} none">${empty ? '<span style="color:var(--muted);font-size:11px">none</span>' : inner}</span></span><span class="txt"><b>${label}</b><span>${rule}</span></span></div>`;
  }).join("");
  const rows = [["Five visible states", "Conflict, Modified, Ahead/Behind, Clean and Unknown. Diverged is Ahead plus Behind; Checking is a faint placeholder. The worst state wins: conflict, then modified, then ahead and behind, then clean."]];
  $("#legend").innerHTML = `<h3>Badge states in direction ${S.dir}</h3><div class="lg g-${S.dir.toLowerCase()}" data-dir-legend>${html}</div><p class="hint">${rows[0][1]} Colour is never the only cue: each state has its own shape, ${S.dir === "B" ? "letter" : S.dir === "D" ? "number" : "glyph"} or count.</p>`;
  Object.keys(REPOS).filter((k) => k.startsWith("__lg")).forEach((k) => delete REPOS[k]);
}
function renderWin(opts = {}) {
  const win = $("#win");
  const prevScroll = $("#grid")?.scrollTop ?? 0;
  const d = D(); const rows = d.rows;
  win.dataset.dir = S.dir;
  win.className = `win g-${S.dir.toLowerCase()}`;
  const tool = TOOLS[S.tool];
  const live = S.msg || `${SCN_NAMES[S.scn]}: ${rows.filter(hasBadge).length} Git badges.`;
  win.innerHTML = `
    <div class="tb"><span class="logo"><i></i>Navo</span><div class="tabs"><span class="tab on">${ic("folder")}${esc(SCN[S.scn].path.at(-1))}</span><span class="tab">${ic("folder")}Downloads</span></div></div>
    <div class="panes">${paneLeft(rows, d.cur)}${paneRight()}</div>
    <div class="foot"><span class="msg" role="status" aria-live="polite">${esc(live)}</span><span class="sp">Git: ${tool.name ? "via " + esc(tool.name) : "no tool"}</span></div>
    ${S.menu ? menuHTML(S.dir, menuModel(rows[S.menu.i]), S.menu.sel, S.menu.fresh) : ""}`;
  const grid = $("#grid");
  grid.scrollTop = prevScroll;
  if (!S.menu) { const cr = $(`#r${d.cur}`); if (cr) { const g = grid.getBoundingClientRect(), c = cr.getBoundingClientRect(); if (c.top < g.top) grid.scrollTop -= g.top - c.top; if (c.bottom > g.bottom) grid.scrollTop += c.bottom - g.bottom; } }
  if (S.menu) { placeMenu(); S.menu.fresh = false; $("#menu").focus({ preventScroll: true }); }
  else if (opts.focus === "badge") { const b = $(`#r${d.cur} .gb`); (b || grid).focus({ preventScroll: true }); if (b) showTip(b); }
  else if (opts.focus !== "none") grid.focus({ preventScroll: true });
  renderHead(); renderLegend();
}
function placeMenu() {
  const win = $("#win"), m = $("#menu"); if (!m) return;
  const b = $(`#r${D().cur} .gb`) || $(`#r${D().cur}`);
  const wr = win.getBoundingClientRect(), br = b.getBoundingClientRect();
  const narrow = wr.width < 560;
  m.style.width = narrow ? wr.width - 16 + "px" : "";
  let left = narrow ? 8 : br.left - wr.left - 2;
  left = Math.max(8, Math.min(left, wr.width - m.offsetWidth - 8));
  let top = br.bottom - wr.top + 4;
  if (top + m.offsetHeight > wr.height - 8) top = Math.max(8, br.top - wr.top - m.offsetHeight - 4);
  m.style.left = left + "px"; m.style.top = top + "px";
}

/* ---------- tooltip ---------- */
function showTip(btn) {
  const i = +btn.dataset.badge; if (isNaN(i) || S.menu) return;
  const row = rowsNow()[i]; if (!row) return;
  const tip = $("#tip");
  const lines = tipLines(row);
  tip.innerHTML = lines.map((l, k) => (k === 0 ? l : `<span class="l2">${l}</span>`)).join("");
  const r = btn.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(r.left, innerWidth - 328)) + "px";
  tip.style.top = r.bottom + 6 + "px";
  tip.classList.add("on");
  S.tipFor = i;
}
function hideTip() { $("#tip").classList.remove("on"); S.tipFor = null; }

/* ---------- actions ---------- */
function applyEffect(repoKey, id) {
  const r = REPOS[repoKey];
  if (id === "pull") r.behind = 0;
  if (id === "push") r.ahead = 0;
  if (id === "commit") { r.changed = 0; r.untracked = 0; Object.values(S.data).forEach((d) => d.rows.forEach((x) => { if (x.sub === repoKey && x.below && x.below.c === 0) x.below.m = 0; })); }
  if (r.first) { delete r.first; Object.assign(r, { branch: "main", up: "origin/main", ahead: 0, behind: 0, changed: 0, untracked: 0, conflicted: 0, fetched: "just now" }); }
  if (id === "recheck") { if (r.unknown === "timed") { delete r.unknown; Object.assign(r, { up: "origin/main", ahead: 0, behind: 0, changed: 0, untracked: 0, conflicted: 0, fetched: "just now" }); } }
}
function runItem(idx) {
  const rows = rowsNow(); const row = rows[S.menu.i]; const m = menuModel(row);
  const it = m.items[idx]; if (!it || it.enabled === false) return;
  const key = row.repo || row.sub; const tool = TOOLS[S.tool];
  const where = it.id === "recheck" ? "Navo" : (tool.name || "Navo");
  S.menu = null;
  S.msg = it.id === "choose" ? "Opening Settings → Git" : it.id === "recheck" ? `Checking ${m.r.name} again` : `${it.label.replace("…", "")} · ${m.r.name} · started in ${where}`;
  if (it.id === "choose") { renderWin({ focus: "badge" }); return; }
  S.refresh[key] = true;
  renderWin({ focus: "badge" });
  setTimeout(() => {
    applyEffect(key, it.id); delete S.refresh[key];
    S.msg = `Git status refreshed for ${m.r.name}: ${STATE_WORD[repoState(m.r)].toLowerCase()}`;
    renderWin({ focus: "none" });
  }, 1200);
}
function openMenu(i) {
  const row = rowsNow()[i];
  if (!row || !hasBadge(row)) { S.msg = "No Git badge on this row, so Alt+G does nothing here."; renderWin({ focus: "grid" }); return; }
  hideTip();
  D().cur = i;
  const m = menuModel(row);
  const first = m.items.findIndex((x) => x.enabled !== false);
  S.menu = { i, sel: Math.max(0, first), fresh: true };
  S.msg = `Git menu for ${m.r.name}: ${STATE_WORD[m.rs].toLowerCase()}, ${sentence(row, true)}`;
  renderWin();
}
function closeMenu() { S.menu = null; S.msg = ""; renderWin({ focus: "badge" }); }
function moveMenu(dirn) {
  const m = menuModel(rowsNow()[S.menu.i]); const n = m.items.length; let k = S.menu.sel;
  for (let t = 0; t < n; t++) { k = (k + dirn + n) % n; if (m.items[k].enabled !== false) break; }
  S.menu.sel = k; renderWin();
}
function moveCur(delta, abs) {
  const d = D(); const n = d.rows.length;
  d.cur = abs !== undefined ? abs : Math.max(0, Math.min(n - 1, d.cur + delta));
  hideTip(); S.msg = ""; renderWin({ focus: "grid" });
}
function jump(kind) {
  const rows = rowsNow(); const d = D();
  const fam = (r) => { const st = stateOf(r); return st ? (countFamily(st) === kind ? true : false) : false; };
  for (let k = 1; k <= rows.length; k++) { const i = (d.cur + k) % rows.length; if (fam(rows[i])) { d.cur = i; break; } }
  S.msg = `Jumped to the next ${kind === "sync" ? "out of sync" : kind} row`; renderWin({ focus: "grid" });
}

/* ---------- controls ---------- */
function seg(el, items, get, set) {
  el.innerHTML = items.map(([k, label, kbd]) => `<button type="button" data-k="${k}" aria-pressed="${get() === k}">${label}</button>`).join("");
  el.onclick = (e) => { const b = e.target.closest("button"); if (b) set(b.dataset.k); };
}
function setTheme(t) { S.theme = t; document.documentElement.dataset.theme = t; syncControls(); }
function setDir(k) { S.dir = k; S.menu = S.menu ? { ...S.menu, fresh: false } : null; syncControls(); renderWin(); writeHash(); }
function setScn(k) { S.scn = k; S.menu = null; S.msg = ""; syncControls(); renderWin(); writeHash(); }
function setTool(k) { S.tool = k; if (S.menu) S.menu.sel = 0, S.menu.fresh = false; syncControls(); renderWin(); writeHash(); }
function syncControls() {
  seg($("#picker"), ["A", "B", "C", "D"].map((k) => [k, k]), () => S.dir, setDir);
  seg($("#theme-seg"), [["light", "Light"], ["dark", "Dark"]], () => S.theme, setTheme);
  seg($("#scn-seg"), Object.entries(SCN_NAMES), () => S.scn, setScn);
  seg($("#tool-seg"), Object.entries(TOOLS).map(([k, v]) => [k, v.label]), () => S.tool, setTool);
  $("#picker").querySelectorAll("button").forEach((b) => b.setAttribute("aria-label", "Direction " + b.dataset.k));
}
function writeHash() { history.replaceState(null, "", `#dir=${S.dir}&theme=${S.theme}&scn=${S.scn}&tool=${S.tool}`); }

document.addEventListener("keydown", (e) => {
  const plain = !e.ctrlKey && !e.metaKey && !e.altKey;
  if (e.altKey && !e.ctrlKey && !e.metaKey && e.key.toLowerCase() === "g") { e.preventDefault(); if (!S.menu) openMenu(D().cur); return; }
  if (S.menu) {
    if (e.key === "Escape") { e.preventDefault(); closeMenu(); return; }
    if (e.key === "ArrowDown") { e.preventDefault(); moveMenu(1); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); moveMenu(-1); return; }
    if (e.key === "Home") { e.preventDefault(); S.menu.sel = 0; renderWin(); return; }
    if (e.key === "End") { e.preventDefault(); S.menu.sel = menuModel(rowsNow()[S.menu.i]).items.length - 1; renderWin(); return; }
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); runItem(S.menu.sel); return; }
    if (e.key === "Tab") { e.preventDefault(); return; }
  }
  if (!plain) return;
  if (/^[1-4]$/.test(e.key)) { setDir("ABCD"[+e.key - 1]); return; }
  const k = e.key.toLowerCase();
  if (k === "t") { setTheme(S.theme === "light" ? "dark" : "light"); writeHash(); return; }
  if (k === "s") { const ks = Object.keys(SCN); setScn(ks[(ks.indexOf(S.scn) + 1) % ks.length]); return; }
  if (k === "u") { const ks = Object.keys(TOOLS); setTool(ks[(ks.indexOf(S.tool) + 1) % ks.length]); return; }
  if (S.menu || !e.target.closest || !e.target.closest("#win")) return;
  if (e.key === "ArrowDown") { e.preventDefault(); moveCur(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); moveCur(-1); }
  else if (e.key === "Home") { e.preventDefault(); moveCur(0, 0); }
  else if (e.key === "End") { e.preventDefault(); moveCur(0, rowsNow().length - 1); }
  else if (e.key === "Escape") hideTip();
});
$("#win").addEventListener("click", (e) => {
  const mi = e.target.closest("[data-mi]");
  if (mi && S.menu) { runItem(+mi.dataset.mi); return; }
  if (S.menu && !e.target.closest("#menu")) { const b = e.target.closest("[data-badge]"); S.menu = null; if (!b) { renderWin({ focus: "grid" }); return; } }
  const b = e.target.closest("[data-badge]");
  if (b) { openMenu(+b.dataset.badge); return; }
  const j = e.target.closest("[data-jump]"); if (j) { jump(j.dataset.jump); return; }
  const r = e.target.closest("[data-row]"); if (r) { D().cur = +r.dataset.row; hideTip(); renderWin({ focus: "grid" }); }
});
$("#win").addEventListener("mouseover", (e) => { const b = e.target.closest("[data-badge]"); if (b && !S.menu) showTip(b); });
$("#win").addEventListener("mouseout", (e) => { if (e.target.closest("[data-badge]")) hideTip(); });
$("#win").addEventListener("focusin", (e) => { const b = e.target.closest("[data-badge]"); if (b && !S.menu && e.target.matches(":focus-visible")) showTip(b); });
$("#win").addEventListener("focusout", (e) => { if (e.target.closest("[data-badge]")) hideTip(); });
addEventListener("resize", () => placeMenu());

/* ---------- start ---------- */
(function init() {
  const h = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
  if (h.dir && /^[A-D]$/.test(h.dir)) S.dir = h.dir;
  if (h.scn && SCN[h.scn]) S.scn = h.scn;
  if (h.tool && TOOLS[h.tool]) S.tool = h.tool;
  S.theme = h.theme === "dark" || (!h.theme && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  document.documentElement.dataset.theme = S.theme;
  syncControls();
  renderWin({ focus: "none" });
  if (h.menu !== "0") { const d = D(); openMenu(d.cur); }
  if (h.menu === "0" && h.focus === "badge") renderWin({ focus: "badge" });
})();
</script>
