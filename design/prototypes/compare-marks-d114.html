<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folder Compare Marks</title>
<!-- Navo folder compare: four directions for status colours and marks, behind one picker. Base tokens from crates/navo-ui/src/tokens (Open Sea). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --rail: oklch(95.5% 0.012 225); --background: oklch(98.5% 0.008 225); --surface: oklch(99.8% 0 225);
  --line: oklch(89% 0.014 225); --text: oklch(22% 0.014 225); --muted: oklch(48.8% 0.017 225);
  --faint: oklch(64.8% 0.017 225); --hover: oklch(94.25% 0.027 218); --selection: oklch(90% 0.046 218);
  --accent: oklch(52% 0.092 218); --accent-text: oklch(48.8% 0.086 218); --folder: oklch(49.6% 0.102 80);
  /* status tones: text, solid badge, row tint, strong fill. Conflict gets its own hue (335), apart from delete (27). */
  --del-text: oklch(50% 0.17 27);  --del-row: oklch(94.5% 0.04 27);  --del-fill: oklch(90% 0.06 27);
  --add-text: oklch(46% 0.12 150); --add-row: oklch(94.5% 0.045 150); --add-fill: oklch(89.5% 0.07 150);
  --chg-text: oklch(48% 0.11 70);  --chg-row: oklch(95% 0.05 80);   --chg-fill: oklch(90% 0.065 78);
  --cfl-text: oklch(48% 0.16 335); --cfl-row: oklch(94.5% 0.04 335); --cfl-fill: oklch(90% 0.06 335);
  --busy-text: var(--accent-text); --busy-row: var(--hover);
  --on-badge: oklch(99.8% 0 225);
  --gap: oklch(91% 0.006 260); --gap-line: oklch(84% 0.008 260);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --rail: oklch(19% 0.014 225); --background: oklch(22.5% 0.014 225); --surface: oklch(26.5% 0.014 225);
  --line: oklch(33% 0.014 225); --text: oklch(93.8% 0.014 225); --muted: oklch(72% 0.017 225);
  --faint: oklch(54.8% 0.017 225); --hover: oklch(27.75% 0.036 218); --selection: oklch(33% 0.058 218);
  --accent: oklch(76% 0.11 218); --accent-text: oklch(76% 0.11 218); --folder: oklch(82% 0.13 80);
  --del-text: oklch(76% 0.13 27);  --del-row: oklch(27% 0.05 27);  --del-fill: oklch(36% 0.09 27);
  --add-text: oklch(78% 0.13 150); --add-row: oklch(27% 0.05 150); --add-fill: oklch(36% 0.08 150);
  --chg-text: oklch(82% 0.12 78);  --chg-row: oklch(28% 0.045 78); --chg-fill: oklch(36% 0.08 78);
  --cfl-text: oklch(78% 0.13 335); --cfl-row: oklch(27% 0.05 335); --cfl-fill: oklch(36% 0.09 335);
  --on-badge: oklch(22.5% 0.014 225);
  --gap: oklch(23% 0.01 260); --gap-line: oklch(29% 0.012 260);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  color-scheme: dark;
  --rail: oklch(19% 0.014 225); --background: oklch(22.5% 0.014 225); --surface: oklch(26.5% 0.014 225);
  --line: oklch(33% 0.014 225); --text: oklch(93.8% 0.014 225); --muted: oklch(72% 0.017 225);
  --faint: oklch(54.8% 0.017 225); --hover: oklch(27.75% 0.036 218); --selection: oklch(33% 0.058 218);
  --accent: oklch(76% 0.11 218); --accent-text: oklch(76% 0.11 218); --folder: oklch(82% 0.13 80);
  --del-text: oklch(76% 0.13 27);  --del-row: oklch(27% 0.05 27);  --del-fill: oklch(36% 0.09 27);
  --add-text: oklch(78% 0.13 150); --add-row: oklch(27% 0.05 150); --add-fill: oklch(36% 0.08 150);
  --chg-text: oklch(82% 0.12 78);  --chg-row: oklch(28% 0.045 78); --chg-fill: oklch(36% 0.08 78);
  --cfl-text: oklch(78% 0.13 335); --cfl-row: oklch(27% 0.05 335); --cfl-fill: oklch(36% 0.09 335);
  --on-badge: oklch(22.5% 0.014 225);
  --gap: oklch(23% 0.01 260); --gap-line: oklch(29% 0.012 260);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--background); color: var(--text); font: 13px/1.4 Inter, system-ui, sans-serif; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
.num { font-variant-numeric: tabular-nums; }

/* picker */
.picker { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 10px 16px; background: var(--rail); border-bottom: 1px solid var(--line); }
.picker .group { display: flex; gap: 4px; flex-wrap: wrap; }
.picker button { border: 1px solid var(--line); background: var(--surface); padding: 5px 10px; border-radius: 6px; cursor: pointer; }
.picker button[aria-pressed="true"] { background: var(--selection); border-color: var(--accent); font-weight: 600; }
.picker .note { flex-basis: 100%; color: var(--muted); font-size: 12px; }
.spacer { flex: 1; }

/* app frame */
.app { margin: 16px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.head { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); background: var(--rail); }
.head div { padding: 8px 12px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.head div + div { border-left: 1px solid var(--line); }
.bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--selection); }
.chip .n { font-weight: 700; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.running { color: var(--busy-text); margin-left: auto; font-size: 12px; }

.t-del { --t: var(--del-text); --r: var(--del-row); --f: var(--del-fill); }
.t-add { --t: var(--add-text); --r: var(--add-row); --f: var(--add-fill); }
.t-chg { --t: var(--chg-text); --r: var(--chg-row); --f: var(--chg-fill); }
.t-cfl { --t: var(--cfl-text); --r: var(--cfl-row); --f: var(--cfl-fill); }
.t-busy { --t: var(--busy-text); --r: var(--busy-row); --f: var(--busy-row); }
.t-same { --t: var(--muted); --r: transparent; --f: transparent; }
.dot { background: var(--t); }

.rows { list-style: none; margin: 0; padding: 4px 0; }
.name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folder-name { color: var(--folder); }
.meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
.gapcell { background: repeating-linear-gradient(135deg, var(--gap) 0 6px, var(--gap-line) 6px 7px); border-radius: 5px; min-height: 28px; }
.ind { display: inline-block; flex: none; }
.newer { color: var(--text); font-weight: 600; }

/* ---------- Direction 1: tinted rows, solid badges, edge bar ---------- */
.d1 .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0; padding: 1px 4px; }
.d1 .cell { display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 0 10px 0 12px; margin: 0 2px;
  border-radius: 5px; background: var(--r); position: relative; min-width: 0; }
.d1 .cell::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px; border-radius: 2px; background: var(--t); }
.d1 .t-same .cell::before { display: none; }
.d1 .badge { width: 20px; height: 20px; border-radius: 4px; display: grid; place-items: center; flex: none;
  background: var(--t); color: var(--on-badge); font: 700 14px "JetBrains Mono", monospace; }
.d1 .t-same .badge { background: transparent; color: var(--faint); }
.d1 .cell .name { flex: 1; font-weight: 600; color: var(--t); }
.d1 .t-same .cell .name { font-weight: 400; color: var(--text); }
.d1 .t-same .cell .name.folder-name { color: var(--folder); }
.d1 .words { color: var(--t); font-size: 12px; white-space: nowrap; }
.d1 .meta { width: 150px; text-align: right; }

/* ---------- Direction 2: centre gutter, map strip, newer side marked ---------- */
.d2 .body { display: grid; grid-template-columns: 1fr 14px; }
.d2 .row { display: grid; grid-template-columns: 1fr 44px 1fr; align-items: stretch; }
.d2 .cell { display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 0 12px; min-width: 0; }
.d2 .row:nth-child(even) .cell { background: color-mix(in oklch, var(--rail) 55%, transparent); }
.d2 .cell .name { flex: 1; color: var(--text); }
.d2 :not(.t-same) > .cell .name { color: var(--t); font-weight: 600; }
.d2 .gut { display: grid; place-items: center; border-left: 1px solid var(--line); border-right: 1px solid var(--line); background: var(--rail); }
.d2 .g { min-width: 26px; height: 20px; border-radius: 10px; display: grid; place-items: center; padding: 0 5px;
  font: 700 13px "JetBrains Mono", monospace; color: var(--t); background: var(--r); border: 1px solid var(--t); }
.d2 .t-same .g { border: 0; background: none; color: var(--muted); }
.d2.words .row { grid-template-columns: 1fr 84px 1fr; }
.d2.words .g { font: 600 11.5px Inter, sans-serif; padding: 0 8px; white-space: nowrap; }
.d2 .meta { display: flex; gap: 10px; }
.d2 .map { border-left: 1px solid var(--line); background: var(--rail); position: relative; }
.d2 .tick { position: absolute; left: 3px; right: 3px; height: 4px; border-radius: 2px; background: var(--t); }

/* ---------- Direction 3: one ledger with words and deltas ---------- */
.d3 .table { width: 100%; border-collapse: collapse; }
.d3 th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
  font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.d3 td { padding: 6px 10px; border-bottom: 1px solid color-mix(in oklch, var(--line) 60%, transparent); vertical-align: middle; }
.d3 .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px;
  font-weight: 600; color: var(--t); background: var(--r); border: 1px solid color-mix(in oklch, var(--t) 45%, transparent); white-space: nowrap; }
.d3 .t-same .pill { border-color: transparent; background: none; font-weight: 500; }
.d3 .delta { color: var(--t); font-weight: 600; white-space: nowrap; }
.d3 .absent { color: var(--faint); font-style: italic; }
.d3 td.nm { max-width: 320px; }
.d3 .meta { display: block; }

/* ---------- Direction 4: strong fills, same rows folded, folder composition ---------- */
.d4 .row { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 2px 6px; }
.d4 .cell { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 10px; border-radius: 6px; background: var(--f); min-width: 0; }
.d4 .t-same .cell { background: none; color: var(--muted); }
.d4 .t-same .cell .name.folder-name { color: var(--folder); }
.d4 .cell .name { flex: 1; font-weight: 600; }
.d4 .t-same .cell .name { font-weight: 400; }
.d4 .glyph { font: 700 14px "JetBrains Mono", monospace; width: 16px; text-align: center; flex: none; }
.d4 .comp { display: flex; width: 72px; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); flex: none; }
.d4 .comp span { display: block; height: 100%; background: var(--t); }
.d4 .fold { margin: 2px 6px; padding: 5px 10px; border: 1px dashed var(--line); border-radius: 6px; color: var(--muted); cursor: pointer;
  background: none; width: calc(100% - 12px); text-align: left; }
.d4 .tag { font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }

.legend { margin: 0 16px 24px; color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 14px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }

/* phone width: one column, both sides stacked inside the row */
@media (max-width: 720px) {
  .app { margin: 12px 8px; }
  .head { grid-template-columns: 1fr; }
  .head div + div { border-left: 0; border-top: 1px solid var(--line); }
  .d1 .row, .d4 .row { grid-template-columns: 1fr; gap: 2px; }
  /* one line per pair: the side that exists; the gap is not drawn */
  .d1 .row > .gapcell, .d4 .row > .gapcell { display: none; }
  .d1 .row:not(:has(> .gapcell)) > :nth-child(2), .d4 .row:not(:has(> .gapcell)) > :nth-child(2) { display: none; }
  .d4 .meta { display: none; }
  .d3 .meta { display: inline; }
  .d3 td.lt:empty, .d3 td.rt:empty, .d3 td.dl:empty { display: none; }
  .d1 .meta, .d1 .words, .d2 .meta { display: none; }
  .d2 .row { grid-template-columns: 1fr 40px 1fr; }
  .d2.words .row { grid-template-columns: 1fr 66px 1fr; }
  .d2.words .g { padding: 0 4px; font-size: 10.5px; }
  .d2 .cell { padding: 0 6px; }
  .d3 thead { display: none; }
  .d3 tr { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .d3 td { border: 0; padding: 0; }
  .d3 td.st { grid-row: span 2; }
  .d3 td.nm { max-width: none; min-width: 0; }
  .d3 td.lt, .d3 td.rt, .d3 td.dl { grid-column: 2; }
  .d3 td.lt::before { content: "L "; color: var(--faint); }
  .d3 td.rt::before { content: "R "; color: var(--faint); }
  .d4 .comp { width: 48px; }
}
@media (prefers-reduced-motion: no-preference) { .chip, .picker button { transition: background-color .12s; } }

/* ---------- file view (all directions) ---------- */
:root { --syn-kw: oklch(50% 0.125 40); --syn-ty: oklch(41% 0.08 82); --syn-fn: oklch(48% 0.075 210); --syn-num: oklch(49% 0.1 330);
  --syn-str: oklch(48% 0.1 145); --syn-com: oklch(54% 0.015 60); --syn-mac: oklch(46% 0.07 62); --syn-com-tint: oklch(48% 0.015 60); }
:root[data-theme="dark"] { --syn-kw: oklch(75% 0.095 40); --syn-ty: oklch(85% 0.075 82); --syn-fn: oklch(80% 0.065 210); --syn-num: oklch(77% 0.075 330);
  --syn-str: oklch(80% 0.08 145); --syn-com: oklch(64% 0.014 60); --syn-mac: oklch(80% 0.06 62); --syn-com-tint: oklch(76% 0.014 60); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --syn-kw: oklch(75% 0.095 40); --syn-ty: oklch(85% 0.075 82);
  --syn-fn: oklch(80% 0.065 210); --syn-num: oklch(77% 0.075 330); --syn-str: oklch(80% 0.08 145); --syn-com: oklch(64% 0.014 60);
  --syn-mac: oklch(80% 0.06 62); --syn-com-tint: oklch(76% 0.014 60); } }
.s-kw { color: var(--syn-kw); } .s-ty { color: var(--syn-ty); } .s-fn { color: var(--syn-fn); } .s-num { color: var(--syn-num); }
.s-str { color: var(--syn-str); } .s-com { color: var(--syn-com); font-style: italic; } .s-mac { color: var(--syn-mac); } .s-pp { color: var(--syn-kw); }
.tinted .s-com { color: var(--syn-com-tint); }

.fbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.fbar .path { font-weight: 600; }
.fbar button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.fbar button[aria-pressed="true"] { border-color: var(--accent); background: var(--selection); }
.fbar .stat { color: var(--muted); font-size: 12px; }
.fbar .stat b { font-weight: 700; }
.kbd { font: 600 11px "JetBrains Mono", monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--muted); }
.opens { text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; }

.code { font: 12.5px/20px "JetBrains Mono", ui-monospace, monospace; }
.split { display: grid; grid-template-columns: 1fr 1fr; }
.split.has-gut { grid-template-columns: 1fr 40px 1fr 12px; }
.side { display: grid; grid-template-columns: 44px 1fr; min-width: 0; border-right: 1px solid var(--line); }
.side:last-of-type { border-right: 0; }
.nums { background: var(--rail); color: var(--muted); text-align: right; user-select: none; }
.nums div, .lines .ln { height: 20px; }
.nums div { padding-right: 8px; }
.hs { overflow-x: auto; overflow-y: hidden; min-width: 0; scrollbar-width: thin; }
.lines { display: inline-block; min-width: 100%; }
.lines .ln { white-space: pre; padding: 0 12px 0 10px; position: relative; }
.ln.gap { background: repeating-linear-gradient(135deg, var(--gap) 0 6px, var(--gap-line) 6px 7px); }
.gutcol { background: var(--rail); border-right: 1px solid var(--line); }
.gutcol div { height: 20px; display: grid; place-items: center; }
.mapcol { position: relative; background: var(--rail); border-left: 1px solid var(--line); }
.mapcol .tick { position: absolute; left: 2px; right: 2px; border-radius: 2px; background: var(--t); min-height: 3px; }

/* wrapped: one grid row per pair, so both sides share a height */
.wrapgrid { display: grid; grid-template-columns: 44px 1fr 44px 1fr; }
.wrapgrid.has-gut { grid-template-columns: 44px 1fr 40px 44px 1fr; }
.wrapgrid > .n { background: var(--rail); color: var(--muted); text-align: right; padding-right: 8px; user-select: none; }
.wrapgrid > .c { white-space: pre-wrap; overflow-wrap: anywhere; padding: 0 12px 0 10px; min-width: 0; position: relative; border-right: 1px solid var(--line); }
.wrapgrid > .c.gap { background: repeating-linear-gradient(135deg, var(--gap) 0 6px, var(--gap-line) 6px 7px); }
.wrapgrid > .g { background: var(--rail); display: grid; place-items: start center; padding-top: 0; border-right: 1px solid var(--line); }

/* unified (direction 3, and every direction at phone width) */
.uni { display: grid; grid-template-columns: auto 1fr; }
.uni .unums { background: var(--rail); color: var(--muted); user-select: none; }
.uni .unums div { height: 20px; display: grid; grid-template-columns: 34px 34px 18px; text-align: right; }
.uni .unums span { padding-right: 6px; }
.uni.wrap { display: block; }
.uni.wrap .urow { display: grid; grid-template-columns: 34px 34px 18px 1fr; }
.uni.wrap .urow > span { background: var(--rail); color: var(--muted); text-align: right; padding-right: 6px; }
.uni.wrap .urow > .c { white-space: pre-wrap; overflow-wrap: anywhere; padding: 0 12px 0 8px; background: none; color: inherit; text-align: left; position: relative; }
.fold-line { height: 20px; box-sizing: border-box; display: flex; align-items: center; padding: 0 12px; color: var(--muted); font: 12px Inter, sans-serif;
  background: var(--rail); border-block: 1px dashed var(--line); }

/* direction looks inside the file */
.fd1 .tone:not(.t-same) { background: var(--r); }
.fd1 .tone:not(.t-same)::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--t); }
.fd1 .w { background: var(--f); border-radius: 3px; }
.fd2 .w { background: var(--r); box-shadow: inset 0 -2px 0 var(--t); }
.fd2 .gchip { min-width: 22px; height: 16px; border-radius: 8px; display: grid; place-items: center; font: 700 11px "JetBrains Mono", monospace;
  color: var(--t); border: 1px solid var(--t); background: var(--r); font-size: 12px; }
.fd3 .tone.t-del, .fd3 .tone.t-add { background: var(--r); }
.fd3 .w { background: var(--f); border-radius: 3px; }
.fd3 .sign { font-weight: 700; color: var(--t); }
.fd4 .tone:not(.t-same) { background: var(--f); color: var(--text); }
.fd4 .tone:not(.t-same) [class^="s-"] { color: inherit; font-style: normal; }
.fd4 .w { text-decoration: underline 2px var(--t); text-underline-offset: 3px; font-weight: 700; }

.hint { padding: 8px 12px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="picker" role="toolbar" aria-label="Directions">
  <div class="group" id="dirs"></div>
  <div class="group" id="views"></div>
  <span class="spacer"></span>
  <div class="group">
    <button id="theme" type="button" aria-label="Switch theme">Light / Dark</button>
  </div>
  <p class="note" id="note"></p>
</div>

<div class="app" id="app">
  <div class="head"><div class="mono">C:\proj\firmware-v2</div><div class="mono">D:\backup\firmware-v2</div></div>
  <div class="bar" id="bar"></div>
  <div id="view"></div>
</div>
<div class="legend" id="legend"></div>

<script>
/** Sample compare rows: depth, name, kind per side (f file, d folder, null missing), status, sizes in bytes, times. */
const ROWS = [

  const ka = new Array(n).fill(true), kb = new Array(m).fill(true);
  for (let i = 0, j = 0; i < n && j < m;) {
    if (A[i] === B[j]) { ka[i] = kb[j] = false; i++; j++; } else if (T[i + 1][j] >= T[i][j + 1]) i++; else j++;
  }
  const spread = (toks, keep) => toks.flatMap((t, i) => Array(t.length).fill(keep[i] && /\S/.test(t)));
  return [spread(A, ka), spread(B, kb)];
}

/** Renders a line with syntax colours and, where `changed` is set, the changed-word mark. */
function codeHtml(line, changed) {
  if (!line) return "";
  const cls = syntax(line);
  let out = "", i = 0;
  while (i < line.length) {
    const c = cls[i], w = changed ? changed[i] : false;
    let j = i;
    while (j < line.length && cls[j] === c && (changed ? changed[j] : false) === w) j++;
    const text = esc(line.slice(i, j));
    const inner = c ? `<span class="${c}">${text}</span>` : text;
    out += w ? `<span class="w">${inner}</span>` : inner;
    i = j;
  }
  return out;
}

/** Adds line numbers and word marks to every pair. */
function prepared() {
  let ln = 0, rn = 0;
  return PAIRS.map(p => {
    const q = { ...p, ln: p.l != null ? ++ln : "", rn: p.r != null ? ++rn : "" };
    if (p.k === "chg") [q.wl, q.wr] = wordDiff(p.l, p.r);
    return q;
  });
}

/** Unchanged runs longer than this fold in direction 4. */
const FOLD_AT = 2;

/** Groups pairs; in direction 4 long same-runs become one fold entry. */
function grouped(rows) {
  if (state.dir !== "4") return rows;
  const out = []; let run = [];
  const flush = () => { if (run.length > FOLD_AT) out.push({ fold: run.length }); else out.push(...run); run = []; };
  rows.forEach(r => { if (r.k === "same") run.push(r); else { flush(); out.push(r); } });
  flush();
  return out;
}

function fileBar() {
  const c = PAIRS.filter(p => p.k !== "same");
  const n = k => c.filter(p => p.k === k).length;
  return `<button type="button" data-view="folder">← Folders</button>
    <span class="path mono">src/main.c</span>
    <span class="stat"><b class="t-chg" style="color:var(--t)">≠ ${n("chg")}</b> changed · <b class="t-add" style="color:var(--t)">→ ${n("add")}</b> added · <b class="t-del" style="color:var(--t)">← ${n("del")}</b> removed</span>
    <span class="spacer"></span>
    <span class="stat"><span class="kbd">Alt+↓</span> next change</span>
    <button type="button" data-wrap="1" aria-pressed="${state.wrap}">Wrap ${state.wrap ? "on" : "off"} <span class="kbd">Alt+Z</span></button>`;
}

const narrow = () => matchMedia("(max-width: 720px)").matches;

function fileView() {
  const rows = grouped(prepared());
  const unified = state.dir === "3" || narrow();
  const body = unified ? unifiedView(rows) : state.wrap ? wrapView(rows) : splitView(rows);
  const hint = state.wrap
    ? "Wrap on: long lines break inside their column; both sides keep the same row height."
    : unified ? "Wrap off: the code scrolls sideways; line numbers stay put."
    : "Wrap off: both sides scroll sideways together (Shift+wheel, touchpad, or the bar under each side); line numbers stay put.";
  return `<div class="code fd${state.dir}">${body}</div><div class="hint">${hint}${narrow() && state.dir !== "3" ? " At phone width every direction shows one column." : ""}</div>`;
}

function splitView(rows) {
  const gut = state.dir === "2";
  const side = s => {
    const nums = rows.map(r => r.fold ? `<div></div>` : `<div>${s ? r.rn : r.ln}</div>`).join("");
    const lines = rows.map(r => {
      if (r.fold) return `<div class="ln fold-line">··· ${r.fold} unchanged lines</div>`;
      const text = s ? r.r : r.l;
      if (text == null) return `<div class="ln gap"></div>`;
      const tint = r.k !== "same" ? " tinted" : "";
      return `<div class="ln tone ${TONE[r.k]}${tint}">${codeHtml(text, s ? r.wr : r.wl) || " "}</div>`;
    }).join("");
    return `<div class="side"><div class="nums">${nums}</div><div class="hs" data-sync><div class="lines">${lines}</div></div></div>`;
  };
  if (!gut) return `<div class="split">${side(0)}${side(1)}</div>`;
  const g = rows.map(r => r.fold || r.k === "same" ? `<div></div>` : `<div class="${TONE[r.k]}"><span class="gchip">${GSIGN[r.k]}</span></div>`).join("");
  const ticks = rows.map((r, i) => r.fold || r.k === "same" ? "" :
    `<span class="tick ${TONE[r.k]}" style="top:${i / rows.length * 100}%;height:${100 / rows.length}%"></span>`).join("");
  return `<div class="split has-gut">${side(0)}<div class="gutcol">${g}</div>${side(1)}<div class="mapcol" aria-hidden="true">${ticks}</div></div>`;
}

function wrapView(rows) {
  const gut = state.dir === "2";
  const cell = (r, s) => {
    const text = s ? r.r : r.l;
    if (text == null) return `<div class="c gap"></div>`;
    return `<div class="c tone ${TONE[r.k]}${r.k !== "same" ? " tinted" : ""}">${codeHtml(text, s ? r.wr : r.wl) || " "}</div>`;
  };
  const html = rows.map(r => {
    if (r.fold) return `<div class="fold-line" style="grid-column:1/-1">··· ${r.fold} unchanged lines</div>`;
    const g = gut ? `<div class="g ${TONE[r.k]}">${r.k === "same" ? "" : `<span class="gchip">${GSIGN[r.k]}</span>`}</div>` : "";
    return `<div class="n">${r.ln}</div>${cell(r, 0)}${g}<div class="n">${r.rn}</div>${cell(r, 1)}`;
  }).join("");
  return `<div class="wrapgrid${gut ? " has-gut" : ""}">${html}</div>`;
}

/** One column: a changed pair becomes a removed line then an added line. */
function unifiedView(rows) {
  const lines = [];
  rows.forEach(r => {
    if (r.fold) { lines.push({ fold: r.fold }); return; }
    if (r.k === "same") lines.push({ o: r.ln, n: r.rn, s: " ", t: "t-same", text: r.l });
    if (r.k === "del" || r.k === "chg") lines.push({ o: r.ln, n: "", s: "−", t: "t-del", text: r.l, w: r.wl });
    if (r.k === "add" || r.k === "chg") lines.push({ o: "", n: r.rn, s: "+", t: "t-add", text: r.r, w: r.wr });
  });
  const tint = l => l.t !== "t-same" ? " tinted" : "";
  if (state.wrap) {
    return `<div class="uni wrap">` + lines.map(l => l.fold
      ? `<div class="fold-line">··· ${l.fold} unchanged lines</div>`
      : `<div class="urow tone ${l.t}${tint(l)}"><span>${l.o}</span><span>${l.n}</span><span class="sign">${l.s}</span><div class="c">${codeHtml(l.text, l.w) || " "}</div></div>`).join("") + `</div>`;
  }
  const nums = lines.map(l => l.fold ? `<div></div>` : `<div class="${l.t}"><span>${l.o}</span><span>${l.n}</span><span class="sign">${l.s}</span></div>`).join("");
  const code = lines.map(l => l.fold ? `<div class="ln fold-line">··· ${l.fold} unchanged lines</div>`
    : `<div class="ln tone ${l.t}${tint(l)}">${codeHtml(l.text, l.w) || " "}</div>`).join("");
  return `<div class="uni"><div class="unums">${nums}</div><div class="hs"><div class="lines">${code}</div></div></div>`;
}

/** Keeps the two sides' sideways scroll in step. */
function syncScroll() {
  const panes = [...document.querySelectorAll("[data-sync]")];
  let busy = false;
  panes.forEach(p => p.addEventListener("scroll", () => {
    if (busy) return; busy = true;
    panes.forEach(o => { if (o !== p) o.scrollLeft = p.scrollLeft; });
    requestAnimationFrame(() => { busy = false; });
  }, { passive: true }));
}

document.addEventListener("keydown", e => {
  if (e.altKey && (e.key === "z" || e.key === "Z") && state.view === "file") { e.preventDefault(); state.wrap = !state.wrap; render(); }
  else if (e.key === "Enter" && e.target.dataset && e.target.dataset.file) { state.view = "file"; render(); }
  else if (e.key === "Escape" && state.view === "file") { state.view = "folder"; render(); }
});
let lastNarrow = narrow();
addEventListener("resize", () => { if (narrow() !== lastNarrow) { lastNarrow = narrow(); render(); } });
render();
</script>
</body>
</html>
