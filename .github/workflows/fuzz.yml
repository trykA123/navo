name: fuzz

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "Fuzzing duration per target in seconds"
        required: false
        default: "600"
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - pipe_frame
          - automotive
          - npp_language
          - archive_listing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
        with:
          toolchain: nightly-2026-11-01
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: fuzz-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            .
            fuzz
      - name: Fuzz ${{ matrix.target }}
        env:
          SECONDS: ${{ inputs.seconds || '600' }}
        run: |
          cd fuzz
          cargo +nightly-2026-11-01 fuzz run ${{ matrix.target }} -- -max_total_time=$SECONDS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
