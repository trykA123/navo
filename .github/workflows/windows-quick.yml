name: windows-quick

# Clippy and the Windows test suite for one branch, run by hand; no Linux gate, no release build.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  NAVO_EXPECT_PDFIUM: "1"
  PDFIUM_TAG: chromium/8076
  PDFIUM_SHA256: 808d36da9bc5a3104315fb307c80998121f565ee53953633bf33e80d7429e5ac

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.148
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Put pdfium.dll next to the test build of navo.exe
        shell: pwsh
        run: ./.github/scripts/fetch-pdfium.ps1 -Destination target/debug
      - run: cargo nextest run --workspace --profile ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-windows-quick
          path: target/nextest/ci/junit.xml
