name: bench-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tool tag, for example bench-2026-11-03"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bench-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Tag is a bench tag that does not exist yet
        shell: pwsh
        run: |
          if ($env:TAG -cnotmatch '^bench-\d{4}-\d{2}-\d{2}[a-z]?$') { throw "bad tag: $env:TAG" }
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "release $env:TAG exists" }
          exit 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - run: cargo build --release --locked -p navo-bench
      - name: Build the tester exe
        run: cargo build --release --locked -p navo-app --features tester
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=navo --remap-path-prefix=${{ env.CARGO_HOME }}=cargo -C target-feature=+crt-static -C link-arg=/STACK:8388608
      - run: cargo build --release --locked -p navo-index-service
      - name: Tracy hook is still in the vendored client
        shell: pwsh
        run: |
          $meta = cargo metadata --format-version 1 --locked | ConvertFrom-Json
          $pkg = @($meta.packages | Where-Object { $_.name -ceq 'tracy-client-sys' })
          if ($pkg.Count -ne 1) { throw "expected one tracy-client-sys, found $($pkg.Count)" }
          $dir = Split-Path -Parent $pkg[0].manifest_path
          foreach ($rel in 'tracy/common/TracySystem.cpp', 'tracy/client/TracyProfiler.cpp') {
            if (-not (Select-String -LiteralPath (Join-Path $dir $rel) -SimpleMatch -Quiet 'TRACY_HAS_CUSTOM_USER_INFO')) {
              throw "$rel lacks TRACY_HAS_CUSTOM_USER_INFO"
            }
          }
      - name: Make CARGO_HOME visible to later steps
        shell: pwsh
        run: |
          if (-not $env:CARGO_HOME) { "CARGO_HOME=$HOME\.cargo" | Add-Content -Path $env:GITHUB_ENV }
      - name: Build the trace build
        run: cargo build --release --locked -p navo-app --features tester,tracy --target-dir target/tracy
        env:
          TRACY_CLIENT_SYS_CXXFLAGS: -FI${{ github.workspace }}\crates\navo-diag\tracy\navo_tracy_user.hpp -d1trimfile:${{ github.workspace }}\
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=navo --remap-path-prefix=${{ env.CARGO_HOME }}=cargo -C target-feature=+crt-static -C link-arg=/STACK:8388608
      - name: Tracy tools (v0.14.1, pinned hashes)
        shell: pwsh
        run: |
          $base = 'https://github.com/wolfpld/tracy'
          $zip = Join-Path $env:RUNNER_TEMP 'tracy-windows.zip'
          Invoke-WebRequest -Uri "$base/releases/download/v0.14.1/windows-0.14.1.zip" -OutFile $zip
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower() -ne 'f7499d74914aa3ba94a2c1ce72f36477d7b61d9d0f7c9790e05274c258c97fb5') { throw 'Tracy zip hash differs' }
          $lic = Join-Path $env:RUNNER_TEMP 'tracy-LICENSE'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/wolfpld/tracy/v0.14.1/LICENSE' -OutFile $lic
          if ((Get-FileHash -Algorithm SHA256 $lic).Hash.ToLower() -ne '27ab6b51e57f7e263a6e953d9c8984cd26e69d2f7606bde81e4b3048acf30732') { throw 'Tracy licence hash differs' }
          $out = Join-Path $env:RUNNER_TEMP 'tracy-windows'
          Expand-Archive -LiteralPath $zip -DestinationPath $out
          New-Item -ItemType Directory -Force -Path bench | Out-Null
          foreach ($exe in 'tracy-capture.exe', 'tracy-csvexport.exe', 'tracy-profiler.exe') {
            $f = Get-ChildItem -LiteralPath $out -Recurse -File -Filter $exe
            if (@($f).Count -ne 1) { throw "$exe is not in the Tracy v0.14.1 asset" }
            Copy-Item -LiteralPath $f.FullName -Destination bench
          }
          Copy-Item -LiteralPath $lic -Destination bench/TRACY-LICENSE.txt
          Copy-Item -LiteralPath target/tracy/release/navo.exe -Destination bench/navo-tracy.exe
      - name: Prove Tracy is only in the trace build
        shell: pwsh
        run: |
          $with = (cargo tree -p navo-app -e features --features tester,tracy) -join "`n"
          if ($with -cnotmatch 'tracy-client') { throw 'tester,tracy tree lacks tracy-client' }
          $without = (cargo tree -p navo-app -e features --features tester) -join "`n"
          if ($without -cmatch 'tracy-client') { throw 'tester tree holds tracy-client' }
          $latin1 = [Text.Encoding]::Latin1
          # Both encodings are searched as Latin-1 text, so one ordinal IndexOf finds either.
          function Find-Needle([string]$file, [string]$needle) {
            $text = $latin1.GetString([IO.File]::ReadAllBytes($file))
            $ascii = $latin1.GetString([Text.Encoding]::ASCII.GetBytes($needle))
            $wide = $latin1.GetString([Text.Encoding]::Unicode.GetBytes($needle))
            return $text.Contains($ascii, [StringComparison]::Ordinal) -or $text.Contains($wide, [StringComparison]::Ordinal)
          }
          if (-not (Find-Needle 'bench/navo-tracy.exe' 'TRACY_PORT')) { throw 'navo-tracy.exe lacks TRACY_PORT' }
          if (Find-Needle 'target/release/navo.exe' 'TRACY_PORT') { throw 'tester navo.exe holds TRACY_PORT' }
          $needles = 'runneradmin', 'D:\a\', 'C:\Users\', '\.cargo\registry'
          $bad = 0
          foreach ($file in 'bench/navo-tracy.exe', 'target/release/navo.exe') {
            foreach ($n in $needles) {
              if (Find-Needle $file $n) { Write-Host "::error::$file holds '$n'"; $bad++ }
            }
          }
          foreach ($file in 'bench/tracy-capture.exe', 'bench/tracy-csvexport.exe', 'bench/tracy-profiler.exe') {
            foreach ($n in $needles) {
              if (Find-Needle $file $n) { Write-Host "upstream tool $file holds '$n' (listed only)" }
            }
          }
          if ($bad -gt 0) { throw "$bad forbidden strings in the shipped exes" }
      - name: Stage the tool
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bench | Out-Null
          Copy-Item -LiteralPath target/release/navo-bench.exe -Destination bench
          Copy-Item -LiteralPath target/release/navo.exe -Destination bench
          Copy-Item -LiteralPath target/release/navo-index.exe -Destination bench
          Copy-Item -LiteralPath crates/navo-bench/README.txt -Destination bench
          Compress-Archive -Path bench/* -DestinationPath navo-bench-tester.zip
          (Get-FileHash -Algorithm SHA256 navo-bench-tester.zip).Hash.ToLower() + '  navo-bench-tester.zip' | Set-Content SHA256SUMS.txt
      - name: Publish the pre-release
        shell: pwsh
        run: |
          gh release create $env:TAG navo-bench-tester.zip SHA256SUMS.txt `
            --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease `
            --title "navo-bench (tester tool, not part of Navo)" `
            --notes "A measuring tool for testers, not part of Navo and not an update. It reads the folder you choose, writes only into its own scratch folder and a new report folder, and the report holds numbers only: no file or folder names, paths or user names. Unzip, run navo-bench.exe, send report.html and report.json."
