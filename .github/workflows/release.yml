name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag vX.Y.Z, equal to the workspace version in Cargo.toml, for example v0.1.0"
        required: true
        type: string
      full-checks:
        description: "Also run Windows clippy and tests here (main is already checked in the Windows VM before every push)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PDFIUM_TAG: chromium/8076
  PDFIUM_SHA256: 808d36da9bc5a3104315fb307c80998121f565ee53953633bf33e80d7429e5ac
  KEEP_RELEASES: 5
  VPK_VERSION: 1.2.161
  PACK_ID: NavoApp
  CHANNEL: win

jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Tag name is valid and unused
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag: $TAG (use vX.Y.Z)"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "release $TAG exists"; exit 1; fi

  clippy-windows:
    needs: check-tag
    if: inputs.full-checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  gate-windows:
    needs: check-tag
    if: inputs.full-checks
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      NAVO_EXPECT_PDFIUM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.148
      - name: Put pdfium.dll next to the test build of navo.exe
        shell: pwsh
        run: ./.github/scripts/fetch-pdfium.ps1 -Destination target/debug
      - run: cargo nextest run --workspace --profile ci
      - run: cargo test -p gpui-pre-windows --lib
      - run: cargo test --workspace --doc

  build-windows:
    needs: check-tag
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Tag is vX.Y.Z
        shell: pwsh
        run: |
          if (-not ($env:TAG -cmatch '^v\d+\.\d+\.\d+$')) { throw "tag $env:TAG is not vX.Y.Z" }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release -p navo-app
        env:
          NAVO_BUILD: ${{ inputs.tag }}
      - name: Binary size
        run: cargo xtask binsize target/release/navo.exe
      - shell: pwsh
        run: |
          $out = (& target/release/navo.exe --version | Out-String).Trim()
          # The tag must match the workspace version, so the app, the package and the tag agree.
          if ($out -ne "navo $($env:TAG.Substring(1))") { throw "navo prints '$out' but the tag is $env:TAG: bump the workspace version first" }
      - name: Stage navo.exe with its PDB, pdfium.dll and licences
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath target/release/navo.exe -Destination dist
          Copy-Item -LiteralPath target/release/navo.pdb -Destination dist
          ./.github/scripts/fetch-pdfium.ps1 -Destination dist -Licenses dist/licenses/pdfium
      - name: Verify release crash backtrace from the staged distribution
        timeout-minutes: 2
        shell: pwsh
        run: |
          $crashProfile = Join-Path $env:RUNNER_TEMP ('navo-crash-' + [guid]::NewGuid())
          $env:NAVO_CRASH_TEST = '1'
          $exe = (Resolve-Path -LiteralPath dist/navo.exe).Path
          Rename-Item -LiteralPath target/release/navo.pdb -NewName navo.pdb.saved
          try {
            $probe = Start-Process -FilePath $exe -ArgumentList @('--crash-test', "`"$crashProfile`"") -Wait -PassThru -NoNewWindow
          } finally {
            Rename-Item -LiteralPath target/release/navo.pdb.saved -NewName navo.pdb
          }
          if ($probe.ExitCode -ne 101) { throw "unexpected crash probe exit: $($probe.ExitCode)" }
          $records = @(Get-ChildItem -LiteralPath "$crashProfile/data/logs" -Filter 'crash-*.json')
          if ($records.Count -ne 1) { throw "expected one crash record, got $($records.Count)" }
          $record = Get-Content -LiteralPath $records[0].FullName -Raw | ConvertFrom-Json
          if ($record.message -ne 'Navo CI crash test') { throw 'unexpected panic message' }
          if ($record.backtrace -notmatch 'navo::crash_test\r?\n\s+at [^\r\n]*main\.rs:\d+') { throw 'release backtrace has no Navo crash_test frame with its source location' }
      - name: Install vpk
        shell: pwsh
        run: |
          dotnet tool install vpk --version $env:VPK_VERSION --tool-path "$env:RUNNER_TEMP/vpk"
          if ($LASTEXITCODE -ne 0) { throw "vpk install failed with $LASTEXITCODE" }
      - name: Pack with Velopack
        shell: pwsh
        run: |
          # The package version is the Cargo version that navo prints; the build step checked it equals the tag.
          $banner = (& dist/navo.exe --version | Out-String).Trim()
          if ($banner -notmatch '^navo (\d+\.\d+\.\d+)$') { throw "unexpected version output: $banner" }
          $version = $Matches[1]
          Write-Output "package version $version"
          "PACK_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path out | Out-Null
          & "$env:RUNNER_TEMP/vpk/vpk.exe" pack --packId $env:PACK_ID --packVersion $version --packTitle Navo --packDir dist --mainExe navo.exe --icon assets/brand/navo.ico --channel $env:CHANNEL --runtime win-x64 --outputDir out
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed with $LASTEXITCODE" }
          Copy-Item -LiteralPath dist/navo.exe -Destination out
          Compress-Archive -LiteralPath target/release/navo.pdb -DestinationPath out/navo-windows-x64-pdb.zip
          Get-ChildItem out | Format-Table Name, Length
      - name: Check the release feed
        shell: pwsh
        run: |
          $feed = Get-Content -LiteralPath "out/releases.$env:CHANNEL.json" -Raw | ConvertFrom-Json
          $assets = @($feed.Assets)
          if ($assets.Count -ne 1) { throw "expected one feed asset, got $($assets.Count)" }
          $asset = $assets[0]
          if ($asset.Type -ne 'Full') { throw "feed asset type is $($asset.Type), not Full" }
          if ($asset.Version -ne $env:PACK_VERSION) { throw "feed version $($asset.Version) is not $env:PACK_VERSION" }
          $pkg = Join-Path out $asset.FileName
          if (-not (Test-Path -LiteralPath $pkg)) { throw "feed names a missing package: $($asset.FileName)" }
          $hash = (Get-FileHash -LiteralPath $pkg -Algorithm SHA256).Hash
          if ($asset.SHA256 -ne $hash) { throw "feed SHA256 $($asset.SHA256) does not match the package $hash" }
          $size = (Get-Item -LiteralPath $pkg).Length
          if ($asset.Size -ne $size) { throw "feed size $($asset.Size) does not match the package $size" }
      - name: Verify the portable package
        timeout-minutes: 2
        shell: pwsh
        run: |
          $portable = Join-Path $env:RUNNER_TEMP 'portable'
          Expand-Archive -LiteralPath "out/$env:PACK_ID-$env:CHANNEL-Portable.zip" -DestinationPath $portable
          $app = Join-Path $portable 'current'
          foreach ($path in 'navo.exe', 'pdfium.dll', 'licenses/pdfium/LICENSE') {
            if (-not (Test-Path -LiteralPath (Join-Path $app $path))) { throw "$path is missing from the portable package" }
          }
          $out = (& (Join-Path $app 'navo.exe') --version | Out-String).Trim()
          if ($out -ne "navo $env:PACK_VERSION") { throw "unexpected output from the portable package: $out" }
          foreach ($name in "$env:PACK_ID-$env:CHANNEL-Setup.exe", "releases.$env:CHANNEL.json", 'RELEASES', 'navo.exe', 'navo-windows-x64-pdb.zip') {
            if (-not (Test-Path -LiteralPath "out/$name")) { throw "missing out/$name" }
          }
          if (-not (Get-ChildItem -LiteralPath out -Filter '*-full.nupkg')) { throw 'missing the full nupkg' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: navo-windows-x64-${{ github.sha }}
          path: out/
          if-no-files-found: error

  publish:
    needs: [clippy-windows, gate-windows, build-windows]
    # Skipped checks count as passed; a failed or cancelled one stops the release.
    if: >-
      always() && needs.build-windows.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.clippy-windows.result)
      && contains(fromJSON('["success","skipped"]'), needs.gate-windows.result)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: navo-windows-x64-${{ github.sha }}
          path: navo
      - name: Write the checksums
        working-directory: navo
        run: sha256sum -- * > SHA256SUMS.txt
      - name: Create the pre-release
        working-directory: navo
        run: |
          gh release create "$TAG" ./* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "$TAG" --notes "Build ${GITHUB_SHA::8}. Notes follow."
      - name: Keep the newest releases
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[(env.KEEP_RELEASES | tonumber):] | .[].tagName' |
          while read -r old; do
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
