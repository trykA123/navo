[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
blake3 = "=1.8.7"
fastcdc = "=5.0.0"
dua-core = "=6.1.0"
fluent-syntax = "0.12.0"
ignore = "=0.4.34"
imara-diff = "=0.2.0"
memmap2 = "=0.9.12"
navo-core = { path = "../crates/navo-core" }
navo-fs = { path = "../crates/navo-fs" }
navo-icons = { path = "../crates/navo-icons" }
navo-index = { path = "../crates/navo-index" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "=0.11.1"
similar = "=3.2.1"
toml = "1.2.1"
xxhash-rust = { version = "=0.8.19", features = ["xxh3"] }

[dev-dependencies]
flate2 = { version = "=1.1.11", default-features = false, features = [
  "rust_backend",
] }
tar = { version = "=0.4.46", default-features = false }

[lints]
workspace = true
