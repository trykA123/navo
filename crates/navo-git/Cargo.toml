[package]
name = "navo-git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
gix-config = { version = "=0.62.2", default-features = false, features = ["sha1", "sha256"] }
gix-discover = { version = "=0.57.1", default-features = false, features = ["sha1", "sha256"] }
gix = { version = "=0.90.0", default-features = false, features = ["sha1", "revision", "status"] }
navo-compare = { path = "../navo-compare" }
navo-shell = { path = "../navo-shell" }
sha2 = "=0.10.9"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
