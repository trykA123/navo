# Sidewise's write journal: durable job logs with a backup of the old bytes, recovery and undo.
[package]
name = "sidewise-journal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
blake3 = "=1.8.7"
navo-core = { package = "sidewise-core", path = "../sidewise-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sidewise-fs = { path = "../sidewise-fs" }

[dev-dependencies]
proptest = "1.12.0"
# `FaultDisk` for the job fault and crash loops.
sidewise-fs = { path = "../sidewise-fs", features = ["test-support"] }
tempfile = "3.27.0"

[lints]
workspace = true
