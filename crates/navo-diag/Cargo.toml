[package]
name = "navo-diag"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
tracy = ["dep:tracy-client", "dep:tracing-tracy"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-tracy = { version = "=0.12.0", default-features = false, optional = true }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
tracy-client = { version = "=0.19.0", default-features = false, features = ["enable"], optional = true }
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
tempfile = "3.27.0"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }

[lints]
workspace = true
