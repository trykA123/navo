# Built-in terminal sessions: PTY processes, shell detection and the terminal grid.
[package]
name = "navo-term"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
test-support = []

[dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
getrandom = "0.4.3"
parking_lot = "=0.12.5"
portable-pty = "=0.9.0"
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
navo-term = { path = ".", features = ["test-support"] }

[lints]
workspace = true
