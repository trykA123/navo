[package]
name = "navo-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "navo"
path = "src/main.rs"

[features]
mimalloc = ["dep:mimalloc"]
tester = ["navo-ui/tester"]
tracy = ["navo-diag/tracy"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
encoding_rs = "0.8.42"
mimalloc = { version = "=0.1.52", optional = true, default-features = false }
navo-cache = { path = "../navo-cache" }
navo-clipboard = { path = "../navo-clipboard" }
navo-compare = { path = "../navo-compare" }
navo-core = { path = "../navo-core" }
navo-diag = { path = "../navo-diag" }
navo-fs = { path = "../navo-fs" }
navo-git = { path = "../navo-git" }
navo-index = { path = "../navo-index" }
navo-l10n = { path = "../navo-l10n" }
navo-pdf = { path = "../navo-pdf" }
navo-retention = { path = "../navo-retention" }
navo-shell = { path = "../navo-shell" }
navo-store = { path = "../navo-store" }
navo-ui = { path = "../navo-ui" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "registry", "std"] }
velopack = "=1.2.161"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[target.'cfg(windows)'.dependencies]
gpui-pre-windows = "=0.3.9"
tray-icon = { version = "=0.26.1", default-features = false }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_RemoteDesktop",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
gpui-kit = { version = "=0.7.3", features = ["test-support"] }
navo-store = { path = "../navo-store", features = ["test-support"] }
insta = "1.49.0"
navo-index = { path = "../navo-index", features = ["test-support"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[build-dependencies]
embed-resource = "3.0.12"

[lints]
workspace = true
