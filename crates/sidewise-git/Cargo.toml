# The sidewise-git crate: in-process, read-only local Git reads for Sidewise.
[package]
name = "sidewise-git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
test-support = ["dep:tempfile"]

[dependencies]
sidewise-core = { path = "../sidewise-core" }
sidewise-engine = { path = "../sidewise-engine" }
gix = { version = "=0.90.0", default-features = false, features = ["sha1", "revision", "parallel", "attributes"] }
tempfile = { version = "3.27.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true