[package]
name = "navo-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# `object` is used by navo-automotive's ELF fixture, pulled in with `#[path]`
# from `src/window_view/viewer/space/large.rs`; cargo-shear cannot follow it.
[package.metadata.cargo-shear]
ignored = ["object"]

[features]
tester = []

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
codebook-tree-sitter-latex = "=0.6.1"
flate2 = "=1.1.11"
futures = "0.3.34"
gpui-kit = { version = "=0.9.1", features = [
  "tree-sitter-astro",
  "tree-sitter-bash",
  "tree-sitter-c",
  "tree-sitter-cmake",
  "tree-sitter-cpp",
  "tree-sitter-csharp",
  "tree-sitter-css",
  "tree-sitter-diff",
  "tree-sitter-ejs",
  "tree-sitter-elixir",
  "tree-sitter-erb",
  "tree-sitter-go",
  "tree-sitter-graphql",
  "tree-sitter-html",
  "tree-sitter-java",
  "tree-sitter-javascript",
  "tree-sitter-jsdoc",
  "tree-sitter-kotlin",
  "tree-sitter-lua",
  "tree-sitter-make",
  "tree-sitter-markdown",
  "tree-sitter-php",
  "tree-sitter-proto",
  "tree-sitter-python",
  "tree-sitter-ruby",
  "tree-sitter-rust",
  "tree-sitter-scala",
  "tree-sitter-sql",
  "tree-sitter-svelte",
  "tree-sitter-swift",
  "tree-sitter-toml",
  "tree-sitter-tsx",
  "tree-sitter-typescript",
  "tree-sitter-yaml",
  "tree-sitter-zig",
] }
image = { version = "=0.25.10", default-features = false, features = [
  "bmp",
  "gif",
  "ico",
  "jpeg",
  "png",
  "tiff",
  "webp",
] }
kamadak-exif = "=0.6.2"
lofty = "=0.25.5"
raw-window-handle = "0.6.2"
resvg = "=0.49.0"
navo-automotive = { path = "../navo-automotive" }
navo-cache = { path = "../navo-cache" }
navo-core = { path = "../navo-core" }
navo-diag = { path = "../navo-diag" }
navo-fs = { path = "../navo-fs" }
navo-index = { path = "../navo-index" }
navo-l10n = { path = "../navo-l10n" }
navo-pdf = { path = "../navo-pdf" }
navo-retention = { path = "../navo-retention" }
navo-structured = { path = "../navo-structured" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
tracing = "0.1.44"
tree-sitter = "=0.26.13"
tree-sitter-asm = "=0.24.0"
tree-sitter-batch = "=0.11.1"
tree-sitter-c = "=0.24.2"
tree-sitter-containerfile = "=0.9.2"
tree-sitter-ini = "=1.4.0"
tree-sitter-json5-orchard = "=0.1.1"
tree-sitter-language = "=0.1.9"
tree-sitter-objc = "=3.0.2"
tree-sitter-powershell = "=0.26.6"
tree-sitter-properties = "=0.3.0"
tree-sitter-r = "=1.3.0"
tree-sitter-sequel = "=0.3.11"
tree-sitter-xml = "=0.7.0"
ts-parser-perl = "=2.0.5"
skrifa = { version = "=0.49.0", default-features = false, features = ["std"] }
unicode-width = "=0.2.2"
url = "=2.5.8"

[target.'cfg(windows)'.dependencies]
windows-version = "0.1.7"

[dev-dependencies]
gpui-kit = { version = "=0.9.1", features = ["test-support"] }
insta = "1.49.0"
object = { version = "=0.41.0", default-features = false, features = ["elf", "write_std"] }
proptest = "1.12.0"
navo-automotive = { path = "../navo-automotive", features = ["sample"] }
navo-syntax = { path = "../navo-syntax" }
tempfile = "3.27.0"

[lints]
workspace = true
