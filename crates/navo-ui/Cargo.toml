[package]
name = "navo-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# `object` is used by navo-automotive's ELF fixture, pulled in with `#[path]`
# from `src/window_view/viewer/space/large.rs`; cargo-shear cannot follow it.
[package.metadata.cargo-shear]
ignored = ["object"]

[features]
tester = []

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
flate2 = "=1.1.11"
futures = "0.3.34"
gpui-kit = "=0.9.1"
image = { version = "=0.25.10", default-features = false, features = [
  "bmp",
  "gif",
  "ico",
  "jpeg",
  "png",
  "tiff",
  "webp",
] }
kamadak-exif = "=0.6.2"
lofty = "=0.25.5"
raw-window-handle = "0.6.2"
resvg = "=0.49.0"
navo-automotive = { path = "../navo-automotive" }
navo-cache = { path = "../navo-cache" }
navo-core = { path = "../navo-core" }
navo-diag = { path = "../navo-diag" }
navo-fs = { path = "../navo-fs" }
navo-index = { path = "../navo-index" }
navo-l10n = { path = "../navo-l10n" }
navo-pdf = { path = "../navo-pdf" }
navo-retention = { path = "../navo-retention" }
navo-store = { path = "../navo-store" }
navo-syntax = { path = "../navo-syntax" }
sidewise-kit = { path = "../sidewise-kit" }
sidewise-ui = { path = "../sidewise-ui" }
navo-structured = { path = "../navo-structured" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
tracing = "0.1.44"
skrifa = { version = "=0.49.0", default-features = false, features = ["std"] }
unicode-width = "=0.2.2"
url = "=2.5.9"

[dev-dependencies]
gpui-kit = { version = "=0.9.1", features = ["test-support"] }
insta = "1.49.0"
object = { version = "=0.41.0", default-features = false, features = ["elf", "write_std"] }
proptest = "1.12.0"
navo-automotive = { path = "../navo-automotive", features = ["sample"] }
sidewise-kit = { path = "../sidewise-kit", features = ["test-support"] }
sidewise-ui = { path = "../sidewise-ui", features = ["test-support"] }
tempfile = "3.27.0"

[lints]
workspace = true
