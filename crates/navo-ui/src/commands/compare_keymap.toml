# Compare keys, split out so Sidewise's keymap can include them (NC11).
# One [[bind]] per command and context; every entry names a Compare context.

[[bind]]
command = "compare.next_difference"
keys = ["alt-down", "f7"]
context = "CompareView"

[[bind]]
command = "compare.previous_difference"
keys = ["alt-up", "shift-f7"]
context = "CompareView"

[[bind]]
command = "compare.copy_right"
keys = ["ctrl-alt-right"]
context = "CompareView"

[[bind]]
command = "compare.copy_left"
keys = ["ctrl-alt-left"]
context = "CompareView"

[[bind]]
command = "compare.exit"
keys = ["escape"]
context = "CompareView"

[[bind]]
command = "compare.stream"
keys = ["alt-f"]
context = "Compare"

[[bind]]
command = "compare.next_file"
keys = ["ctrl-alt-down"]
context = "CompareView"

[[bind]]
command = "compare.previous_file"
keys = ["ctrl-alt-up"]
context = "CompareView"

[[bind]]
command = "files.undo"
keys = ["ctrl-z"]
context = "CompareView"

[[bind]]
command = "compare.view_menu"
keys = ["alt-v"]
context = "CompareView"

[[bind]]
command = "viewer.line_up"
keys = ["up"]
context = "CompareView"

[[bind]]
command = "viewer.line_down"
keys = ["down"]
context = "CompareView"

[[bind]]
command = "viewer.page_up"
keys = ["pageup"]
context = "CompareView"

[[bind]]
command = "viewer.page_down"
keys = ["pagedown"]
context = "CompareView"

[[bind]]
command = "viewer.go_to_start"
keys = ["home", "ctrl-home"]
context = "CompareView"

[[bind]]
command = "viewer.go_to_end"
keys = ["end", "ctrl-end"]
context = "CompareView"

[[bind]]
command = "compare.changes"
keys = ["ctrl-b"]
context = "CompareView"

[[bind]]
command = "compare.details"
keys = ["ctrl-i"]
context = "CompareView"

[[bind]]
command = "compare.pick_down"
keys = ["shift-down"]
context = "CompareView"

[[bind]]
command = "compare.pick_up"
keys = ["shift-up"]
context = "CompareView"

[[bind]]
command = "compare.pick_toggle"
keys = ["space"]
context = "CompareView"

[[bind]]
command = "compare.remove_picked"
keys = ["ctrl-shift-delete"]
context = "CompareView"

[[bind]]
command = "compare.show_menu"
keys = ["menu", "shift-f10"]
context = "CompareView"

[[bind]]
command = "compare.toggle_wrap"
keys = ["alt-z"]
context = "CompareView"

[[bind]]
command = "viewer.scroll_left"
keys = ["left"]
context = "CompareView"

[[bind]]
command = "viewer.scroll_right"
keys = ["right"]
context = "CompareView"

[[bind]]
command = "compare.next_difference"
keys = ["j"]
context = "CompareStream"

[[bind]]
command = "compare.previous_difference"
keys = ["k"]
context = "CompareStream"

[[bind]]
command = "compare.next_file"
keys = ["shift-j", "ctrl-alt-down"]
context = "CompareStream"

[[bind]]
command = "compare.previous_file"
keys = ["shift-k", "ctrl-alt-up"]
context = "CompareStream"

[[bind]]
command = "compare.toggle_viewed"
keys = ["v"]
context = "CompareStream"

[[bind]]
command = "compare.fold"
keys = ["o"]
context = "CompareStream"

[[bind]]
command = "compare.open_file"
keys = ["enter"]
context = "CompareStream"

[[bind]]
command = "compare.search"
keys = ["/"]
context = "CompareStream"

[[bind]]
command = "compare.copy_all_left"
keys = ["ctrl-shift-left"]
context = "CompareStream"

[[bind]]
command = "compare.copy_all_right"
keys = ["ctrl-shift-right"]
context = "CompareStream"

[[bind]]
command = "files.undo"
keys = ["ctrl-z"]
context = "CompareStream"

[[bind]]
command = "find.result_up"
keys = ["up"]
context = "CompareOutline"

[[bind]]
command = "find.result_down"
keys = ["down"]
context = "CompareOutline"

[[bind]]
command = "find.go_to_result"
keys = ["enter"]
context = "CompareOutline"
