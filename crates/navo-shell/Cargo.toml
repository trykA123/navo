[package]
name = "navo-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# `windows_core` is reached only through the `implement` attribute in the
# Windows-only clipboard test; that macro expands to `::windows_core::...`.
[package.metadata.cargo-shear]
ignored = ["windows-core"]

[dependencies]
navo-core = { path = "../navo-core" }
thiserror = "2.0.21"
tracing = "0.1.44"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["event", "fs", "pipe"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_WNet",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "=0.62.2", features = [
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(windows)'.dev-dependencies]
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = [
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
] }
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true
