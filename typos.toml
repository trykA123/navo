[files]
extend-exclude = [
    "target/",
    "design/prototypes/",
    "design/showreel/",
    "vendor/",
    "crates/navo-syntax/src/builtin/rules/",
    # VM logs quote random Velopack temp names.
    "testing/installer-w1-report.md",
    "*.png",
    "*.ttf",
]

[default.extend-words]
wdth = "wdth"
flate = "flate"
recomandation = "recomandation"
alege = "alege"
rela = "rela"
ptd = "ptd"
fof = "fof"
filetimes = "filetimes"
tage = "tage"

[default.extend-identifiers]
BA = "BA"
BA_ = "BA_"
BA_DEF_ = "BA_DEF_"
BA_DEF_DEF_ = "BA_DEF_DEF_"
PNGs = "PNGs"
flate2 = "flate2"
# Velopack's random backup-folder suffix, quoted in the W1 report.
lDOUeEBO7UIvpoLK = "lDOUeEBO7UIvpoLK"

[type.md.extend-words]
Durin = "Durin"
ba = "ba"

[type.rust.extend-identifiers]
ALPH = "ALPH"
